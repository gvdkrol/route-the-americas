<style>
:root{--bg:#0f1720;--panel:#18222e;--panel2:#1f2c3a;--txt:#e8eef4;--muted:#9fb0c0;--line:#2a3846;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:22px 26px 6px}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.wrap{padding:0 26px 40px;max-width:1400px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0 18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .n{font-size:24px;font-weight:700}
.kpi .l{color:var(--muted);font-size:11px;margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:600}
.hint{font-weight:400;color:var(--muted);font-size:12px}
#map{height:560px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover td{background:rgba(255,255,255,.05)}
tr.sel td{background:rgba(255,255,255,.11)}
tr.total{font-weight:700}
tr.total td{border-top:2px solid var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}
.foot{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
.galhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gallery figure{margin:0;position:relative;cursor:pointer;border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:var(--panel2)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.gallery figure:hover img{transform:scale(1.06)}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column}
#lb img{max-width:92vw;max-height:82vh;border-radius:8px}
#lb .cap{color:#e8eef4;margin-top:12px;font-size:14px}
#lb .x{position:absolute;top:18px;right:24px;font-size:30px;color:#fff;cursor:pointer}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;color:#fff;cursor:pointer;padding:0 22px;user-select:none;opacity:.7}
#lb .nav:hover{opacity:1}
#lbPrev{left:6px}#lbNext{right:6px}
.leaflet-popup-content{font-size:13px;line-height:1.4}
.leaflet-popup-content img{width:180px;border-radius:6px;margin-top:6px;display:block}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>

});

// ---------- Lightbox ----------
let lbList=[], lbIdx=0;
function openLb(i){lbIdx=i;showLb();document.getElementById('lb').style.display='flex';}
function showLb(){const p=lbList[lbIdx];document.getElementById('lbimg').src=p.file;document.getElementById('lbcap').textContent=`${p.trip} · ${p.place||''} · ${p.date||''}  (${lbIdx+1}/${lbList.length})`;}
function stepLb(d){lbIdx=(lbIdx+d+lbList.length)%lbList.length;showLb();}
function closeLb(){document.getElementById('lb').style.display='none';}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
document.addEventListener('keydown',e=>{const lb=document.getElementById('lb');if(lb.style.display!=='flex')return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')stepLb(1);if(e.key==='ArrowLeft')stepLb(-1);});

// ---------- Slicer via table ----------
function pick(label){ SEL = (SEL===label)?null:label; render(); }

function render(){
  const sub = SEL?trips.filter(t=>t.label===SEL):trips;
  // KPIs
  const steps=sub.flatMap(t=>t.steps);
  const cn=new Set(steps.map(s=>s.country).filter(c=>c&&c!=='00'));
  const km=sub.reduce((s,t)=>s+t.km,0), st=sub.reduce((s,t)=>s+t.step_count,0), dy=sub.reduce((s,t)=>s+days(t.start,t.end),0);
  const ph=SEL?photoCount(SEL):PHOTOS.length;
  document.getElementById('kpis').innerHTML=[['Totaal km',fmt(km)],['Stops',fmt(st)],['Reisdagen',fmt(dy)],['Trips',sub.length],['Landen',cn.size],["Foto's",ph]].map(k=>`<div class="kpi"><div class="n">${k[1]}</div><div class="l">${k[0]}</div></div>`).join('');
  // map
  const bounds=[];
  trips.forEach(t=>{
    const show=!SEL||t.label===SEL;
    [routeLayers,photoLayers].forEach(L2=>{const lyr=L2[t.label];if(show)lyr.addTo(map);else map.removeLayer(lyr);});
    if(show){t.track.forEach(p=>bounds.push(p));t.steps.forEach(s=>{if(s.lat!=null)bounds.push([s.lat,s.lon]);});}
  });
  if(bounds.length)map.fitBounds(bounds,{padding:[20,20]});
  // table (clickable slicer)
  const totKm=trips.reduce((s,t)=>s+t.km,0), totSt=trips.reduce((s,t)=>s+t.step_count,0), totDy=trips.reduce((s,t)=>s+days(t.start,t.end),0);
  document.querySelector('#tbl tbody').innerHTML=trips.map(t=>`<tr class="${t.label===SEL?'sel':''}" onclick="pick('${t.label}')"><td><span class="dot" style="background:${t.color}"></span>${t.label}</td><td>${t.start} – ${t.end}</td><td class="num">${days(t.start,t.end)}</td><td class="num">${fmt(t.km)}</td><td class="num">${t.step_count}</td><td class="num">${avgTemp(t).toFixed(1)}</td><td class="num">${photoCount(t.label)}</td></tr>`).join('')+
    `<tr class="total ${!SEL?'sel':''}" onclick="SEL=null;render();"><td>Alle reizen</td><td></td><td class="num">${totDy}</td><td class="num">${fmt(totKm)}</td><td class="num">${totSt}</td><td class="num">—</td><td class="num">${PHOTOS.length}</td></tr>`;
  // gallery
  lbList = SEL?PHOTOS.filter(p=>p.trip===SEL):PHOTOS;
  document.getElementById('gTitle').textContent="Foto's"+(SEL?` · ${SEL}`:' · alle reizen');
  document.getElementById('gCount').textContent=lbList.length+" foto's";
  document.getElementById('gallery').innerHTML=lbList.map((p,i)=>`<figure onclick="openLb(${i})"><img src="${p.file}" loading="lazy" alt="${p.place||''}"><figcaption>${p.place||''} · ${p.date||''}</figcaption></figure>`).join('');
}
render();
</script>
</body>
