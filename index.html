": -103.733, "dt": 20160210, "ord": 258, "blogsnip": "Met de achterdeur op een kier slapen is een succes; beter geslapen, maar het is nog steeds klam. Langzaam wordt de camping wakker. Louis uit Quebec komt kletsen. En Lesley d’r Mexicaanse vriendin Kenny komt buurten. Met weer een kado; een geborduurd bloesje uit Oaxaca. Jeetje, wat lief.", "bloglink": "https://rondjewereld.nl/2016/02/10/laguna-la-maria/"}, {"titel": "Morril RV Park, Guanajuato, Mexico", "omschrijving": "", "wanneer": "feb 15, 2016", "icon": "campground", "kmstand": 193156, "tripkm": 40662, "land": "Mexico", "staat": "Guanajuato", "lat": 21.019, "lng": -101.257, "dt": 20160215, "ord": 259, "blogsnip": "We eten even een ontbijtje in de bus in de garage van het hotel en gaan dan met de stadsbus naar Guadalajara. Na wat vragen vinden we de halte. Openbaar vervoer is goed geregeld in Mexico; op de voorruit van de bussen staat, vaak met plakletters of geschilderd, waar ze …", "bloglink": "https://rondjewereld.nl/2016/02/15/guadalajara/"}, {"titel": "Tapalpa, Jalisco, Mexico", "omschrijving": "", "wanneer": "feb 11, 2016", "icon": "rec_lodging", "kmstand": 192620, "tripkm": 40126, "land": "Mexico", "staat": "Jalisco", "lat": 19.929, "lng": -103.761, "dt": 20160211, "ord": 260, "blogsnip": "Heerlijk geslapen, lekker koel. De zon is om 8 uur nog net niet boven de bergen uit. We pakken in en nemen afscheid van Rosie en Claus. Dan rijden we richting de vulkaan. Het is vandaag helderder weer, dus zien we de rookpluim uit de krater nu veel beter. We …", "bloglink": "https://rondjewereld.nl/2016/02/11/tapalpa/"}, {"titel": "Roca Azul, Jocotepec, Mexico", "omschrijving": "", "wanneer": "feb 12, 2016", "icon": "campground", "kmstand": 192743, "tripkm": 40249, "land": "Mexico", "staat": "Jalisco", "lat": 20.265971, "lng": -103.419824, "dt": 20160212, "ord": 261, "blogsnip": "Nadat we zijn uitgecheckt uit het frisse hotel, ontbijten we in de bus, die nog ongeschonden geparkeerd staat. Altijd leuk om naar mensen te loeren die de bus en de kentekenplaten bestuderen, zonder dat ze ons zien. We rijden Tapalpa uit om 5 km verderop Las Piedrotas te bekijken.", "bloglink": "https://rondjewereld.nl/2016/02/12/lago-de-chapala/"}, {"titel": "San Miguel de Allende, Mexico", "omschrijving": "", "wanneer": "feb 17, 2016", "icon": "campground", "kmstand": 193266, "tripkm": 40772, "land": "Mexico", "staat": "Guanajuato", "lat": 20.915, "lng": -100.745, "dt": 20160217, "ord": 262, "blogsnip": "Pas laat wakker, zeker moe van al het geslenter door de heuvelachtige stad. Brian komt afscheid nemen. Wij ontbijten en pakken in. Daarna rijden we de berg af naar de wasserette om de was op te halen. Pittig ritje, zeer steil en het lampje van de remmen gaat branden. Pfff …", "bloglink": "https://rondjewereld.nl/2016/02/17/san-miguel-de-allende/"}, {"titel": "El Rosario Mariposa", "omschrijving": "", "wanneer": "feb 18, 2016", "icon": "campground", "kmstand": 193522, "tripkm": 41028, "land": "Mexico", "staat": "Michoacán", "lat": 19.586983, "lng": -100.267652, "dt": 20160218, "ord": 263, "blogsnip": "We hoeven niet zo vroeg weg, dus skypen we en klussen we wat rond de bus. Met buurvrouw Connie uit Portugal wisselen we reiservaringen en –plannen uit. Na 11 uur gaan we weg. Door de bergen, af en toe een grote plaats of een gehucht. Na 2 uur rijden houden …", "bloglink": "https://rondjewereld.nl/2016/02/18/topemania/"}, {"titel": "Teotihuacan Trailer Park, Adolfo López Mateos, Teotihuacan Centro, Teotihuacán de Arista, State of Mexico", "omschrijving": "", "wanneer": "feb 20, 2016", "icon": "campground", "kmstand": 193825, "tripkm": 41331, "land": "Mexico", "staat": "Estado de México", "lat": 19.729, "lng": -98.843, "dt": 20160220, "ord": 264, "blogsnip": "Het is licht bewolkt aan het meer. Vandaag gaan we alleen maar rijden, dus hebben we geen haast. Al vroeg is het druk met waterskiën en bootjes. Bij onze camping worden boten gepoetst en in het water gelegd, zodat de rijke eigenaren zo kunnen gaan varen. We pakken in en …", "bloglink": "https://rondjewereld.nl/2016/02/20/drive-by-mexico-city/"}, {"titel": "Valle de Bravo", "omschrijving": "", "wanneer": "feb 19, 2016", "icon": "campground", "kmstand": 193630, "tripkm": 41136, "land": "Mexico", "staat": "Michoacán", "lat": 19.223636, "lng": -100.143962, "dt": 20160219, "ord": 265, "blogsnip": "Niet zo best geslapen. Vanwege de droge ijle lucht op 3.000 meter, waardoor je steeds dorst hebt. En omdat slapen op een parkeerterrein best een beetje spannend is, als een hond steeds aanslaat (om niks). Om half negen staan we op, ontbijten in de bus en aankleden. De restaurantjes en …", "bloglink": "https://rondjewereld.nl/2016/02/19/magical-mariposas/"}, {"titel": "Casa San Ildefonso", "omschrijving": "", "wanneer": "feb 23, 2016", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Ciudad de México", "lat": 19.43, "lng": -99.133, "dt": 20160223, "ord": 266, "blogsnip": "Vandaag gaan we naar Mexico City. Na het ontbijt pakken we in en lopen we richting busstation (een afdak verderop in de straat). Net buiten het hek van de camping zien we een bus aankomen met Ciudad Mexico erop. Gerhard zwaait en hij stopt. Mazzel, we kunnen zo instappen.", "bloglink": "https://rondjewereld.nl/2016/02/23/ciudad-mexico/"}, {"titel": "Cholula, Puebla, Mexico", "omschrijving": "", "wanneer": "feb 27, 2016", "icon": "campground", "kmstand": 193952, "tripkm": 41458, "land": "Mexico", "staat": "Puebla", "lat": 19.059, "lng": -98.306, "dt": 20160227, "ord": 267, "blogsnip": "Het is bewolkt en wat frisser. We moeten in ieder geval tot 11 uur wachten op de was. En rond Mexico City mag je voor 11 uur niet rijden met een buitenlands kenteken. Dus besteden we de ochtend aan klusjes; schoonmaken in de bus en op het dak. We betalen …", "bloglink": "https://rondjewereld.nl/2016/02/27/to-cholula/"}, {"titel": "JARDÍN BOTÁNICO HELIA BRAVO HOLLIS, Libramiento San Lorenzo - Tecnológico, Tehuacán", "omschrijving": "", "wanneer": "feb 29, 2016", "icon": "campground", "kmstand": 194125, "tripkm": 41631, "land": "Mexico", "staat": "Puebla", "lat": 18.468, "lng": -97.384, "dt": 20160229, "ord": 268, "blogsnip": "Rond 8 uur zijn we wakker. De douche is warm, dus meteen maar gebruik van maken, voordat je te laat bent. We skypen wat en rijden dan weg, richting het zuiden. Het gaat weer lekker snel, met twee uur zitten we in Tehuacan. Dit is niet echt een toeristenstad, maar …", "bloglink": "https://rondjewereld.nl/2016/02/29/jardin-botanico-tehuacan/"}, {"titel": "Oaxaca Campground, San Francisco Lachigolé, Oaxaca", "omschrijving": "", "wanneer": "Mar 1, 2016", "icon": "campground", "kmstand": 194384, "tripkm": 41890, "land": "Mexico", "staat": "Oaxaca", "lat": 17.066, "lng": -96.722, "dt": 20160301, "ord": 269, "blogsnip": "Prachtig om wakker te worden tussen de cactussen in de stilte. En dat op Gerhard z’n verjaardag. Wat een verrassing dat de douche gewoon warm is op z’n afgelegen plek. Voordat we wegrijden komt Andrés nog even gedag zeggen. Vandaag gaan we een flink stuk rijden. De tolweg loopt door …", "bloglink": "https://rondjewereld.nl/2016/03/01/we-re-in-oaxaca/"}, {"titel": "Benito Juárez, Oaxaca", "omschrijving": "", "wanneer": "Mar 4, 2016", "icon": "campground", "kmstand": 194476, "tripkm": 41982, "land": "Mexico", "staat": "Oaxaca", "lat": 17.11363, "lng": -96.490933, "dt": 20160304, "ord": 270, "blogsnip": "Vannacht heeft het flink geregend. Maar vanmorgen is het droog, wel nog flink bewolkt. Na ontbijt, douchen en inpakken rijden we naar El Tule. In dit kleine plaatsje staat de grootste boom ter wereld. Niet qua lengte, maar wat betreft omtrek met een diameter van ruim 14 meter.", "bloglink": "https://rondjewereld.nl/2016/03/04/benito-juarez/"}, {"titel": "Hierve el Agua, Oaxaca", "omschrijving": "", "wanneer": "Mar 5, 2016", "icon": "campground", "kmstand": 194543, "tripkm": 42049, "land": "Mexico", "staat": "Oaxaca", "lat": 16.865, "lng": -96.275, "dt": 20160305, "ord": 271, "blogsnip": "Die extra deken was wel nodig, want het is ’s nachts fris in de bergen. De condens staat op de ramen. Maar het is nu prachtig weer; stralend blauwe lucht en wolken in het dal. We zijn al vroeg op pad, weer een prachtige slingerende route via een dirtroad. Verderop …", "bloglink": "https://rondjewereld.nl/2016/03/05/hierve-el-agua-2/"}, {"titel": "Ranco Los Mangos, Zipolite, Oaxaca", "omschrijving": "", "wanneer": "Mar 7, 2016", "icon": "campground", "kmstand": 194844, "tripkm": 42350, "land": "Mexico", "staat": "Oaxaca", "lat": 15.665486, "lng": -96.52028, "dt": 20160307, "ord": 272, "blogsnip": "Vroeg op en de lucht is strak blauw. Eindelijk weer een douche. Een paar seconden loeiheet, daarna lauw/koud. Toch lekker. We ontbijten bij een tentje naast het hotel. Eieren met ham, maar wel weer met rijst, bonenprutje en verplichte tortillas. Voorlopig hoeven we niet meer te eten.", "bloglink": "https://rondjewereld.nl/2016/03/07/zipolite/"}, {"titel": "San Jose del Pacifico, Oaxaca, Mexico, San Mateo Río Hondo", "omschrijving": "", "wanneer": "Mar 6, 2016", "icon": "rec_lodging", "kmstand": 194723, "tripkm": 42229, "land": "Mexico", "staat": "Oaxaca", "lat": 16.169989, "lng": -96.503059, "dt": 20160306, "ord": 273, "blogsnip": "Zodra we wakker zijn kijken we meteen naar beneden, naar onze privé pools. Blijken ze niet privé te zijn: 3 mannen zijn al beneden. Dus ontbijten we rustig op de rotsen, genieten van het uitzicht. En wachten tot de wolken een beetje wegtrekken, zodat het opwarmt. Hoewel het frissig blijft …", "bloglink": "https://rondjewereld.nl/2016/03/06/san-jose-del-pacifico/"}, {"titel": "Concepcion Bamba, Cocoleoco Surgcamp", "omschrijving": "", "wanneer": "Mar 9, 2016", "icon": "campground", "kmstand": 195006, "tripkm": 42512, "land": "Mexico", "staat": "Oaxaca", "lat": 16.011862, "lng": -95.412129, "dt": 20160309, "ord": 274, "blogsnip": "Het is drukkend warm vanmorgen. In de verte horen we al de donder. Er valt een tropische bui, maar 10 minuten lang. Er is zo veel water gevallen, dat de camping blank staat. Blijkbaar stond de regen schuin op de achterkant, want achter is 1 gordijn nat. Tja, een oude …", "bloglink": "https://rondjewereld.nl/2016/03/09/concepcion-bamba/"}, {"titel": "Cascadas El Aguacero", "omschrijving": "", "wanneer": "Mar 10, 2016", "icon": "campground", "kmstand": 195316, "tripkm": 42822, "land": "Mexico", "staat": "Chiapas", "lat": 16.75458, "lng": -93.51837, "dt": 20160310, "ord": 275, "blogsnip": "Er is gisteravond al veel regen gevallen, maar vanmorgen blijven de wolken dreigen en het dondert in de verte. Douchen is hier bijzonder: een hokje zonder dak met een grote ton met water en een bakje. Haren wassen maar laten zitten. Voordat we weg gaan komt eigenaar Leo nog kletsen …", "bloglink": "https://rondjewereld.nl/2016/03/10/el-aguacero/"}, {"titel": "Hotel La Hacienda, Tuxtla Gutiérrez", "omschrijving": "", "wanneer": "Mar 11, 2016", "icon": "campground", "kmstand": 195372, "tripkm": 42878, "land": "Mexico", "staat": "Chiapas", "lat": 16.752, "lng": -93.129, "dt": 20160311, "ord": 276, "blogsnip": "We zoeken ‘s morgens nog naar een tweede uitkijkpunt, maar we hebben het niet gevonden. Voordat we wegrijden praten we nog wat met de toezichthouder. Hij vertelt dat het in de week van Pasen hier gekkenhuis is; zowel kampeerders op de parkeerplaats als beneden bij de waterval.", "bloglink": "https://rondjewereld.nl/2016/03/11/tropisch-klussen/"}, {"titel": "Restaurant Familiar La Pasadita Cahuare", "omschrijving": "", "wanneer": "Mar 12, 2016", "icon": "campground", "kmstand": 195390, "tripkm": 42896, "land": "Mexico", "staat": "Chiapas", "lat": 16.739961, "lng": -93.031511, "dt": 20160312, "ord": 277, "blogsnip": "Meteen naar buiten, want het is alweer heet om 8 uur. We ontbijten in het parkje van de binnenplaats van het hotel, onder de palmen en bamboe. Weinig puf om iets te doen. Maar de klussen lonken toch, dus monteren we het lampje onder de kast en hangen we onze …", "bloglink": "https://rondjewereld.nl/2016/03/12/tuxla-guttierez/"}, {"titel": "Rancho San Nicolas", "omschrijving": "", "wanneer": "Mar 13, 2016", "icon": "campground", "kmstand": 195444, "tripkm": 42950, "land": "Mexico", "staat": "Chiapas", "lat": 16.733791, "lng": -92.622305, "dt": 20160313, "ord": 278, "blogsnip": "Rond 8 uur worden we wakker van de bedrijvigheid. De souvenirwinkeltjes worden weer opgezet, nadat de vloer eerst grondig geschrobd wordt. Leuk schouwspel onder het ontbijt. Gisteren zei men al dat de eerste boot tussen 9 en half 10 zou vertrekken. Dus maken we geen haast en zijn we om …", "bloglink": "https://rondjewereld.nl/2016/03/13/canon-del-sumidero/"}, {"titel": "Tonina Kayab", "omschrijving": "", "wanneer": "Mar 15, 2016", "icon": "campground", "kmstand": 195550, "tripkm": 43056, "land": "Mexico", "staat": "Chiapas", "lat": 16.89805, "lng": -92.00263, "dt": 20160315, "ord": 279, "blogsnip": "’s Morgens knippert het controlekastje van de stroomvoorziening; gevaarlijk laag met 29%. Het is voor het eerst in 11 maanden dat dit gebeurt. En dat terwijl het hier doorgaans mooi weer is. Waarschijnlijk een combinatie van kleine stukjes rijden en half in de schaduw parkeren.", "bloglink": "https://rondjewereld.nl/2016/03/15/tonina/"}, {"titel": "Agua Azul", "omschrijving": "", "wanneer": "Mar 16, 2016", "icon": "campground", "kmstand": 195628, "tripkm": 43134, "land": "Mexico", "staat": "Chiapas", "lat": 17.257024, "lng": -92.113538, "dt": 20160316, "ord": 280, "blogsnip": "De mist hangt prachtig in het dal. We starten langzaam op en genieten van het uitzicht. Daarna gaan we rijden. De piramides zijn te zien vanaf de weg terug naar Ocosingo. Was ons op de heenweg niet opgevallen; we zijn dan zo bezig te zoeken naar de camping, dat je …", "bloglink": "https://rondjewereld.nl/2016/03/16/agua-azul/"}, {"titel": "Freedom Shores, Isla Aguada, Campeche, Mexico", "omschrijving": "", "wanneer": "Mar 21, 2016", "icon": "campground", "kmstand": 195993, "tripkm": 43499, "land": "Mexico", "staat": "Campeche", "lat": 18.706, "lng": -91.461, "dt": 20160321, "ord": 281, "blogsnip": "Wat een regen, het komt ’s morgens nog steeds met bakken uit de hemel. De buren met 4 tenten hebben vannacht ergens anders geslapen. Nu komen ze de tenten afbreken. Doorweekt zijn ze. Wij gaan douchen en pakken de bus in. Daarna droge kleren aan. We hebben 2 lekkages ontdekt …", "bloglink": "https://rondjewereld.nl/2016/03/21/golfo-de-mexico/"}, {"titel": "Palenque", "omschrijving": "", "wanneer": "Mar 17, 2016", "icon": "campground", "kmstand": 195699, "tripkm": 43205, "land": "Mexico", "staat": "Chiapas", "lat": 17.512, "lng": -91.989, "dt": 20160317, "ord": 282, "blogsnip": "Ondanks de warme nacht hebben we prima geslapen, dankzij de zelfgemaakte airco en de nieuwe ventilator. Na het ontbijt lopen we naar de watervallen. Nu hiken we ook een stuk naar boven, daarvoor was het gisteren veel te warm. De restaurantjes en winkeltjes worden al opgezet. We zien maar een …", "bloglink": "https://rondjewereld.nl/2016/03/17/ue/"}, {"titel": "Campeche, Campeche, Mexico", "omschrijving": "", "wanneer": "Mar 23, 2016", "icon": "campground", "kmstand": 196182, "tripkm": 43688, "land": "Mexico", "staat": "Campeche", "lat": 19.845, "lng": -90.54, "dt": 20160323, "ord": 283, "blogsnip": "Het is ‘s morgens nog lekker koel. Eigenlijk wilden we vroeg weg, maar we zijn een beetje lui. Nog wat administratie en dan pakken we in. In 2,5 uur rijden we naar Campeche. Het eerste stuk langs de turquoise zee rond Laguna de Terminos. Even later is ze zee blauw …", "bloglink": "https://rondjewereld.nl/2016/03/23/campeche/"}, {"titel": "Izamal, Yucatan, Mexico", "omschrijving": "", "wanneer": "Mar 29, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Yucatán", "lat": 20.931, "lng": -89.021, "dt": 20160329, "ord": 284, "blogsnip": "Druk aan de ontbijttafel in ons hostel. Veel verschillende talen worden er gesproken, in het voorbij gaan horen we zelfs Nederlands. Er wordt een hoekje aan een kast voor ons vrijgemaakt, met 2 barkrukken. Ei wordt voor je gebakken, met bonenprutje, maar je moet wel zelf afwassen.", "bloglink": "https://rondjewereld.nl/2016/03/29/izamal/"}, {"titel": "Uxmal, Yucatan, Mexico", "omschrijving": "", "wanneer": "Mar 24, 2016", "icon": "campground", "kmstand": 196346, "tripkm": 43852, "land": "Mexico", "staat": "Campeche", "lat": 20.361, "lng": -89.77, "dt": 20160324, "ord": 285, "blogsnip": "We rijden al vroeg naar het centrum. Bij het visitor center halen we een kaartje op. De jongen die er werkt zegt dat ie de enige is die is komen opdagen. Collega’s hebben vrij genomen voor Semana Santa en dan blijf je gewoon thuis. Deze stad heeft een stadsmuur, gebouwd …", "bloglink": "https://rondjewereld.nl/2016/03/24/uxmal/"}, {"titel": "Chelem, Yucatan, Mexico", "omschrijving": "", "wanneer": "Mar 25, 2016", "icon": "campground", "kmstand": 196464, "tripkm": 43970, "land": "Mexico", "staat": "Yucatán", "lat": 21.018, "lng": -89.718, "dt": 20160325, "ord": 286, "blogsnip": "Al vroeg staan mensen in de rij om Uxmal te bekijken. Wij pakken in en rijden richting Merida. Hier zou een campingwinkel zitten. De navigatie stuurt ons naar de rand van de stad, waar een groot overdekt luxe winkelcentrum zit. De airco draait hier op volle toeren, waardoor het verschil …", "bloglink": "https://rondjewereld.nl/2016/03/25/to-chelem/"}, {"titel": "Hostel Zocalo, Merida", "omschrijving": "", "wanneer": "Mar 28, 2016", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Yucatán", "lat": 20.967, "lng": -89.623, "dt": 20160328, "ord": 287, "blogsnip": "We pakken in en nemen afscheid van Claudia. Zij gaat de komende maanden hiken in de USA, tentje mee, rugzak op. Stoer. Wij rijden naar Merida, eerst maar even Starbucks. Het is hier behoorlijk druk, dus internet is helaas traag, skypen lukt nauwelijks. In het centrum parkeren we de bus.", "bloglink": "https://rondjewereld.nl/2016/03/28/merida/"}, {"titel": "Hotel Dolores Alba", "omschrijving": "", "wanneer": "Mar 30, 2016", "icon": "campground", "kmstand": 196700, "tripkm": 44206, "land": "Mexico", "staat": "Yucatán", "lat": 20.664962, "lng": -88.549749, "dt": 20160330, "ord": 288, "blogsnip": "Heerlijk geslapen met de achterdeuren open. Na het ontbijt gaan we internetten bij het zwembad. Net als we zitten te skypen komt de Oostenrijkse eigenaar Harald even praten. Ooit was hij zelf overlander, nu woont hij hier. In een boom verderop zitten twee prachtig gekleurde tropische vogels.", "bloglink": "https://rondjewereld.nl/2016/03/30/ik-kil-cenote/"}, {"titel": "Suytun Cenotes Cabanas", "omschrijving": "", "wanneer": "Mar 31, 2016", "icon": "campground", "kmstand": 196803, "tripkm": 44309, "land": "Mexico", "staat": "Yucatán", "lat": 20.69875, "lng": -88.126182, "dt": 20160331, "ord": 289, "blogsnip": "De wekker gaat om half 7. Ontbijten en inpakken en dan rijden we naar Chichen Itza. Voor de poort staan al wat auto’s te wachten. Ze gaan om 8 uur open, dus we zetten een bakkie koffie. Een Pool komt informeren hoe je een Europese auto hier krijgt. Zodra de …", "bloglink": "https://rondjewereld.nl/2016/03/31/chichen-itza/"}, {"titel": "Quintana Roo National Park Campground & Hiking", "omschrijving": "", "wanneer": "apr 1, 2016", "icon": "campground", "kmstand": 196886, "tripkm": 44392, "land": "Mexico", "staat": "Yucatán", "lat": 20.350267, "lng": -87.6762, "dt": 20160401, "ord": 290, "blogsnip": "We pakken in rijden weg. Bij het parkeerterrein van de cenote is het al behoorlijk druk. Een Nederlander in en huurauto spreekt ons aan. Je verwacht het niet. Maar het is wel logisch, vanaf nu komen we in een gebied waar veel Europese toeristen zijn. We rijden richting Tulum. Gisteren …", "bloglink": "https://rondjewereld.nl/2016/04/01/jungle-camping/"}, {"titel": "Xpu Ha", "omschrijving": "", "wanneer": "apr 2, 2016", "icon": "campground", "kmstand": 196957, "tripkm": 44463, "land": "Mexico", "staat": "Quintana Roo", "lat": 20.472565, "lng": -87.258019, "dt": 20160402, "ord": 291, "blogsnip": "Het is een beetje bewolkt ’s morgens en meteen al heet. Na het ontbijt gaan we een stukje hiken, via een smal pad door de jungle. Ongelijke grond, met rotsen en gaten, dus je moet steeds naar beneden kijken. We zien een kleine rode slang. Al snel houden we het …", "bloglink": "https://rondjewereld.nl/2016/04/02/mexico-caribe/"}, {"titel": "Grand Hostal Playa", "omschrijving": "", "wanneer": "apr 4, 2016", "icon": "rec_lodging", "kmstand": 196995, "tripkm": 44501, "land": "Mexico", "staat": "Quintana Roo", "lat": 20.626405, "lng": -87.076638, "dt": 20160404, "ord": 292, "blogsnip": "Nog steeds is het super-klam weer. In bed liggen is niet echt lekker. We ontbijten en pakken in. Dan nemen we afscheid van Vera en Dierk van de camping, Jerry en Ansje uit Canada en Katrin en Rudi uit Duitsland. Het Duitse stel komen we vast nog tegen. Eerst moet …", "bloglink": "https://rondjewereld.nl/2016/04/04/werkdag-in-playa-del-carmen/"}, {"titel": "Acamaya Reef Cabanas & Beach Bar, Puerto Morelos", "omschrijving": "", "wanneer": "apr 6, 2016", "icon": "campground", "kmstand": 197037, "tripkm": 44543, "land": "Mexico", "staat": "Quintana Roo", "lat": 20.872585, "lng": -86.865828, "dt": 20160406, "ord": 293, "blogsnip": "Voor 9 uur zijn we bij garage Race Car. Eerst laden we de fietsen uit. Asael heeft een offerte voor banden. Niet exact dezelfde maat, want die is hier niet te krijgen. Maar wel een maatje groter; Pirelli’s met offroad-profiel. Kunnen we door de blubber racen. Wel moet nog even …", "bloglink": "https://rondjewereld.nl/2016/04/06/servicebeurt-in-playa/"}, {"titel": "Cabanas El Mercolo", "omschrijving": "", "wanneer": "apr 8, 2016", "icon": "campground", "kmstand": 197143, "tripkm": 44649, "land": "Mexico", "staat": "Quintana Roo", "lat": 21.212227, "lng": -86.804168, "dt": 20160408, "ord": 294, "blogsnip": "‘s Morgens doen we rustig aan. Nog even maximaal profiteren van top internet, dus skypen we flink. Lesley maakt nog een praatje met de Amerikaanse lerares van de Mexicaanse schoolklas die hier nu is. En we maken een filmpje om het vreemde geluid op te nemen bij stationair draaien. Wij …", "bloglink": "https://rondjewereld.nl/2016/04/09/shopping-in-cancun/"}, {"titel": "Uh Najil turismo rural y ecoturismo", "omschrijving": "", "wanneer": "apr 16, 2016", "icon": "campground", "kmstand": 197552, "tripkm": 45058, "land": "Mexico", "staat": "Yucatán", "lat": 20.892389, "lng": -88.143064, "dt": 20160416, "ord": 295, "blogsnip": "Uurtje later op dan gebruikelijk staan we op. Waarschijnlijk omdat de nacht iets koeler was, dan slapen we beter. We doen rustig aan, internetten nog wat en pakken in. En we wensen de Duitse buren een goede reis terug naar huis. Bij het tankstation verderop laten we de bandenspanning meten.", "bloglink": "https://rondjewereld.nl/2016/04/16/to-ek-balam/"}, {"titel": "Cancun Camping & RV Park", "omschrijving": "", "wanneer": "apr 15, 2016", "icon": "campground", "kmstand": 197379, "tripkm": 44885, "land": "Mexico", "staat": "Quintana Roo", "lat": 21.081603, "lng": -87.017, "dt": 20160415, "ord": 296, "blogsnip": "Spannend, vandaag zouden de remschijven bij de dealer in Nederland moeten zijn. Na het ontbijt skypen we met de hulptroepen en ja, ze zijn er. Nog even overleggen over de verpakking; het wordt een verhuisdoos. Het pakket weegt maar liefst 24 kg en dat betekent dat verzending per koerier een …", "bloglink": "https://rondjewereld.nl/2016/04/15/cancun-buiten/"}, {"titel": "Rio Lagartos", "omschrijving": "", "wanneer": "apr 17, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Yucatán", "lat": 21.596229, "lng": -88.146092, "dt": 20160417, "ord": 297, "blogsnip": "Als we wakker worden zien we een groepje Westerse toeristen bij de receptie. Waarschijnlijk sliepen ze in cabañas, dus we waren toch niet de enige gasten. Zij gaan ontbijten in het restaurant. Wij gaan naar de ruïnes en we zijn de eerste. Ek’ Balam is een kleine Maya site, die …", "bloglink": "https://rondjewereld.nl/2016/04/17/rio-lagartos/"}, {"titel": "Cobá, Tulum", "omschrijving": "", "wanneer": "apr 18, 2016", "icon": "campground", "kmstand": 197826, "tripkm": 45332, "land": "Mexico", "staat": "Yucatán", "lat": 20.492, "lng": -87.437, "dt": 20160418, "ord": 298, "blogsnip": "We hadden de wekker staan voor 6 uur, om te kijken of we om 7 uur de boottocht konden doen, maar we zien er van af. Er was niks afgesproken, dus kunnen we ons nog even omdraaien. ’s Morgens is het best druk met verkeer bij de balneario; de vuilniswagen …", "bloglink": "https://rondjewereld.nl/2016/04/18/via-valladolid/"}, {"titel": "Camping Chaves, Tulum", "omschrijving": "", "wanneer": "apr 19, 2016", "icon": "campground", "kmstand": 197935, "tripkm": 45441, "land": "Mexico", "staat": "Yucatán", "lat": 20.149934, "lng": -87.458805, "dt": 20160419, "ord": 299, "blogsnip": "Prima geslapen op de parkeerplaats. We verzetten de bus en staan om 8 uur bij de kassa. Iedereen is klaar voor het ontvangen van toeristen, behalve de kassa. Un momentito! Kwart over 8 gaan we als eerste door de poort. We huren meteen een fiets, want we weten dat het …", "bloglink": "https://rondjewereld.nl/2016/04/19/coba/"}, {"titel": "Cabanas El Mercolo", "omschrijving": "", "wanneer": "apr 20, 2016", "icon": "campground", "kmstand": 198055, "tripkm": 45561, "land": "Mexico", "staat": "Quintana Roo", "lat": 21.212227, "lng": -86.804168, "dt": 20160420, "ord": 300, "blogsnip": "‘s Morgens kijken we meteen naar de Fedex-status van ons pakket; nog niet gewijzigd. Dus maken we een strandwandeling over het prachtig witte zand. Gerhard heeft nog steeds een dikke hand van de steek van de gele vlieg. Allergische reactie, maar het wordt niet erger. Net als we inpakken valt …", "bloglink": "https://rondjewereld.nl/2016/04/20/back-to-cancun/"}, {"titel": "Race Car Mechanics", "omschrijving": "", "wanneer": "apr 21, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Quintana Roo", "lat": 20.640663, "lng": -87.078687, "dt": 20160421, "ord": 301, "blogsnip": "De wekker gaat om 7 uur, want we willen op tijd bij Fedex zijn. Als we buiten ontbijten komen Manfred en Karin uit Duitsland kletsen. Gisteravond kwamen ze met hun grote truck aan. Ze komen net terug van 14 dagen Cuba en rijden van Zuid naar Noord. Leuk, we wisselen …", "bloglink": "https://rondjewereld.nl/2016/04/21/remschijven/"}, {"titel": "Walmart, Playa del Carmen", "omschrijving": "", "wanneer": "apr 22, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Quintana Roo", "lat": 20.653945, "lng": -87.081616, "dt": 20160422, "ord": 302, "blogsnip": "Prima geslapen naast de garage. We staan om 8 uur klaar. Nu snappen we waarom we eerder om 9 uur moesten komen; eerst moeten alle auto’s en motoren die ‘s nachts in de garage staan buiten gezet worden. Wat een gedoe, 2x per dag rangeren. Wij geven de sleutel af …", "bloglink": "https://rondjewereld.nl/2016/04/22/mexicaans-lesje-geduld/"}, {"titel": "Tulum Ruines, Tulum", "omschrijving": "", "wanneer": "apr 23, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Yucatán", "lat": 20.217377, "lng": -87.438453, "dt": 20160423, "ord": 303, "blogsnip": "Opstaan, inpakken en rijden naar de garage. Om 8 uur zitten we weer op de fiets. Dag 3 wachten en hangen. Gelukkig een kortere dag, want de garage gaat op zaterdag om 2 uur dicht. Hetzelfde recept; ontbijt op een terras, urenlang koffie en internet bij Starbucks, nog even wat …", "bloglink": "https://rondjewereld.nl/2016/04/23/on-the-road-again-2/"}, {"titel": "Laguna Azul, Bacalar", "omschrijving": "", "wanneer": "apr 24, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Quintana Roo", "lat": 18.927702, "lng": -88.165691, "dt": 20160424, "ord": 304, "blogsnip": "Als we ontbijten komen al de eerste toeristen aan, want dit is een bekende attractie. Er wordt zelfs al een bus uitgeladen. Om half 9 zijn we bij de ingang, 500 meter lopen. Je kunt ook een treintje nemen, een kar achter een tractor, maar dat vinden we niet nodig …", "bloglink": "https://rondjewereld.nl/2016/04/24/laguna-azul/"}, {"titel": "Blue Kay Resort, Mahahual", "omschrijving": "", "wanneer": "apr 25, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Quintana Roo", "lat": 18.72283, "lng": -87.703007, "dt": 20160425, "ord": 305, "blogsnip": "We ontbijten buiten, in de antimuggen-box. Want het is ‘s morgens meteen raak; muggen en gele vliegen. Er komt een auto het terrein op rijden. Een Duits echtpaar komt hier ontbijten en ze maken een praatje. We pakken in, snel weg bij de insekten. Terug bij de snelweg staan de …", "bloglink": "https://rondjewereld.nl/2016/04/25/mahahual/"}, {"titel": "Cocalitos \"El santuario de los estromatolitos\"", "omschrijving": "", "wanneer": "apr 27, 2016", "icon": "campground", "kmstand": 198536, "tripkm": 46042, "land": "Mexico", "staat": "Quintana Roo", "lat": 18.651692, "lng": -88.409643, "dt": 20160427, "ord": 306, "blogsnip": "Vandaag gaan we weer op pad. Na het ontbijt eerst een koude douche. Nou ja, koud. Het water is toch nog lauw. Fris uit de douche sta je 2 tellen in de bus en het zweet staat alweer op je gezicht. We rijden weer terug naar de hoofdweg en pikken …", "bloglink": "https://rondjewereld.nl/2016/04/27/koningsblauw/"}, {"titel": "Yax-Ha Cabañas & Trailer Park", "omschrijving": "", "wanneer": "apr 29, 2016", "icon": "campground", "kmstand": 198583, "tripkm": 46089, "land": "Mexico", "staat": "Quintana Roo", "lat": 18.560748, "lng": -88.248583, "dt": 20160429, "ord": 307, "blogsnip": "Vanmorgen is het bewolkt, maar het meer is ook dan prachtig. We relaxen nog een beetje en pakken laat in de ochtend in. Het is nog geen 800 meter rijden naar Cenote Azul. Dit is een cenote omringd door bomen. Veel groter dan andere cenotes, het lijkt wel een meer …", "bloglink": "https://rondjewereld.nl/2016/04/29/to-chetumal/"}, {"titel": "Almond Tree Hotel, Corozal, Belize", "omschrijving": "", "wanneer": "May 2, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Quintana Roo", "lat": 18.375476, "lng": -88.398913, "dt": 20160502, "ord": 308, "blogsnip": "Vandaag koken we theewater buiten, op het primus gasje. De grote gasfles is al ontkoppeld om straks te vullen. Ook meteen eieren bakken, want zo veel mogelijk verswaren moeten op. We rijden Chetumal uit en laten de gasfles vullen. Daarna nemen we de afslag naar de grens.", "bloglink": "https://rondjewereld.nl/2016/05/02/belize/"}, {"titel": "Lamanai River Resort, Orange Walk", "omschrijving": "", "wanneer": "May 4, 2016", "icon": "campground", "kmstand": 198790, "tripkm": 46296, "land": "Mexico", "staat": "Quintana Roo", "lat": 18.077579, "lng": -88.557525, "dt": 20160504, "ord": 309, "blogsnip": "Voor 6 uur wakker van het licht, we moeten echt de dag gaan verleggen en eerder naar bed. Na het ontbijt internetten we nog wat achter de hor op een veranda. Voordat we wegrijden eerst nog op jacht naar gele vliegen, 8 stuks in de bus. We rijden een klein …", "bloglink": "https://rondjewereld.nl/2016/05/04/muggen-en-mennonites/"}, {"titel": "Backpackers Paradise, Sarteneja", "omschrijving": "", "wanneer": "May 3, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Quintana Roo", "lat": 18.35042, "lng": -88.148532, "dt": 20160503, "ord": 310, "blogsnip": "Al om 6 uur zijn we wakker, want dan is het al licht. Vannacht ging het even regenen, dus Gerhard snel naar buiten om de stoelen op te bergen en de deuren dicht te doen. Maar het was met een minuut over. Na het ontbijt gaan we nog even zwemmen …", "bloglink": "https://rondjewereld.nl/2016/05/03/sarteneja/"}, {"titel": "Barefoot Beach, Caya Caulker", "omschrijving": "", "wanneer": "May 8, 2016", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "Belize", "staat": "", "lat": 17.739141, "lng": -88.025707, "dt": 20160508, "ord": 311, "blogsnip": "Het is moederdag, dus skypen we met de moeders (en de vaders). Net als we de watertank vullen valt er een flinke bui, kort maar krachtig. Al met al zijn we rond elf uur weg. Het is maar een een paar kilometer rijden naar Belize City, de grootste stad van …", "bloglink": "https://rondjewereld.nl/2016/05/08/caye-caulker/"}, {"titel": "Jacana Inn, Crooked Tree", "omschrijving": "", "wanneer": "May 6, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Belize", "staat": "", "lat": 17.785121, "lng": -88.533046, "dt": 20160506, "ord": 312, "blogsnip": "We hebben besloten vanmorgen niet veel te doen. Om 7 uur zitten we onder de palapa aan de koffie, te kijken naar een grote groep met twee 2 soorten witte reigers, die net voor ons de rivier als buffet gebruikt. De kleine reigers vliegen laag over het water, teentjes slepend …", "bloglink": "https://rondjewereld.nl/2016/05/06/crooked-tree/"}, {"titel": "Old Belize Marina", "omschrijving": "", "wanneer": "May 7, 2016", "icon": "campground", "kmstand": 198936, "tripkm": 46442, "land": "Belize", "staat": "", "lat": 17.472669, "lng": -88.248191, "dt": 20160507, "ord": 313, "blogsnip": "Gisteravond hadden we onder de fluitketel een grote kakkerlak gezien, die weg rende. Hopelijk is ie naar buiten, zeggen we tegen elkaar. Voordat we gingen slapen, klopte Lesley nog even een dekentje uit. En daar zat ie. Weer rennen, maar nu hebben we ‘m te pakken onder een glas.", "bloglink": "https://rondjewereld.nl/2016/05/07/baboons/"}, {"titel": "Old Belize Marina", "omschrijving": "", "wanneer": "May 11, 2016", "icon": "campground", "kmstand": 198936, "tripkm": 46442, "land": "Belize", "staat": "", "lat": 17.472669, "lng": -88.248191, "dt": 20160511, "ord": 314, "blogsnip": "Nadat we zijn ingepakt, checken we uit. We halen Emy en Sandra op voor een laatste ontbijt samen op Caye Caulker. Weer bij het tentje van de Nederlandse eigenaresse. En wij nemen weer echte yoghurt, want dat kunnen we nergens krijgen. Nog even een ijskoffie en dan nemen we afscheid …", "bloglink": "https://rondjewereld.nl/2016/05/11/bye-caye/"}, {"titel": "Belize Zoo", "omschrijving": "", "wanneer": "May 12, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Belize", "staat": "", "lat": 17.353294, "lng": -88.550547, "dt": 20160512, "ord": 315, "blogsnip": "Langzaamaan wordt het steeds warmer. Nu is het ‘s nachts zelfs 30 graden in de bus. Maar we lijken er aan te wennen en kunnen gewoon slapen. Al worden we wel een paar keer per nacht wakker. De bus staat al goed in de zon, we ontbijten in een klein …", "bloglink": "https://rondjewereld.nl/2016/05/12/belize-zoo/"}, {"titel": "The Farm Inn, San Felipe", "omschrijving": "", "wanneer": "May 14, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Belize", "staat": "", "lat": 16.236645, "lng": -89.042062, "dt": 20160514, "ord": 316, "blogsnip": "‘s Morgens is het behoorlijk bewolkt. We nemen een snelle duik in zee, want er is hier geen douche. Daarna valt er een tropische bui. We proberen in Hopkins nog te pinnen, maar de lokale banken geven ons geen geld. Vandaag rijden we richting het zuiden. Zo’n 2 uur naar …", "bloglink": "https://rondjewereld.nl/2016/05/14/the-deep-south/"}, {"titel": "Driftwood Beach Bar, Hopkins, Belize", "omschrijving": "", "wanneer": "May 13, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Belize", "staat": "", "lat": 16.872834, "lng": -88.286852, "dt": 20160513, "ord": 317, "blogsnip": "Na het ontbijt drinken we koffie in het eetlokaal om nog even te internetten. Er is geen internet, dus pakken we in. De truc is zo laat mogelijk douchen (uiteraard koud), dan heb je er het meest aan en zweet je het minst. Vandaag gaan we een aardig stuk rijden …", "bloglink": "https://rondjewereld.nl/2016/05/13/hopkina/"}, {"titel": "Mariposa, Placencia, Belize", "omschrijving": "", "wanneer": "May 15, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Belize", "staat": "", "lat": 16.535398, "lng": -88.359868, "dt": 20160515, "ord": 318, "blogsnip": "Heerlijk geslapen bij een een iets lagere temperatuur. Zelfs een dekentje opgezocht, want 24 graden vinden we tegenwoordig fris. We ontbijten buiten, terwijl de herdershonden om ons heen lopen. Kevin heeft bij zijn hotel een behoorlijk stuk grond, met paden door de jungle. Dus gaan we hiken, de honden en …", "bloglink": "https://rondjewereld.nl/2016/05/15/to-placencia/"}, {"titel": "Bocawina National Park", "omschrijving": "", "wanneer": "May 17, 2016", "icon": "campground", "kmstand": 199552, "tripkm": 47058, "land": "Belize", "staat": "", "lat": 16.93165, "lng": -88.385395, "dt": 20160517, "ord": 319, "blogsnip": "De zon staat al vroeg op de bus. Gerhard neemt meteen een duik in het zwembad om af te koelen. Na het ontbijt internetten we wat en nemen we nog maar een frisse duik. Connie en Shaeman nemen afscheid. Wij kletsen nog met Josh en Jenna in het koele water …", "bloglink": "https://rondjewereld.nl/2016/05/17/bocawina-np/"}, {"titel": "Hummingbird Haven", "omschrijving": "", "wanneer": "May 18, 2016", "icon": "campground", "kmstand": 199608, "tripkm": 47114, "land": "Belize", "staat": "", "lat": 17.07124, "lng": -88.59043, "dt": 20160518, "ord": 320, "blogsnip": "Half 6 gaat de wekker. We schrikken er niet echt van, want met die hitte slapen we licht en zijn we vaak wakker. Vanwege de warmte hebben we dorst en drinken we veel ’s nachts, waardoor je weer vaak moet plassen. Snel ontbijten en dan gaan we op pad. De …", "bloglink": "https://rondjewereld.nl/2016/05/18/hot-hiking/"}, {"titel": "Clarissa Falls", "omschrijving": "", "wanneer": "May 23, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Belize", "staat": "", "lat": 17.112167, "lng": -89.127204, "dt": 20160523, "ord": 321, "blogsnip": "Het verschil in temperatuur tussen nacht en dag wordt groter. Voor ons gevoel is het nu best koel om te slapen, niet eens een ventilator aan. Lesley slaapt zelfs uit tot 8 uur. ‘s Morgens is het tijd voor de administratie. We zetten de printer op en bereiden de grensovergang …", "bloglink": "https://rondjewereld.nl/2016/05/23/xunantunich/"}, {"titel": "Belize Zoo", "omschrijving": "", "wanneer": "May 19, 2016", "icon": "campground", "kmstand": 199702, "tripkm": 47208, "land": "Belize", "staat": "", "lat": 17.353294, "lng": -88.550547, "dt": 20160519, "ord": 322, "blogsnip": "Vanaf de camping volgen we de Hummingbird highway weer naar het noorden. Bij Kropf Bakery stoppen we. Dit is een Mennonite bakker. Het meisje dat brood verkoopt is Maya, geen Mennonite. We kopen een warm ongesneden bruin brood. Mmm. Het komt het dichts bij Nederlands brood, na ruim een jaar …", "bloglink": "https://rondjewereld.nl/2016/05/19/cave-tubing-nohoch-che-en/"}, {"titel": "Manakai Campground, San Ignacio", "omschrijving": "", "wanneer": "May 20, 2016", "icon": "campground", "kmstand": 199791, "tripkm": 47297, "land": "Belize", "staat": "", "lat": 17.161357, "lng": -89.069199, "dt": 20160520, "ord": 323, "blogsnip": "Vanmorgen doen we rustig aan. Een schoolklas tieners komt met de bus aan en krijgt opdrachten. Wij gaan nog even internetten in de eetzaal. Super traag, maar het gaat. Rond 11 uur vertrekken we naar het westen. We pakken verderop een dirtroad, waar we slechts 20 km per uur rijden …", "bloglink": "https://rondjewereld.nl/2016/05/20/green-hills-butterfly-ranch/"}, {"titel": "Jaguar Inn, Tikal", "omschrijving": "", "wanneer": "May 24, 2016", "icon": "campground", "kmstand": 199915, "tripkm": 47421, "land": "Guatemala", "staat": "", "lat": 17.225122, "lng": -89.611747, "dt": 20160524, "ord": 324, "blogsnip": "Na ontbijt bij de bus drinken we nog een sapje bij het restaurant. Even de laatste zaken voor de grensovergang opzoeken op internet. Het is maar een klein stukje rijden naar de grens. Er wordt ons een vreemde parkeerplek aangewezen, half op de weg. In het gebouw gaat het allemaal …", "bloglink": "https://rondjewereld.nl/2016/05/24/bienvenidos-a-guatemala/"}, {"titel": "Chaltuna, San Miguel", "omschrijving": "", "wanneer": "May 25, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Guatemala", "staat": "", "lat": 16.935652, "lng": -89.88768, "dt": 20160525, "ord": 325, "blogsnip": "Om 4 uur vannacht hoorden we al wat mensen verzamelen die de sunrise toer in Tikal gaan doen. Onze wekker gaat om half 6, zodat we een half uur later al het park in gaan. De temperatuur is nog goed te doen en het is nog niet druk. Weer zien …", "bloglink": "https://rondjewereld.nl/2016/05/25/tikal/"}, {"titel": "Finca Ixobel", "omschrijving": "", "wanneer": "May 27, 2016", "icon": "campground", "kmstand": 200102, "tripkm": 47608, "land": "Guatemala", "staat": "", "lat": 16.30542, "lng": -89.413003, "dt": 20160527, "ord": 326, "blogsnip": "Om 8 uur gaan we hiken naar El Mirador. Dit is een uitzichtpunt op een Maya site. Van de Maya site is niet veel te zien, want de ruines zijn niet bloot gelegd. Het lijken gewoon heuvels. Vanaf de gammele houten uitkijktoren kijken we over Lago Petén Itza en Flores …", "bloglink": "https://rondjewereld.nl/2016/05/27/finca-ixobel/"}, {"titel": "Rio Dulce", "omschrijving": "", "wanneer": "May 28, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Guatemala", "staat": "", "lat": 15.658485, "lng": -89.000269, "dt": 20160528, "ord": 327, "blogsnip": "Prima temperatuur hier. ’s Morgens zitten we lekker buiten, voetjes in het gras. Voordat we wegrijden nemen we afscheid van Chris, Steffi en hun kinderen. Voor de vierde verjaardag van Ella heeft Lesley een Nederlands tasje en een klompje ingepakt, met zelfgemaakt pakpapier. En grote broer Tom krijgt natuurlijk ook …", "bloglink": "https://rondjewereld.nl/2016/05/28/rio-dulce/"}, {"titel": "Hotel Posada El Delfin, Livingston, Guatemala", "omschrijving": "", "wanneer": "May 29, 2016", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "Guatemala", "staat": "", "lat": 15.829, "lng": -88.747, "dt": 20160529, "ord": 328, "blogsnip": "We bestellen wat fruit en koffie op het terras en skypen. Daarna pakken we onze tassen om te wachten bij de steiger. Vandaag gaan we met de lancha collectivo naar Livingston. Het is een bootje dat je met andere deelt, een soort kleine ferry. Livingston is alleen per boot bereikbaar …", "bloglink": "https://rondjewereld.nl/2016/05/29/livington/"}, {"titel": "Mariscos", "omschrijving": "", "wanneer": "May 30, 2016", "icon": "campground", "kmstand": 200315, "tripkm": 47821, "land": "Guatemala", "staat": "", "lat": 15.424827, "lng": -89.085544, "dt": 20160530, "ord": 329, "blogsnip": "Ondanks de airco (veel lawaai) toch niet heel vast geslapen. Misschien vanwege de gisteravond gespotte kakkerlak. Tijdens het ontbijt komt de eigenaresse voor ons allebei een handgeknoopt armbandje brengen, gemaakt door de inheemse bevolking. Wat leuk, natuurlijk doen we die meteen om.", "bloglink": "https://rondjewereld.nl/2016/05/30/mariscos-aan-lago-de-izabal/"}, {"titel": "Hacienda Rio Escondido", "omschrijving": "", "wanneer": "May 31, 2016", "icon": "campground", "kmstand": 200520, "tripkm": 48026, "land": "Guatemala", "staat": "", "lat": 15.110979, "lng": -90.188539, "dt": 20160531, "ord": 330, "blogsnip": "Als we opstaan is het oppervlak van het meer helemaal glad. Gisteren was er nog wilde golfslag. Er zijn al vroeg mannen aan het vissen. Al lopend trekken ze netten over de bodem. We zitten het tijdens het ontbijt allemaal te bekijken. En we lezen lekker. Na meerdere keren checken …", "bloglink": "https://rondjewereld.nl/2016/05/31/stelae/"}, {"titel": "Parque Nacional Las Victorias", "omschrijving": "", "wanneer": "jun 1, 2016", "icon": "campground", "kmstand": 200588, "tripkm": 48094, "land": "Guatemala", "staat": "", "lat": 15.475024, "lng": -90.381655, "dt": 20160601, "ord": 331, "blogsnip": "Heerlijk fris weer om te slapen. Zelfs tweede fleece dekentje gepakt. En ’s morgens is het meteen weer aangenaam buiten, zodra de zon schijnt. Na het ontbijt doen we een kleine hike op het terrein van het hotel. Door de bomen, heuvel op. Tot onze verbazing komen we opeens bij …", "bloglink": "https://rondjewereld.nl/2016/06/01/coban/"}, {"titel": "Grutas de Lanquin", "omschrijving": "", "wanneer": "jun 2, 2016", "icon": "campground", "kmstand": 200652, "tripkm": 48158, "land": "Guatemala", "staat": "", "lat": 15.579772, "lng": -89.989611, "dt": 20160602, "ord": 332, "blogsnip": "Vannacht regent het af en toe, maar ’s morgens is het weer helder. We pakken in en nemen afscheid van de buren van de VW Kombi. In het centrum halen we de was op. Weer moet eerst de deur van slot. We zijn van plan een rondleiding bij een koffie …", "bloglink": "https://rondjewereld.nl/2016/06/02/grutas-de-lanquin/"}, {"titel": "Hotel El Recreo, Lanquin", "omschrijving": "", "wanneer": "jun 3, 2016", "icon": "campground", "kmstand": 200654, "tripkm": 48160, "land": "Guatemala", "staat": "", "lat": 15.576878, "lng": -89.981704, "dt": 20160603, "ord": 333, "blogsnip": "De gids van gisteren heeft blijkbaar in het dorp vertelt dat wij hier zijn, want allemaal mensen verschijnen met een aanbod voor een toertje of vervoer naar Semuc Champey. We bedanken vriendelijk en rijden al vroeg weg. Slechts 2 km verderop checken we in bij een camping naast een hotel.", "bloglink": "https://rondjewereld.nl/2016/06/03/semuc-champey/"}, {"titel": "Hacienda Pueblo Real, Tecpán, Guatemala", "omschrijving": "", "wanneer": "jun 5, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Chiapas", "lat": 14.737954, "lng": -90.965867, "dt": 20160605, "ord": 334, "blogsnip": "’s Morgens is het bewolkt maar droog. De douche is koud, normaal met dat hete weer geen probleem (zelfs lekker), maar met krap 20 graden buiten is het even doorzetten. Dan weer de weg op richting Guatemala City. Af en aan een buitje, Hollands weer. We komen steeds meer Chicken …", "bloglink": "https://rondjewereld.nl/2016/06/05/mapa-en-relieve/"}, {"titel": "Hotel Tzanjuyu", "omschrijving": "", "wanneer": "jun 6, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Chiapas", "lat": 14.742926, "lng": -91.163651, "dt": 20160606, "ord": 335, "blogsnip": "Prima overnachtingsplek, zo’n parkeerplaats bij de snelweg. Lekker veilig gevoel, dat er ’s nachts iemand in een wachttoren met een geweer zit te waken. We rijden vandaag naar Panajachel. De bedoelde bestemming van gisteren, maar het is nog zeker 1,5 uur rijden. Maar goed dat we gestopt zijn.", "bloglink": "https://rondjewereld.nl/2016/06/06/lago-de-atitlan/"}, {"titel": "Maya Inn, Chichicastenango", "omschrijving": "", "wanneer": "jun 8, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Chiapas", "lat": 14.942962, "lng": -91.112995, "dt": 20160608, "ord": 336, "blogsnip": "Heerlijk, het is droog weer als we opstaan, zelfs met een zonnetje. We zetten de stoeltjes buiten om van het top uitzicht op de vulkanen te genieten. De hele ochtend rommelen we wat bij de bus. De jerrycan met diesel op het dak halen we er af en gooien we …", "bloglink": "https://rondjewereld.nl/2016/06/08/chichicastenango/"}, {"titel": "Tourist Police, Antigua", "omschrijving": "", "wanneer": "jun 10, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Chiapas", "lat": 14.555421, "lng": -90.739501, "dt": 20160610, "ord": 337, "blogsnip": "Het is ‘s morgens weer droog in Chichi. Lesley gaat bij de receptie van het hotel vragen of we mogen douchen in een hotelkamer. Er zijn verder geen gasten, dus het mag. Daarna pakken we in en gaan we rijden naar het zuiden. We moeten eerst de kronkelende bergweg terug …", "bloglink": "https://rondjewereld.nl/2016/06/10/to-antigua/"}, {"titel": "La Cabellariza, Chiquimula", "omschrijving": "", "wanneer": "jun 13, 2016", "icon": "campground", "kmstand": 201442, "tripkm": 48948, "land": "Guatemala", "staat": "", "lat": 14.752642, "lng": -89.53846, "dt": 20160613, "ord": 338, "blogsnip": "Voor vandaag is mooi weer voorspeld. Bij het ontbijt is het nog wat bewolkt, maar we kunnen wel buiten zitten. Op onze camping bij de toeristenpolitie wordt appèl gehouden. Even later komt de chef met een agent die wat Engels spreekt kennismaken. Ze vragen hoe lang we blijven, waar we …", "bloglink": "https://rondjewereld.nl/2016/06/13/to-chiquimula/"}, {"titel": "El Bosque, Copan Ruinas", "omschrijving": "", "wanneer": "jun 15, 2016", "icon": "campground", "kmstand": 201498, "tripkm": 49004, "land": "Guatemala", "staat": "", "lat": 14.834074, "lng": -89.154983, "dt": 20160615, "ord": 339, "blogsnip": "De wekker gaat om half 7; vroeg op voor de grensovergang. Het is nog een uur rijden naar de grens met Honduras. Om kwart over 9 zijn we er en het is meteen al chaos. Veel vrachtwagens. We parkeren en hebben snel het uitreisstempel te pakken (maar 1 euro per …", "bloglink": "https://rondjewereld.nl/2016/06/15/hola-honduras/"}, {"titel": "D&D Brewery, Pena Blanca", "omschrijving": "", "wanneer": "jun 18, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Honduras", "staat": "", "lat": 14.946852, "lng": -88.037795, "dt": 20160618, "ord": 340, "blogsnip": "We hebben besloten wat meters te maken. Dus ontbijten we eerst rustig en gaan we dan op pad. De snelweg kronkelt door de bergen. Er zijn veel wegwerkzaamheden, soms moeten we even wachten omdat er 1 baan beschikbaar is. Kilometers lang wordt er beton gestort, waarschijnlijk weersbestendiger dan asfalt.", "bloglink": "https://rondjewereld.nl/2016/06/18/driveseeing-honduras/"}, {"titel": "Panacam Lodge, Cerro Azul", "omschrijving": "", "wanneer": "jun 20, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Honduras", "staat": "", "lat": 14.872206, "lng": -87.904798, "dt": 20160620, "ord": 341, "blogsnip": "Na het ontbijt pakken we de bus in en vullen we de watertank. Dan nemen we afscheid van Thomie en Raymonde, die richting Mexico rijden. Het is mooi weer, dus willen we kayakken op het Yojoa meer. Eerst stoppen we bij een verlaten hotel waar kayaks te huur zouden zijn …", "bloglink": "https://rondjewereld.nl/2016/06/20/cerro-azul-meambar/"}, {"titel": "Aqua Splash", "omschrijving": "", "wanneer": "jun 21, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Honduras", "staat": "", "lat": 14.138815, "lng": -87.282314, "dt": 20160621, "ord": 342, "blogsnip": "De wekker gaat vroeg, snel ontbijten en kleren aan. Om 7 uur starten we al met de Sinai Sendero, een hike van zo’n 4 uur. Het is erg bewolkt en we klimmen zelfs tot in de wolken, in de cloud forest. De luchtvochtigheid is hier zo hoog, dat je geen …", "bloglink": "https://rondjewereld.nl/2016/06/21/hiking-the-cloud-forest/"}, {"titel": "Hotel Quinta Alejandra", "omschrijving": "", "wanneer": "jun 22, 2016", "icon": "campground", "kmstand": 202185, "tripkm": 49691, "land": "Honduras", "staat": "", "lat": 14.02056, "lng": -86.61575, "dt": 20160622, "ord": 343, "blogsnip": "’s Morgens zijn we lekker snel klaar; geen douche hier. Het is maar een paar kilometer naar Tegucigalpa, de hoofdstad van Honduras. Er zijn niet veel bezienswaardigheden en het is bovendien niet zo’n veilige stad. Dus rijden wij rechtstreeks naar de Walmart om boodschappen te doen; spullen die je bij …", "bloglink": "https://rondjewereld.nl/2016/06/22/bliksembezoek-tegucigalpa/"}, {"titel": "Finca Lindos Ojos", "omschrijving": "", "wanneer": "jun 23, 2016", "icon": "campground", "kmstand": 202345, "tripkm": 49851, "land": "Honduras", "staat": "", "lat": 13.242647, "lng": -86.256545, "dt": 20160623, "ord": 344, "blogsnip": "Vroeg op, inpakken en alle papieren voor de grensovergang klaarleggen. We zijn goed voorbereid, maar tijdens de rit naar de grens hebben we altijd een beetje het gevoel of we examen moeten doen. Langs de bergweg naar de grens staan ontzettend veel vrachtwagens geparkeerd. Het is altijd onduidelijk waarom dat …", "bloglink": "https://rondjewereld.nl/2016/06/23/now-it-s-nica-time/"}, {"titel": "Rancho Los Alpes, Leon", "omschrijving": "", "wanneer": "jun 24, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Nicaragua", "staat": "", "lat": 12.417806, "lng": -86.960392, "dt": 20160624, "ord": 345, "blogsnip": "Het gebied waar we zitten is een cloud forest. Gisteren was daar niks van te zien, want het was helder. Maar vanmorgen is het meteen duidelijk; mist en regen. En dat maakt dat de 23 kilometer dirtroad van gisteren met hier en daar een modderige plas is veranderd in een …", "bloglink": "https://rondjewereld.nl/2016/06/24/from-clouds-to-tropics/"}, {"titel": "Mind the Gap, San Diego, Nicaragua", "omschrijving": "", "wanneer": "jun 26, 2016", "icon": "campground", "kmstand": 202630, "tripkm": 50136, "land": "Nicaragua", "staat": "", "lat": 11.904766, "lng": -86.614215, "dt": 20160626, "ord": 346, "blogsnip": "Vanmorgen als we aan de thee zitten komt Axel weer wat brengen: een thermoskan koffie en koekjes. Leuk, zeg. We pakken in en vullen de watertank. Axel gaat weg met de auto, dus hij komt gedag zeggen. Allebei krijgen we een hug. We geven een klompje, want hij is zo …", "bloglink": "https://rondjewereld.nl/2016/06/26/playa-san-diego/"}, {"titel": "Paradiso Hostel", "omschrijving": "", "wanneer": "jun 27, 2016", "icon": "campground", "kmstand": 202735, "tripkm": 50241, "land": "Nicaragua", "staat": "", "lat": 11.93323, "lng": -86.054624, "dt": 20160627, "ord": 347, "blogsnip": "Na het ontbijt rijden we de bus vanaf het braakliggende terreintje naar de ingang van de camping verderop in de straat. Eerst even internetten met een bakkie koffie op onder de palapa met uitzicht op zee. De douche is ommuurd, maar zonder dak. We maken daarna een strandwandeling langs de …", "bloglink": "https://rondjewereld.nl/2016/06/27/lavalicious/"}, {"titel": "Red Cross, Granada", "omschrijving": "", "wanneer": "jun 29, 2016", "icon": "campground", "kmstand": 202758, "tripkm": 50264, "land": "Nicaragua", "staat": "", "lat": 11.930447, "lng": -85.946543, "dt": 20160629, "ord": 348, "blogsnip": "‘s Morgens nemen we afscheid van Connie en Shamyl. Zij gaan al verder, wij moeten nog wat klussen. In het bovenkastje van de keuken hebben we weer stukjes plastic gevonden en dat betekent dat de haken waaraan de kast hangt het binnenkort begeven. Preventief klussen dus. Het is enorm zweten …", "bloglink": "https://rondjewereld.nl/2016/06/29/granada/"}, {"titel": "Hotel California, San Jorge", "omschrijving": "", "wanneer": "jun 30, 2016", "icon": "campground", "kmstand": 202832, "tripkm": 50338, "land": "Nicaragua", "staat": "", "lat": 11.458717, "lng": -85.793377, "dt": 20160630, "ord": 349, "blogsnip": "We zijn al vroeg op, dus besluiten we ook vroeg naar Volcan Mombacho te gaan. Deze vulkaan ligt op een kwartier rijden van Granada. Vanuit de stad hebben we gisteren de voet van de vulkaan al gezien; de top was verborgen achter de wolken. Ook vandaag is het flink bewolkt …", "bloglink": "https://rondjewereld.nl/2016/06/30/volcan-mombacho/"}, {"titel": "Moyogalpa, Ometepe", "omschrijving": "", "wanneer": "jul 1, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Nicaragua", "staat": "", "lat": 11.538709, "lng": -85.698448, "dt": 20160701, "ord": 350, "blogsnip": "‘s Morgens hangen we nog wat rond op de camping. Niet zo’n haast, want we hoeven ons pas om 3 uur te melden voor de ferry. De was hangt nog te drogen onder een afdak, als Lesley het gaat ophalen. Bij de vraag wat het wassen kost, mag je het …", "bloglink": "https://rondjewereld.nl/2016/07/01/ferry-naar-ometepe/"}, {"titel": "Hostel Finca Magdalena", "omschrijving": "", "wanneer": "jul 2, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Nicaragua", "staat": "", "lat": 11.482711, "lng": -85.508754, "dt": 20160702, "ord": 351, "blogsnip": "‘s Morgens lopen we een rondje door Moyogalpa, de grootste plaats van Ometepe. Het zijn maar een paar straten. Bij het kantoor van de ferry informeren we of er plaats is op maandag. En wat het kost, na het eerdere gedoe rond de prijs. Als we de rekening van de …", "bloglink": "https://rondjewereld.nl/2016/07/02/ometepe/"}, {"titel": "Porta Do Sol", "omschrijving": "", "wanneer": "jul 3, 2016", "icon": "campground", "kmstand": 202945, "tripkm": 50451, "land": "Nicaragua", "staat": "", "lat": 11.244924, "lng": -85.846044, "dt": 20160703, "ord": 352, "blogsnip": "Het regent flink vanmorgen. Jammer, wat de bezienswaardigheden op Ometepe zijn vooral geschikt voor mooi weer. Dus maken we een nieuw plan; een dag eerder terug naar het vasteland. Op een eiland ben je immers minder flexibel. Al vroeg rijden we weer naar de andere kant van het eiland. Eerst …", "bloglink": "https://rondjewereld.nl/2016/07/03/back-to-mainland-nica/"}, {"titel": "Canas Castillo", "omschrijving": "", "wanneer": "jul 5, 2016", "icon": "campground", "kmstand": 202980, "tripkm": 50486, "land": "Nicaragua", "staat": "", "lat": 11.125586, "lng": -85.592391, "dt": 20160705, "ord": 353, "blogsnip": "Half 7 op, want we hebben weer een “examen”: grensovergang. Als we vroeg wegrijden lijkt het er even op dat er een wegblokkade is. Maar we mogen er door. Om klokslag 9 uur zijn we bij de grens. Uitreisstempels hebben we zo te pakken. Daarna is het een soort vossenjacht …", "bloglink": "https://rondjewereld.nl/2016/07/05/costa-rica/"}, {"titel": "Tucan Hostal, Uvita", "omschrijving": "", "wanneer": "jul 11, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Costa Rica", "staat": "", "lat": 9.172637, "lng": -83.738464, "dt": 20160711, "ord": 354, "blogsnip": "Om 5 uur gaat de wekker. Niks uitslapen voor Lesley’s verjaardag. We melden ons om 6 uur bij de lodge voor de Quetzal Tour; op zoek naar de zeldzame groene vogel. Eerst koffie, dan met de gids en andere toeristen op weg. In dit gebied werken 20 boeren samen met …", "bloglink": "https://rondjewereld.nl/2016/07/11/cute-quetzal/"}, {"titel": "Refugio Vivre Sylvestre Junquillal", "omschrijving": "", "wanneer": "jul 6, 2016", "icon": "campground", "kmstand": 203040, "tripkm": 50546, "land": "Nicaragua", "staat": "", "lat": 10.967556, "lng": -85.688521, "dt": 20160706, "ord": 355, "blogsnip": "’s Nachts regent het flink en ook ’s morgens valt er nog een buitje. Na het ontbijt is het droog, dus snel kleren aan om te hiken. Bij deze camping is een enorm stuk grond, waar verschillende routes zijn uitgezet. Met nummers en gekleurde paaltjes, lekker duidelijk. We klimmen de …", "bloglink": "https://rondjewereld.nl/2016/07/06/junquillal/"}, {"titel": "Thermen Laureles, La Fortuna", "omschrijving": "", "wanneer": "jul 7, 2016", "icon": "campground", "kmstand": 203237, "tripkm": 50743, "land": "Costa Rica", "staat": "", "lat": 10.489035, "lng": -84.679457, "dt": 20160707, "ord": 356, "blogsnip": "Flinke regenbui ‘s morgens, dus we pakken vroeg in. Voor vandaag hebben we nog niet zo’n vastomlijnd plan. Eerst maar naar Liberia rijden voor koffie en internet. We vinden de leuke koffietent met goede reviews, maar helaas hebben ze nu geen internet. We besluiten langs Laguna de Arenal te rijden …", "bloglink": "https://rondjewereld.nl/2016/07/07/laguna-de-arenal/"}, {"titel": "Parc Recreativo Los Manantiales", "omschrijving": "", "wanneer": "jul 9, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Costa Rica", "staat": "", "lat": 10.046162, "lng": -84.263444, "dt": 20160709, "ord": 357, "blogsnip": "Met Gerhard gaat het weer beter gelukkig. Dus kunnen we weer op pad. Eerst rustig ontbijten in de bus, terwijl buiten in de miezer de file voor de ingang van het zwembad steeds groter wordt. Het gaat om 9 uur open, maar men wil blijkbaar op tijd zijn. Als we …", "bloglink": "https://rondjewereld.nl/2016/07/09/sarchi/"}, {"titel": "Mirador de Quetzal", "omschrijving": "", "wanneer": "jul 10, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Costa Rica", "staat": "", "lat": 9.653173, "lng": -83.84904, "dt": 20160710, "ord": 358, "blogsnip": "Al vroeg komen dagjesmensen naar het park waar we slapen. En er komen voetbalteams voor de zondagscompetitie. Een paar mannen komen praten. Als iemand hoort dat we uit Nederland komen, wordt gevraagd of Gerhard mee gaat voetballen. Eh, nee. We gaan vroeg zwemmen, terwijl de net aangekomen families zich installeren …", "bloglink": "https://rondjewereld.nl/2016/07/10/tico-highlands/"}, {"titel": "Purruja Lodge, Golfita", "omschrijving": "", "wanneer": "jul 12, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Costa Rica", "staat": "", "lat": 8.602603, "lng": -83.109652, "dt": 20160712, "ord": 359, "blogsnip": "Even een beetje uitslapen na dat vroege opstaan van gisteren. Wel waren we vergeten de wekker uit te zetten, dus ging die om 5 uur weer af. Gewoon omdraaien en doorslapen. De hele ochtend doen we lekker rustig aan, nog even in de hangmatten internetten en wat kletsen met deze …", "bloglink": "https://rondjewereld.nl/2016/07/12/golfito/"}, {"titel": "Pension Topas, Boquete", "omschrijving": "", "wanneer": "jul 13, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Panama", "staat": "", "lat": 8.772788, "lng": -82.4322, "dt": 20160713, "ord": 360, "blogsnip": "‘s Morgens zien we weer de schattige aapjes. Net als we weg willen rijden, komt de Duitse man nog even kletsen. Daarna op naar de grens, waar we om half 10 zijn. Uitchecken bij Costa Rica gaat best snel, maar het blijft zoeken. Ondanks het feit dat wij van andere …", "bloglink": "https://rondjewereld.nl/2016/07/13/panama/"}, {"titel": "Alto Chiquero Ranger Station Volcan Baru", "omschrijving": "", "wanneer": "jul 15, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Panama", "staat": "", "lat": 8.84694, "lng": -82.488589, "dt": 20160715, "ord": 361, "blogsnip": "’s Morgens schijnt de zon weer. Nog even wat internetten en inpakken. Dan doen we wat boodschappen. We rijden de bergen in via de Bajo Mono Loop, een mooie route langs watervallen. Het plan is te gaan hiken, maar we weten niet precies waar. Eerst maar even kijken bij het …", "bloglink": "https://rondjewereld.nl/2016/07/15/sendero-de-los-quetzales/"}, {"titel": "Residencia de la Marina, Boca Chica", "omschrijving": "", "wanneer": "jul 16, 2016", "icon": "campground", "kmstand": 203964, "tripkm": 51470, "land": "Panama", "staat": "", "lat": 8.220408, "lng": -82.219278, "dt": 20160716, "ord": 362, "blogsnip": "Rond 8 uur staan we op. Lekker rustig hier in de bergen. Wel vaak wakker vannacht om om te draaien in bed; de bus staat behoorljk scheef, zodat we bijna uit bed rollen. En we hebben al spierpijn van die enorme hike. Gerhard gaat naar buiten en Carlos kletst al …", "bloglink": "https://rondjewereld.nl/2016/07/16/boca-chica/"}, {"titel": "Hotel Santa Fe, Santa Fe, Panama", "omschrijving": "", "wanneer": "jul 18, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Panama", "staat": "", "lat": 8.504489, "lng": -81.072865, "dt": 20160718, "ord": 363, "blogsnip": "Na die enorme bui van gisteravond spettert het vanmorgen nog wat. De bergschoenen zijn nog lang niet droog. Om half 11 gaan we rijden, eerst het terrein af met die lage bomen. Normaal gesproken houdt Lesley met een balkje (een resthoutje) de laaghangende takken omhoog. Omdat de takken doorweekt zijn …", "bloglink": "https://rondjewereld.nl/2016/07/18/santa-fe/"}, {"titel": "Keruasa", "omschrijving": "", "wanneer": "jul 19, 2016", "icon": "campground", "kmstand": 204327, "tripkm": 51833, "land": "Panama", "staat": "", "lat": 7.967365, "lng": -80.341094, "dt": 20160719, "ord": 364, "blogsnip": "De zon schijnt en de lucht is blauw. Mooi hier, geweldige bergen. In onze reisgids staat dat je bij een hotel toekans kunt voeren. Gisteren hadden we een mailtje gestuurd om te vragen hoe laat dat kan. Vandaag is er antwoord: ze hebben geen toekans meer. Jammer. Verder is er …", "bloglink": "https://rondjewereld.nl/2016/07/19/azuero-peninsula/"}, {"titel": "Hostel Venao Cove", "omschrijving": "", "wanneer": "jul 20, 2016", "icon": "campground", "kmstand": 204440, "tripkm": 51946, "land": "Panama", "staat": "", "lat": 7.431199, "lng": -80.205858, "dt": 20160720, "ord": 365, "blogsnip": "‘s Morgens komt de Colombiaanse campingbaas vertellen dat er in Las Tablas festiviteiten zijn. Zelf hadden we dat ook al opgezocht op internet, maar het programma is niet duidelijk. We vullen de watertank, pakken in en rijden naar Las Tablas. De straten zijn deels afgezet en het is goed druk.", "bloglink": "https://rondjewereld.nl/2016/07/20/venao-beach/"}, {"titel": "Windmill Hostel, El Valle de Anton", "omschrijving": "", "wanneer": "jul 21, 2016", "icon": "campground", "kmstand": 204682, "tripkm": 52188, "land": "Panama", "staat": "", "lat": 8.604531, "lng": -80.126875, "dt": 20160721, "ord": 366, "blogsnip": "Het is grijs weer als we opstaan. Dus hangen we een beetje in de bus. Lekker rustig aan, geen plannen vandaag, behalve rijden. Eind van de ochtend vertrekken we naar het noorden. De afstand valt wel mee, maar het gaat niet zo snel. Bochtige weg. In Chitre halen we wat …", "bloglink": "https://rondjewereld.nl/2016/07/21/dagje-rijden/"}, {"titel": "Hostal Amadore", "omschrijving": "", "wanneer": "jul 25, 2016", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "Panama", "staat": "", "lat": 8.94938, "lng": -79.555625, "dt": 20160725, "ord": 367, "blogsnip": "Na 16 maanden gaan we naar huis. En hoewel we het al een tijd geleden besloten hebben en de boot voor verscheping van de bus geboekt is, is het vandaag pas echt. Want we moeten ons melden op het kantoor van de agent in Panama City. Vanuit El Valle 1,5 …", "bloglink": "https://rondjewereld.nl/2016/07/25/kantoordag/"}, {"titel": "La Granja Campo y Aventura", "omschrijving": "", "wanneer": "jul 26, 2016", "icon": "campground", "kmstand": 204985, "tripkm": 52491, "land": "Panama", "staat": "", "lat": 9.344491, "lng": -79.835102, "dt": 20160726, "ord": 368, "blogsnip": "Na ontbijt in ons hotel vertrekken we om 8 uur voor de inspectie van de bus. Op de navigatie op een mobiel, want de tablet is kapot. We hebben geen adres, maar weten ongeveer waar het is. Panama City blijkt een enorm lastige stad te zijn, veel viaducten en nauwelijks …", "bloglink": "https://rondjewereld.nl/2016/07/26/van-hot-naar-her/"}, {"titel": "Shipping back to Europe. Expected departure: 1 August 2016", "omschrijving": "", "wanneer": "jul 28, 2016", "icon": "sea_ports", "kmstand": 204997, "tripkm": 52503, "land": "Panama", "staat": "", "lat": 9.365231, "lng": -79.885523, "dt": 20160728, "ord": 369, "blogsnip": "Om 7 uur zitten we in het verder lege restaurant aan het ontbijt. Ze zijn speciaal vroeg voor ons open gegaan, omdat we vroeg weg willen. In een kwartier rijden we naar Manzanillo, de haven van Colon. Om klokslag 8 uur melden we ons bij het kantoor van onze agent …", "bloglink": "https://rondjewereld.nl/2016/07/28/bye-bye-bus/"}, {"titel": "Coral Suites, Panama City", "omschrijving": "", "wanneer": "jul 30, 2016", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "Panama", "staat": "", "lat": 8.98599, "lng": -79.526801, "dt": 20160730, "ord": 370, "blogsnip": "‘s Morgens regent het keihard. Vaak is een tropische bui kort en hevig, maar nu blijft het maar gieten. Om 8 uur zitten we aan een zeer uitgebreid ontbijt op het overdekte terras. We zouden vandaag met Sandra, de Duitse eigenaresse, een jungle tour maken. Maar het is veel te …", "bloglink": "https://rondjewereld.nl/2016/07/30/back-to-the-city/"}, {"titel": "Bambu Guesthouse, Puerto Lindo", "omschrijving": "", "wanneer": "jul 29, 2016", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "Panama", "staat": "", "lat": 9.606399, "lng": -79.58436, "dt": 20160729, "ord": 371, "blogsnip": "‘s Morgens regent het keihard. Vaak is een tropische bui kort en hevig, maar nu blijft het maar gieten. Om 8 uur zitten we aan een zeer uitgebreid ontbijt op het overdekte terras. We zouden vandaag met Sandra, de Duitse eigenaresse, een jungle tour maken. Maar het is veel te …", "bloglink": "https://rondjewereld.nl/2016/07/30/back-to-the-city/"}];
const STATES_BY_LAND = {"USA": ["Maryland", "District of Columbia", "Delaware", "Virginia", "Pennsylvania", "New York", "New Jersey", "Connecticut", "Rhode Island", "Massachusetts", "New Hampshire", "Vermont", "Maine", "Michigan", "Indiana", "South Dakota", "Wisconsin", "Colorado", "Nebraska", "New Mexico", "Texas", "Arizona", "California", "Nevada"], "Canada": ["Nova Scotia", "Prince Edward Island", "Newfoundland", "New Brunswick", "Quebec", "Ontario"], "Mexico": ["Baja California Sur", "Baja California", "Chihuahua", "Sinaloa", "Nayarit", "Jalisco", "Guanajuato", "Michoacán", "Estado de México", "Ciudad de México", "Puebla", "Oaxaca", "Chiapas", "Campeche", "Yucatán", "Quintana Roo"], "Belize": [], "Guatemala": [], "Honduras": [], "Nicaragua": [], "Costa Rica": [], "Panama": []};
const LAND_COLORS = {"USA": "#2563eb", "Canada": "#dc2626", "Mexico": "#16a34a", "Belize": "#9333ea", "Guatemala": "#ea580c", "Honduras": "#0891b2", "Nicaragua": "#ca8a04", "Costa Rica": "#db2777", "Panama": "#65a30d"};

const ICONS = {
  campground: {emoji:"⛺", label:"Camping", bg:"#16a34a"},
  rec_lodging: {emoji:"🏨", label:"Hotel", bg:"#2563eb"},
  sea_ports: {emoji:"⚓", label:"Haven", bg:"#0891b2"},
  cycling: {emoji:"🚴", label:"Fietsen", bg:"#ca8a04"},
  camera: {emoji:"📷", label:"Bezienswaardigheid", bg:"#db2777"},
  default: {emoji:"📍", label:"Stop", bg:"#64748b"}
};
function iconFor(k){ return ICONS[k] || ICONS.default; }

let curLand = "all", curState = "all";

const map = L.map('map', { scrollWheelZoom: true }).setView([28, -95], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom: 19
}).addTo(map);

let markerLayer = L.layerGroup().addTo(map);
let routeLine = null;

function filtered(){
  return DATA.filter(d =>
    (curLand==="all" || d.land===curLand) &&
    (curState==="all" || d.staat===curState));
}

function fmt(n){ return n==null ? "" : n.toLocaleString('nl-NL'); }

function makeIcon(d){
  const ic = iconFor(d.icon);
  return L.divIcon({
    className: '', iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-13],
    html: `<div class="map-icon" style="background:${ic.bg}">${ic.emoji}</div>`
  });
}

function render(){
  const rows = filtered();
  markerLayer.clearLayers();
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  const pts = [];
  rows.forEach(d => {
    if (d.lat==null || d.lng==null) return;
    const ic = iconFor(d.icon);
    const m = L.marker([d.lat, d.lng], {icon: makeIcon(d)});
    m.bindPopup(`<div class="popup-title">${d.titel}</div>
      <div class="popup-meta">${ic.label} · ${d.staat||''}, ${d.land} · ${d.wanneer||''}</div>
      ${d.tripkm!=null?`<div class="popup-km">Trip: ${fmt(d.tripkm)} km</div>`:''}
      ${d.omschrijving?`<div class="popup-desc">${d.omschrijving}</div>`:''}${d.blogsnip?`<div class="popup-blog">${d.blogsnip}</div>`:''}${d.bloglink?`<a class="popup-more" href="${d.bloglink}" target="_blank" rel="noopener">Lees verder →</a>`:''}`);
    markerLayer.addLayer(m);
  });
  rows.filter(d=>d.lat!=null&&d.lng!=null).forEach(d=>pts.push([d.lat,d.lng]));
  const linePts = rows.filter(d=>d.lat!=null&&d.lng!=null)
    .slice().sort((a,b)=> (a.dt-b.dt) || (a.ord-b.ord))
    .map(d=>[d.lat,d.lng]);
  if (linePts.length>1){
    routeLine = L.polyline(linePts, {color:'#6366f1', weight:2, opacity:.5}).addTo(map);
  }
  if (pts.length){ map.fitBounds(L.latLngBounds(pts).pad(0.15)); }
  renderStateList(rows);
  renderTable(rows);
  renderChart(rows);
  document.getElementById('t-count').textContent = rows.length;
}

function renderStateList(rows){
  const counts = {};
  rows.forEach(d => { const s=d.staat||'—'; counts[s]=(counts[s]||0)+1; });
  const wrap = document.getElementById('state-list');
  wrap.innerHTML = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([s,c])=>{
    const land = (DATA.find(d=>d.staat===s)||{}).land;
    const col = LAND_COLORS[land] || '#64748b';
    return `<div class="list-row" data-state="${s}">
      <span class="dot" style="background:${col}"></span>
      <span class="row-name">${s}</span><span class="row-cnt">${c}</span></div>`;
  }).join('');
  wrap.querySelectorAll('.list-row').forEach(r => r.onclick = () => {
    const s = r.dataset.state;
    if (s==='—') return;
    curState = (curState===s) ? 'all' : s;
    document.getElementById('state-select').value = curState;
    render();
  });
}

function renderTable(rows){
  document.getElementById('tbody').innerHTML = rows.map(d => {
    const ic = iconFor(d.icon);
    return `<tr>
      <td class="t-icon" title="${ic.label}">${ic.emoji}</td>
      <td>${d.titel}</td><td>${d.wanneer||''}</td><td>${ic.label}</td>
      <td>${d.land}</td><td>${d.staat||''}</td>
      <td class="num">${fmt(d.tripkm)}</td></tr>`;
  }).join('');
}

let chart = null;
function renderChart(rows){
  const counts = {};
  rows.forEach(d => { const l=iconFor(d.icon).label; counts[l]=(counts[l]||0)+1; });
  const labels = Object.keys(counts);
  const ctx = document.getElementById('chart');
  const cols = labels.map(l => {
    const e = Object.values(ICONS).find(i=>i.label===l); return e?e.bg:'#64748b';
  });
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data:Object.values(counts), backgroundColor:cols, borderWidth:2, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false,
      animation:false, animations:false, transitions:{active:{animation:{duration:0}}},
      hover:{mode:null}, events:[],
      plugins:{ legend:{ position:'bottom', labels:{ font:{size:11}, color:'#475569', padding:10 } } } }
  });
}

// populate state dropdown based on land
function refreshStateDropdown(){
  const sel = document.getElementById('state-select');
  let opts = '<option value="all">Alle provincies</option>';
  const lands = curLand==="all" ? Object.keys(STATES_BY_LAND) : [curLand];
  lands.forEach(l => {
    const states = STATES_BY_LAND[l] || [];
    if (!states.length) return;
    opts += `<optgroup label="${l}">` +
      states.map(s=>`<option value="${s}">${s}</option>`).join('') + '</optgroup>';
  });
  sel.innerHTML = opts;
  sel.value = curState;
}

document.querySelectorAll('.filter-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  curLand = b.dataset.land; curState = 'all';
  refreshStateDropdown(); render();
});
document.getElementById('state-select').onchange = e => { curState = e.target.value; render(); };

// stats
document.getElementById('s-stops').textContent = 372;
document.getElementById('s-states').textContent = 46;
document.getElementById('s-km').textContent = fmt(52503);
document.getElementById('s-countries').textContent = 9;

// initial paint
refreshStateDropdown();
render();
</script>
</body>
