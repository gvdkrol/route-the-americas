 2015", "icon": "campground", "kmstand": 157631, "tripkm": 5137, "land": "USA", "staat": "Massachusetts", "lat": 42.829, "lng": -72.558, "dt": 20150529, "ord": 41, "blogsnip": "Om half 7 gaat de wekker, want we gaan hiken. Douchen gaat met kwartjes (3 minuten voor 50 cent),dus dat schiet lekker op (net aan de shampoo uitgespoeld). We rijden naar de andere ingang van het park en beginnen vroeg aan de hike naar de top. Onderweg komen we best …", "bloglink": "https://rondjewereld.nl/2015/05/29/mountain-that-stands-alone/"}, {"titel": "Lost River Valley Campground, North Woodstock, NH", "omschrijving": "", "wanneer": "jun 3, 2015", "icon": "campground", "kmstand": 158299, "tripkm": 5805, "land": "USA", "staat": "New Hampshire", "lat": 44.047, "lng": -71.71, "dt": 20150603, "ord": 42, "blogsnip": "We hebben geen wekker gezet en zijn laat wakker. De zon schijnt, de lucht is koel. Lekker buiten ontbijten. Vanaf de camping doen we een hike door de Quechee Gorge, door het bos met mooi licht en langs het kolkende water. Daarna rijden we Vermont uit naar Hanover, een college …", "bloglink": "https://rondjewereld.nl/2015/06/03/to-the-white-mountains/"}, {"titel": "Kampersville, Salisbury, VT", "omschrijving": "", "wanneer": "May 30, 2015", "icon": "campground", "kmstand": 157806, "tripkm": 5312, "land": "USA", "staat": "Vermont", "lat": 43.888, "lng": -73.097, "dt": 20150530, "ord": 43, "blogsnip": "Blijkbaar waren we wel moe van de hike van gisteren, want we worden pas na negen uur wakker. Met spierpijn in de bovenbenen; best hoge opstap de bus in. Omdat we om 11 uur moeten uitchecken is het best nog even opschieten. Als we wegrijden vinden we een visitekaartje van …", "bloglink": "https://rondjewereld.nl/2015/05/30/green-mountains/"}, {"titel": "North Beach Campground, Burlington, VT", "omschrijving": "", "wanneer": "May 31, 2015", "icon": "campground", "kmstand": 157887, "tripkm": 5393, "land": "USA", "staat": "Vermont", "lat": 44.49, "lng": -73.219, "dt": 20150531, "ord": 44, "blogsnip": "Het heeft veel geregend vannacht en vanmorgen spettert het nog steeds. Nadat we hebben ingepakt rijden we naar Middlebury, iets verderop, om een wasje te draaien bij de wasserette. Ondertussen halen we nog wat kleine boodschappen en klust Gerhard in de bus. De spullen die niet in de droger kunnen …", "bloglink": "https://rondjewereld.nl/2015/05/31/brrr-in-burlington/"}, {"titel": "Smugglers' Notch State Park, Stowe, VT", "omschrijving": "", "wanneer": "jun 1, 2015", "icon": "campground", "kmstand": 157980, "tripkm": 5486, "land": "USA", "staat": "Vermont", "lat": 44.553, "lng": -72.793, "dt": 20150601, "ord": 45, "blogsnip": "Prima geslapen onder 2 extra fleece dekens. Buiten is het koud en miezerig, dus ontbijten we in de bus. Nog even genieten van het snelle internet en dan gaan we op pad. Voor de tweede dag naar het Shelburne Museum. Een kaartje is 2 dagen geldig en we hebben nog …", "bloglink": "https://rondjewereld.nl/2015/06/01/shelburne-museum-part-2/"}, {"titel": "Quechee State Park, Quechee, VT", "omschrijving": "", "wanneer": "jun 2, 2015", "icon": "campground", "kmstand": 158140, "tripkm": 5646, "land": "USA", "staat": "New Hampshire", "lat": 43.683, "lng": -72.503, "dt": 20150602, "ord": 46, "blogsnip": "Yeah, het is droog buiten als de wekker gaat. Nog bewolkt en fris (in de bus 10 graden), maar droog is wel erg fijn. We staan vroeg op, omdat we veel willen doen. In Stowe rijden we een berg op naar de Von Trapp Lodge. De Von Trapp family (van …", "bloglink": "https://rondjewereld.nl/2015/06/02/the-hills-are-alive-with-the-taste-of-ice-cream/"}, {"titel": "Passaconaway Campsite, White Mountains, NH", "omschrijving": "", "wanneer": "jun 4, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "USA", "staat": "New Hampshire", "lat": 43.999, "lng": -71.394, "dt": 20150604, "ord": 47, "blogsnip": "Vroeg op, want we willen vandaag veel doen. Het is nog bewolkt, dus ontbijten we binnen. Eerst rijden we naar het noorden, naar Franconia Notch State Park. De White Mountains zijn zo groot, dat dit gebied weer in verschillende deelparken is opgedeeld. Na een bakkie hiken we eerst door de …", "bloglink": "https://rondjewereld.nl/2015/06/04/franconia-notch/"}, {"titel": "Gray Homestead Campground, Southport, ME", "omschrijving": "", "wanneer": "jun 6, 2015", "icon": "campground", "kmstand": 158676, "tripkm": 6182, "land": "USA", "staat": "Maine", "lat": 43.825, "lng": -69.682, "dt": 20150606, "ord": 48, "blogsnip": "Vanmorgen breekt de zon al snel door de wolken. Het is niet heel erg warm, maar lekker buiten weer. De eerste stop vandaag is dichtbij de camping; een chocolade-winkel met als attractie Lenny the Moose, een eland van chocolade op ware grootte. In de winkel draait een video, zodat je …", "bloglink": "https://rondjewereld.nl/2015/06/06/whoopie/"}, {"titel": "Wassamki Springs Campground, Scarborough, ME", "omschrijving": "", "wanneer": "jun 5, 2015", "icon": "campground", "kmstand": 158535, "tripkm": 6041, "land": "USA", "staat": "Maine", "lat": 43.578, "lng": -70.327, "dt": 20150605, "ord": 49, "blogsnip": "We staan extra vroeg op, omdat we op elandjacht (met camera) gaan. Deze camping heeft geen douche, dus dat schiet weer lekker op. Om half acht staan we met een banaan over een meertje te turen of we elanden zien. Even denken we ze te horen, dus we sluipen over …", "bloglink": "https://rondjewereld.nl/2015/06/05/meet-the-shakers/"}, {"titel": "Pumpkin Patch RV Resort, Hermon, ME", "omschrijving": "", "wanneer": "jun 8, 2015", "icon": "campground", "kmstand": 158932, "tripkm": 6438, "land": "USA", "staat": "Maine", "lat": 44.804, "lng": -68.923, "dt": 20150608, "ord": 50, "blogsnip": "Vandaag is het behoorlijk bewolkt en voor later is er regen voorspeld. Dus bakken we voor ontbijt een ei in de bus. We rijden naar het noorden en zijn met een anderhalf uur in Camden. In Camden Hills State Park zijn we van plan te hiken naar Mount Battie. De …", "bloglink": "https://rondjewereld.nl/2015/06/08/mount-battie/"}, {"titel": "Sherwood Forest Campground, New Harbour, ME", "omschrijving": "", "wanneer": "jun 7, 2015", "icon": "campground", "kmstand": 158741, "tripkm": 6247, "land": "USA", "staat": "Maine", "lat": 43.858, "lng": -69.507, "dt": 20150607, "ord": 51, "blogsnip": "Heerlijk weer vanmorgen, dus wij doen weer rustig aan; klussen aan de bus en hardlopen. Om 11 uur rijden we weg naar Boothbay Harbour. Een toeristisch vissersplaatsje met veel B&B’s en restaurantjes. Het is nog geen hoogseizoen, maar er is wel al wat te doen. We lopen langs een popcornwinkel …", "bloglink": "https://rondjewereld.nl/2015/06/07/lekker-lobster/"}, {"titel": "Blackwood Campground, Acadia National Park, ME", "omschrijving": "", "wanneer": "jun 9, 2015", "icon": "campground", "kmstand": 159061, "tripkm": 6567, "land": "USA", "staat": "Maine", "lat": 44.312, "lng": -68.227, "dt": 20150609, "ord": 52, "blogsnip": "Het regent nog niet als we wakker worden, maar er hangt wel een dreigend wolkendek. We gaan op pad en rijden naar downtown Bangor. Het blijkt niet zoveel bijzonders te zijn, dus rijden we door naar de supermarkt voor wat boodschappen. Op het parkeerterrein lunchen we in de bus.", "bloglink": "https://rondjewereld.nl/2015/06/09/to-the-movies-in-rainy-maine/"}, {"titel": "Bass Harbor Campground, Bass Harbor,ME", "omschrijving": "", "wanneer": "jun 10, 2015", "icon": "campground", "kmstand": 159159, "tripkm": 6665, "land": "USA", "staat": "Maine", "lat": 44.225, "lng": -68.345, "dt": 20150610, "ord": 53, "blogsnip": "Het is meteen al droog en warm als we vroeg opstaan, speciaal wekker gezet. Voordat we wegrijden lopen we eerst nog even naar een uitzichtpunt over de ocean. Er hangt zo vroeg nog mist en de zon schijnt er doorheen, prachtig. We rijden de Park Loop Road en stoppen bij …", "bloglink": "https://rondjewereld.nl/2015/06/10/ahhhh-acadia/"}, {"titel": "Sunset Point RV Park, Lubec, ME", "omschrijving": "", "wanneer": "jun 11, 2015", "icon": "campground", "kmstand": 159350, "tripkm": 6856, "land": "USA", "staat": "Maine", "lat": 44.861, "lng": -66.989, "dt": 20150611, "ord": 54, "blogsnip": "Het is weer heerlijk weer, dus rijden we halverwege de ochtend nog even naar Acadia om een rondje rond Eagle Lake te fietsen. Vals plat, dus behoorlijk doortrappen. Weer even een fruitje eten op een steen aan het meer. Vlak voordat we Mount Desert Island af rijden, vinden we nog …", "bloglink": "https://rondjewereld.nl/2015/06/11/usa-s-easternmost-town/"}, {"titel": "Ocean Front Camping, St Andrews , NB, Canada", "omschrijving": "", "wanneer": "jun 12, 2015", "icon": "campground", "kmstand": 159487, "tripkm": 6993, "land": "USA", "staat": "Maine", "lat": 45.073, "lng": -67.054, "dt": 20150612, "ord": 55, "blogsnip": "Ook ‘s morgens is het uitzicht op onze unieke campeerplek prachtig. Zodra we zijn ingepakt rijden we naar Quoddy Head State Park, daadwerkelijk het meest oostelijke plekje van de USA. Er staat een vuurtoren en natuurlijk een steen met de coordinaten. Geweldig uitzicht; helder met mist op de horizon.", "bloglink": "https://rondjewereld.nl/2015/06/12/canada/"}, {"titel": "Rockwood Park, Saint John, NB, Canada", "omschrijving": "", "wanneer": "jun 13, 2015", "icon": "campground", "kmstand": 159602, "tripkm": 7108, "land": "Canada", "staat": "Nova Scotia", "lat": 45.279, "lng": -66.052, "dt": 20150613, "ord": 56, "blogsnip": "We slapen lekker uit en stappen ‘s morgens in zompig gras, want het heeft de hele nacht geregend. Gelukkig is het nu droog en mooi weer. We zijn pas laat weg bij de camping en gaan eerst het stadje bekijken. Mooie huizen met uitzicht over zee, restaurantjes en winkels, allemaal …", "bloglink": "https://rondjewereld.nl/2015/06/13/driving-the-ocean-floor/"}, {"titel": "Mactaquac Provincial Park, NB, Canada", "omschrijving": "", "wanneer": "jun 14, 2015", "icon": "campground", "kmstand": 159751, "tripkm": 7257, "land": "USA", "staat": "Maine", "lat": 46.05, "lng": -67.001, "dt": 20150614, "ord": 57, "blogsnip": "Al vroeg vertrekken we van de camping. We rijden even door Saint John, maar zeker op zondag lijkt er niet veel te doen in deze industriestad. Bij de rivier kijken we nog even bij Reversing Rapids; bij vloed stroomt het water i.p.v. naar zee de andere kant op. En inderdaad …", "bloglink": "https://rondjewereld.nl/2015/06/14/interior-new-brunswick/"}, {"titel": "Sheffield, New Brunswick, Canada", "omschrijving": "", "wanneer": "jun 15, 2015", "icon": "campground", "kmstand": 159845, "tripkm": 7351, "land": "Canada", "staat": "Nova Scotia", "lat": 45.92, "lng": -65.926, "dt": 20150615, "ord": 58, "blogsnip": "Hoewel we de wekker hadden gezet zijn we toch laat weg; lekker lui. Vandaag gaan we naar Kings Landing; een living history museum, waar mensen in klederdracht iets vertellen over de huizen en ambachten van eind 18 e en begin 19 e eeuw. Amerikanen die tijdens de onafhankelijkheidsoorlog met Engeland …", "bloglink": "https://rondjewereld.nl/2015/06/15/kings-landing/"}, {"titel": "Kouchibouguac National Park, NB, Canada", "omschrijving": "", "wanneer": "jun 16, 2015", "icon": "campground", "kmstand": 160117, "tripkm": 7623, "land": "Canada", "staat": "Nova Scotia", "lat": 46.806, "lng": -64.937, "dt": 20150616, "ord": 59, "blogsnip": "Zoals voorspeld is het vanochtend grijs, beetje miezer. Er worden buien verwacht, dus wij gaan een stuk rijden. Bij Moncton even pauze om boodschappen te doen. Tot nu staat alles steeds twee-talig aangegeven in Canada; eerst Engels, dan Frans. In dit gebied is het andersom.", "bloglink": "https://rondjewereld.nl/2015/06/16/driving-to-kouchibouguac/"}, {"titel": "Fundy National Park, NB, Canada", "omschrijving": "", "wanneer": "jun 18, 2015", "icon": "campground", "kmstand": 160405, "tripkm": 7911, "land": "Canada", "staat": "Nova Scotia", "lat": 45.593, "lng": -64.953, "dt": 20150618, "ord": 60, "blogsnip": "De klamboe werkt perfect; je slaapt prima als je muggen hoort, maar weet dat ze niet bij je kunnen komen. ’s Morgens is het ook weer een muggenparade, zodra we de bus open doen. We ontbijten buiten, daar zijn minder muggen dan binnen. Eenmaal ingepakt rijden we naar Bog, een …", "bloglink": "https://rondjewereld.nl/2015/06/18/to-fundy/"}, {"titel": "Pugwash, NS, Canada", "omschrijving": "", "wanneer": "jun 20, 2015", "icon": "campground", "kmstand": 160686, "tripkm": 8192, "land": "Canada", "staat": "Nova Scotia", "lat": 45.853, "lng": -63.711, "dt": 20150620, "ord": 61, "blogsnip": "Om half 7 gaat de wekker en het is 10 graden in de bus. Gelukkig schijnt de zon. Na het ontbijt gaan we al vroeg weg, ruim een half uur rijden naar Hopewell Rocks, dat om 8 uur open gaat. Hier kun je bij eb tussen vrijstaande rotsen lopen op …", "bloglink": "https://rondjewereld.nl/2015/06/20/hopewell-rocks-rocks/"}, {"titel": "Brudenell River Provincial Park, PEI, Canada", "omschrijving": "", "wanneer": "jun 21, 2015", "icon": "campground", "kmstand": 160876, "tripkm": 8382, "land": "Canada", "staat": "Prince Edward Island", "lat": 46.226, "lng": -62.684, "dt": 20150621, "ord": 62, "blogsnip": "Voor vandaag is regen voorspeld, maar het is ‘s morgens nog droog. We nemen de tijd om rustig te ontbijten en in te pakken. Daarna rijden we 1,5 uur langs de Sunshine Trail. Door kleine dorpjes, met even zo kleine kerkjes waar rond dit tijdstip behoorlijk wat auto’s staan. We …", "bloglink": "https://rondjewereld.nl/2015/06/21/ferry-to-pei/"}, {"titel": "St Peters Campground Saint Peters Bay, PE ,Canada", "omschrijving": "", "wanneer": "jun 22, 2015", "icon": "campground", "kmstand": 160992, "tripkm": 8498, "land": "Canada", "staat": "Prince Edward Island", "lat": 46.44, "lng": -62.578, "dt": 20150622, "ord": 63, "blogsnip": "Ook met regen op het dak slapen we prima. Vanmorgen regent het nog steeds. Dus besluiten we eerst maar een koffietent op te zoeken in Georgetown, even verderop. Daar drinken ze blijkbaar geen koffie buitenshuis, want er is niks te vinden. Aan de kant van de weg zetten we even …", "bloglink": "https://rondjewereld.nl/2015/06/22/charlottetown/"}, {"titel": "Drive In, Brackley Beach, PE, Canada", "omschrijving": "", "wanneer": "jun 23, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Prince Edward Island", "lat": 46.415, "lng": -63.159, "dt": 20150623, "ord": 64, "blogsnip": "Hoera, de lucht is blauw en de zon schijnt vanochtend. We pakken snel in en gaan naar PEI National Park. Eerst naar Greenwich, waar we een mooie hike doen over een drijvende boardwalk naar de duinen. Prachtig hier zo vroeg. Daarna weer de weg op, want het park bestaat uit …", "bloglink": "https://rondjewereld.nl/2015/06/23/from-beaches-to-movies/"}, {"titel": "Graves Island, NS, Canada", "omschrijving": "", "wanneer": "jul 3, 2015", "icon": "campground", "kmstand": 162032, "tripkm": 9538, "land": "Canada", "staat": "Nova Scotia", "lat": 44.591, "lng": -64.068, "dt": 20150703, "ord": 65, "blogsnip": "De wekker gaat vroeg, want we willen de ferry naar Big Tancook Island halen. Het regent zachtjes als we opstaan. Het is maar een klein stukje rijden naar Chester, onderweg even tanken. In de haven valt het nog niet mee om een parkeerplek te vinden; de meeste zijn voor maximaal …", "bloglink": "https://rondjewereld.nl/2015/07/03/big-tancook-island/"}, {"titel": "Linkletter Provincial Park, PE, Canada", "omschrijving": "", "wanneer": "jun 24, 2015", "icon": "campground", "kmstand": 161292, "tripkm": 8798, "land": "Canada", "staat": "Prince Edward Island", "lat": 46.353, "lng": -63.821, "dt": 20150624, "ord": 66, "blogsnip": "Al om kwart over 7 worden we wakker van een machine, die steeds al piepend achteruit rijdt. Er wordt nog aan de weg gewerkt van de Drive In bioscoop, maar dan wel erg vroeg naar onze smaak. Dus besluiten we even verderop naar het strand van Brackley Beach te rijden …", "bloglink": "https://rondjewereld.nl/2015/06/24/bottle-houses/"}, {"titel": "Parrsboro, NS, Canada", "omschrijving": "", "wanneer": "jun 25, 2015", "icon": "campground", "kmstand": 161468, "tripkm": 8974, "land": "Canada", "staat": "Nova Scotia", "lat": 45.405, "lng": -64.326, "dt": 20150625, "ord": 67, "blogsnip": "Het is ‘s morgens weer heerlijk weer, dus ontbijten we buiten. We lummelen lekker rond de camper en checken om 11 uur uit. Vandaag verlaten we Prince Edward Island via de Confederation Bridge. De brug is 13 kilometer lang en heeft dichte balustrades van 1.10 meter hoog, zodat je vanuit …", "bloglink": "https://rondjewereld.nl/2015/06/25/back-to-nova-scotia/"}, {"titel": "Old Shipyard Campground, Spencers Island, NS, Canada", "omschrijving": "", "wanneer": "jun 26, 2015", "icon": "campground", "kmstand": 161570, "tripkm": 9076, "land": "Canada", "staat": "Nova Scotia", "lat": 45.345, "lng": -64.713, "dt": 20150626, "ord": 68, "blogsnip": "De zon schijnt weer heerlijk vanmorgen, dus lekker buiten ontbijten. De douches zijn hier zo heet, dat je er niet onder kan staan. Lesley spoelt de shampoo uit boven de wasbak. Gerhard ziet maar van die hete douche af. Aangezien hij net de watertank gevuld heeft, kan ie even douchen …", "bloglink": "https://rondjewereld.nl/2015/06/26/hikes-and-tides/"}, {"titel": "Five Islands Provincial Park, Five Islands, NS, Canada", "omschrijving": "", "wanneer": "jun 27, 2015", "icon": "campground", "kmstand": 161642, "tripkm": 9148, "land": "Canada", "staat": "Nova Scotia", "lat": 45.396, "lng": -64.168, "dt": 20150627, "ord": 69, "blogsnip": "Om half 6 gaat de wekker, zodat we zonsopkomst kunnen zien. De lucht kleurt mooi rood. Daarna snel weer naar bed om verder te slapen. Als we opstaan kunnen we lekker buiten zitten en weer genieten van het geweldige uitzicht. Verder is er veel te zien op de camping; mensen …", "bloglink": "https://rondjewereld.nl/2015/06/27/five-islands/"}, {"titel": "Scotia Pine Campground, Hilden, NS, Canada", "omschrijving": "", "wanneer": "jun 28, 2015", "icon": "campground", "kmstand": 161733, "tripkm": 9239, "land": "Canada", "staat": "Nova Scotia", "lat": 45.248, "lng": -63.482, "dt": 20150628, "ord": 70, "blogsnip": "We zijn pas laat wakker en het is bewolkt, zoals voorspeld is. Maar het is wel droog, dus doen we voor vertrek nog een hike op de klippen van de Red Head Trail. Al snel komen we Daryl en Marie tegen, die waren er net iets vroeger bij. We kletsen …", "bloglink": "https://rondjewereld.nl/2015/06/28/that-damn-dutchman/"}, {"titel": "Shubie Campground, Dartmouth, NS, Canada", "omschrijving": "", "wanneer": "jun 29, 2015", "icon": "campground", "kmstand": 161875, "tripkm": 9381, "land": "Canada", "staat": "Nova Scotia", "lat": 44.7, "lng": -63.567, "dt": 20150629, "ord": 71, "blogsnip": "Na de regen van gisteravond miezert het vanochtend en op de camping staan plassen. Omdat we behoorlijk ver van het toilettegebouw staan, rijden we de bus dichterbij om te douchen en een bakkie te drinken. Daarna rijden we richting Maitland voor het Fundy Tidal Interpretation Center om nog wat te …", "bloglink": "https://rondjewereld.nl/2015/06/29/hello-halifax/"}, {"titel": "Lunenburg, NS, Canada", "omschrijving": "", "wanneer": "jul 4, 2015", "icon": "campground", "kmstand": 162081, "tripkm": 9587, "land": "Canada", "staat": "Nova Scotia", "lat": 44.376, "lng": -64.316, "dt": 20150704, "ord": 72, "blogsnip": "We slapen lekker uit en kunnen in de zon ontbijten. Vandaag gaan we niet zo veel doen, dus doen we rustig aan. We wandelen rond de camping, langs de rand van het eiland. Omdat de douches zo ver weg zijn verzetten we de bus. Pas na 12 uur zijn we …", "bloglink": "https://rondjewereld.nl/2015/07/04/lunenburg/"}, {"titel": "Glen Margaret, NS, Canada", "omschrijving": "", "wanneer": "jul 2, 2015", "icon": "campground", "kmstand": 161966, "tripkm": 9472, "land": "Canada", "staat": "Nova Scotia", "lat": 44.665, "lng": -63.89, "dt": 20150702, "ord": 73, "blogsnip": "Vanochtend is het weer droog, maar wel bewolkt. De was is nog niet echt droog geworden, dus die hangen we achterin de bus. Naast ons staat een Duits gezin. Omdat ze vandaag de camper inleveren komen ze ongebruikte spullen brengen, dus zitten we goed in de appelsap en plakken kaas …", "bloglink": "https://rondjewereld.nl/2015/07/02/peggy-s-cove/"}, {"titel": "Thomas Raddall Provincial Park, Port Joli, NS, Canada", "omschrijving": "", "wanneer": "jul 5, 2015", "icon": "campground", "kmstand": 162197, "tripkm": 9703, "land": "Canada", "staat": "Nova Scotia", "lat": 43.891, "lng": -65.192, "dt": 20150705, "ord": 74, "blogsnip": "Vannacht heeft het even geregend, maar vanochtend is het mooi weer. Na ontbijt en douchen gaan we boodschappen doen in de volgende grote plaats. We vinden een Walmart, maar kunnen niet alles van het lijstje halen; we zijn dol op Walmart, maar soms tref je er één zonder fresh food.", "bloglink": "https://rondjewereld.nl/2015/07/05/thomas-raddall-provincial-park/"}, {"titel": "Camper's Haven, Arcadia, NS, Canada", "omschrijving": "", "wanneer": "jul 6, 2015", "icon": "campground", "kmstand": 162358, "tripkm": 9864, "land": "Canada", "staat": "Nova Scotia", "lat": 43.983, "lng": -65.624, "dt": 20150706, "ord": 75, "blogsnip": "We konden niet zo goed slapen, het was behoorlijk warm, dus hebben we de wekker uitgezet. Al met al zijn we toch nog om 10 uur weg. Vandaag gaan we naar Kejimkujik National Park Seaside, ook wel Keji Adjunct genoemd, omdat het hoort bij het grote Kejimkujik National Park landinwaarts …", "bloglink": "https://rondjewereld.nl/2015/07/06/keji-adjunct/"}, {"titel": "Whale Cove, NS, Canada", "omschrijving": "", "wanneer": "jul 7, 2015", "icon": "campground", "kmstand": 162533, "tripkm": 10039, "land": "Canada", "staat": "Nova Scotia", "lat": 44.49, "lng": -65.836, "dt": 20150707, "ord": 76, "blogsnip": "Weer rond half 9 wakker en de zon schijnt al. We ontbijten buiten en gaan nog lekker lezen. Het is 11 uur geweest als we vertrekken. Eerst even tanken, daarna rijden we naar Cape Forchu. Hier is een bijzondere vuurtoren en een parkje. Mistbanken rollen over het water en het …", "bloglink": "https://rondjewereld.nl/2015/07/07/digby-neck/"}, {"titel": "Kejimkujic National Park, NS, Canada", "omschrijving": "", "wanneer": "jul 8, 2015", "icon": "campground", "kmstand": 162715, "tripkm": 10221, "land": "Canada", "staat": "Nova Scotia", "lat": 44.361, "lng": -65.232, "dt": 20150708, "ord": 77, "blogsnip": "We staan vroeg op, want we willen vroeg de ferry naar Long Island nemen voor de whale watch toer. Het is enorm mistig, dus we gaan ervan uit dat het niet door gaat. Toch maar naar de overkant, dan bekijken we daar eerst wat andere dingen. Om 9 uur staan …", "bloglink": "https://rondjewereld.nl/2015/07/08/scallops-no-whales/"}, {"titel": "Granville Ferry, NS, Canada", "omschrijving": "", "wanneer": "jul 9, 2015", "icon": "campground", "kmstand": 162777, "tripkm": 10283, "land": "Canada", "staat": "Nova Scotia", "lat": 44.715, "lng": -65.524, "dt": 20150709, "ord": 78, "blogsnip": "Vanmorgen is het meteen al lekker weer, we ontbijten buiten. Daarna rijden we naar het douchegebouw, een heel eind verderop. In de Lonely Planet staat dat je hier in de rij moet staan voor een douchehokje, maar dat is niet het geval. Het is helemaal niet druk op deze grote …", "bloglink": "https://rondjewereld.nl/2015/07/09/hiking-and-biking-in-keji/"}, {"titel": "Evangeline Beach Bayview Rd Grand Pré, NS B0P 1M0 Canada", "omschrijving": "", "wanneer": "jul 12, 2015", "icon": "campground", "kmstand": 163007, "tripkm": 10513, "land": "Canada", "staat": "Nova Scotia", "lat": 45.107, "lng": -64.288, "dt": 20150712, "ord": 79, "blogsnip": "We hoeven pas om 1 uur uit te checken, dus doen we na het ontbijt eerst een hike van 2 uur. Door de bossen met af en toe een lookoff over de zee. De overkant is nauwelijks te zien in de mist. Het is behoorlijk warm, de zomer is echt …", "bloglink": "https://rondjewereld.nl/2015/07/12/domaine-du-grand-pre/"}, {"titel": "Sunnyvale Campground, Victoria Vale, NS, Canada", "omschrijving": "", "wanneer": "jul 10, 2015", "icon": "campground", "kmstand": 162855, "tripkm": 10361, "land": "Canada", "staat": "Nova Scotia", "lat": 45.09, "lng": -64.55, "dt": 20150710, "ord": 80, "blogsnip": "Het is heerlijk weer als we opstaan. Geen haast, dus zijn we pas om half 11 weg. We bezoeken eerst de Annapolis Tidal Power Plant; 2x per dag wordt hier energie opgewekt voor 4.500 huizen met behulp van het verschil tussen eb en vloed. Interessant. Daarna doen we boodschappen bij …", "bloglink": "https://rondjewereld.nl/2015/07/10/from-fort-to-port/"}, {"titel": "Blomidon Provincial Park, Canning, NS, Canada", "omschrijving": "", "wanneer": "jul 11, 2015", "icon": "campground", "kmstand": 162965, "tripkm": 10471, "land": "Canada", "staat": "Nova Scotia", "lat": 45.125, "lng": -64.426, "dt": 20150711, "ord": 81, "blogsnip": "Lesley is jarig. We hebben de wekker gezet en douchen snel, zodat we voor 9 uur weg zijn. We rijden naar Kingston, 25 minuten verderop en ontbijten bij Tim Hortons. De koffie gaat mee de bus in, op de parkeerplaats skypen we met de ouders; visite in de ochtend. Daarna …", "bloglink": "https://rondjewereld.nl/2015/07/11/birthday-parade-and-lobster/"}, {"titel": "Woodhaven, Hammonds Plains, NS, Canada", "omschrijving": "", "wanneer": "jul 13, 2015", "icon": "campground", "kmstand": 163086, "tripkm": 10592, "land": "Canada", "staat": "Nova Scotia", "lat": 44.738, "lng": -63.76, "dt": 20150713, "ord": 82, "blogsnip": "Het is weer prachtig weer. ‘s Morgens aan de picknicktafel pakken we de kaart er even bij; route uitstippelen voor de komende dagen. Om 11 uur rijden we weg om een paar kilometer verderop Grand Pré Historic Site te bezoeken. Dit staat in het teken van de Acadiens, van Franse …", "bloglink": "https://rondjewereld.nl/2015/07/13/evangeline/"}, {"titel": "St Mary River Campground, Sherbrooke, NS, Canada", "omschrijving": "", "wanneer": "jul 14, 2015", "icon": "campground", "kmstand": 163317, "tripkm": 10823, "land": "Canada", "staat": "Nova Scotia", "lat": 45.139, "lng": -61.984, "dt": 20150714, "ord": 83, "blogsnip": "We zijn nog voor de wekker wakker en om 7 uur rijden we weg. We zitten een klein half uur van de Mercedes dealer in Halifax. Onderweg is het aardig mistig, maar van een file is niet echt sprake. Bij de garage staat al een rij met klanten, die snel …", "bloglink": "https://rondjewereld.nl/2015/07/14/eastern-shore/"}, {"titel": "RV Park and Marina, Canso, NS, Canada", "omschrijving": "", "wanneer": "jul 15, 2015", "icon": "campground", "kmstand": 163452, "tripkm": 10958, "land": "Canada", "staat": "Nova Scotia", "lat": 45.338, "lng": -61.013, "dt": 20150715, "ord": 84, "blogsnip": "We slapen lekker uit. Na het ontbijt komen Jim en Betty afscheid nemen. Weer een adres erbij en wij geven ons URL. Betty haalt ook nog even wat maple-candy voor ons, een soort fondant gemaakt van sap van de maple tree, de nationale boom van Canada. Wij geven ons eerste …", "bloglink": "https://rondjewereld.nl/2015/07/15/langs-de-kust-naar-canso/"}, {"titel": "St Peter's, NS, Canada", "omschrijving": "", "wanneer": "jul 16, 2015", "icon": "campground", "kmstand": 163611, "tripkm": 11117, "land": "Canada", "staat": "Nova Scotia", "lat": 45.653, "lng": -60.88, "dt": 20150716, "ord": 85, "blogsnip": "Als we vanmorgen wakker worden, zien we dat aan de overkant een eiland ligt. Gisteren was dat niet te zien door de mist, nu is het helder. We laten de bus staan en lopen na het ontbijt naar Grassy Islands Historic Site. Binnen kijken we een korte film. Zodra een …", "bloglink": "https://rondjewereld.nl/2015/07/16/grassy-islands/"}, {"titel": "Port Hood, NS, Canada", "omschrijving": "", "wanneer": "jul 17, 2015", "icon": "campground", "kmstand": 163775, "tripkm": 11281, "land": "Canada", "staat": "Nova Scotia", "lat": 46.02, "lng": -61.521, "dt": 20150717, "ord": 86, "blogsnip": "’s Morgens doen we eerst een korte hike in het Provincial Park. Na de koffie pakken we in en kijken we even bij St. Peter’s Canal, een kanaal dat de oceaan met een grote binnenzee verbindt. De medewerker van Parks Canada vertelt er graag over. Na internetten bij het visitor …", "bloglink": "https://rondjewereld.nl/2015/07/17/ceilidh/"}, {"titel": "Hidden Hideaway, Dingwall, NS, Canada", "omschrijving": "", "wanneer": "jul 19, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Nova Scotia", "lat": 46.636, "lng": -60.473, "dt": 20150719, "ord": 87, "blogsnip": "Om half 7 gaat de wekker, maar omdat het regent draaien we ons nog een keer om. Anderhalf uur later is het wel droog. Rond 10 uur rijden we weg. Nog even proberen we te internetten bij het visitor center, maar dat lukt niet. Dus gaan we de Cabot Trail …", "bloglink": "https://rondjewereld.nl/2015/07/19/cape-breton-highlands/"}, {"titel": "Cheticamp, NS, Canada", "omschrijving": "", "wanneer": "jul 18, 2015", "icon": "campground", "kmstand": 163879, "tripkm": 11385, "land": "Canada", "staat": "Nova Scotia", "lat": 46.619, "lng": -60.996, "dt": 20150718, "ord": 88, "blogsnip": "Vanmorgen hebben we allebei een beetje een houten kop. Niks gewend blijkbaar. John komt vragen of we koffie komen drinken. Alison en John gaan nog naar Amerika, naar de staten waar wij net geweest zijn. Dus geven wij ze tips. Nadat zij zijn ingepakt komen ze afscheid nemen.", "bloglink": "https://rondjewereld.nl/2015/07/18/cheticamp/"}, {"titel": "Baddeck Cabot Trail Campground, Baddeck, NS, Canada", "omschrijving": "", "wanneer": "jul 20, 2015", "icon": "campground", "kmstand": 164113, "tripkm": 11619, "land": "Canada", "staat": "Nova Scotia", "lat": 46.1, "lng": -60.746, "dt": 20150720, "ord": 89, "blogsnip": "Vanmorgen worden we wakker in de mist en regen. Het lijkt de hele dag zo te blijven. Gisteravond hebben we de ferry naar Newfoundland geboekt voor vrijdag. Na een blik op de weersvoorspelling voor de komende dagen besluiten we deze te vervroegen naar woensdag. Met een telefoontje zo geregeld.", "bloglink": "https://rondjewereld.nl/2015/07/20/alexander-graham-bell/"}, {"titel": "Mira River Provincial Park, Albert Bridge, NS, Canada", "omschrijving": "", "wanneer": "jul 21, 2015", "icon": "campground", "kmstand": 164274, "tripkm": 11780, "land": "Canada", "staat": "Nova Scotia", "lat": 46.148, "lng": -60.064, "dt": 20150721, "ord": 90, "blogsnip": "Zoals voorspeld is het flink bewolkt. Om 10 uur rijden we weg van de camping, naar Louisbourg via de scenic route langs de binnenzee en met een kleine ferry. Door een onverharde weg te nemen snijden we een stuk af. Leuk om op de kaart te navigeren. Met iets meer …", "bloglink": "https://rondjewereld.nl/2015/07/21/fortress-of-louisbourg/"}, {"titel": "Ferry Terminal, North Sydney, NS, Canada", "omschrijving": "", "wanneer": "jul 22, 2015", "icon": "sea_ports", "kmstand": 164366, "tripkm": 11872, "land": "Canada", "staat": "Nova Scotia", "lat": 46.216, "lng": -60.248, "dt": 20150722, "ord": 91, "blogsnip": "Veel te doen vandaag, dus de wekker gaat om 7 uur. Om te douchen verzetten we de bus weer, want het is veel te ver lopen. Om 9 uur zijn we op weg naar Glace Bay. Hier gaan we naar het Miners’ Museum. Om 10 uur gaat het open en …", "bloglink": "https://rondjewereld.nl/2015/07/22/ferry-to-newfoundland/"}, {"titel": "Argentia, NL, Canada", "omschrijving": "", "wanneer": "jul 23, 2015", "icon": "sea_ports", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Newfoundland", "lat": 47.303, "lng": -53.977, "dt": 20150723, "ord": 92, "blogsnip": "Best aardig geslapen in de recliner-seats, beter dan in een vliegtuig. Rond half acht zijn we wakker, omdat andere gasten beginnen te praten. Eenmaal op halen we koffie en cornflakes. Terwijl wij ontbijten speelt de artiest van gisteravond alweer gitaar. We lopen nog wat rond op de boot, nu het …", "bloglink": "https://rondjewereld.nl/2015/07/23/castles-and-gannets/"}, {"titel": "Irish Loop Resort Campground, 567 Salmonier Line, Holyrood, NL, Canada", "omschrijving": "", "wanneer": "jul 23, 2015", "icon": "campground", "kmstand": 164556, "tripkm": 12062, "land": "Canada", "staat": "Newfoundland", "lat": 47.378, "lng": -53.218, "dt": 20150723, "ord": 93, "blogsnip": "Best aardig geslapen in de recliner-seats, beter dan in een vliegtuig. Rond half acht zijn we wakker, omdat andere gasten beginnen te praten. Eenmaal op halen we koffie en cornflakes. Terwijl wij ontbijten speelt de artiest van gisteravond alweer gitaar. We lopen nog wat rond op de boot, nu het …", "bloglink": "https://rondjewereld.nl/2015/07/23/castles-and-gannets/"}, {"titel": "La Manche Provincial Park, La Manche, NL, Canada", "omschrijving": "", "wanneer": "jul 24, 2015", "icon": "campground", "kmstand": 164763, "tripkm": 12269, "land": "Canada", "staat": "Newfoundland", "lat": 47.049, "lng": -53.166, "dt": 20150724, "ord": 94, "blogsnip": "De wekker gaat om 7 uur, want we willen vandaag een heel stuk rijden. Toch treuzelen we behoorlijk; het is koud, dus komen we moeilijk op gang. Gelukkig is het droog. In een plaats verderop tanken we, waarna we de Irish Loop Scenic Drive rijden. Aan deze route liggen plaatsjes …", "bloglink": "https://rondjewereld.nl/2015/07/24/whales-from-the-beach/"}, {"titel": "Pippy Park Campground, St. John's, NL, Canada", "omschrijving": "", "wanneer": "jul 25, 2015", "icon": "campground", "kmstand": 164855, "tripkm": 12361, "land": "Canada", "staat": "Newfoundland", "lat": 47.565, "lng": -52.706, "dt": 20150725, "ord": 95, "blogsnip": "Na het ontbijt gaan we hiken in het provincial park. Via een trail kun je naar La Manche, een vissersdorpje dat verwoest is tijdens een storm in 1966. Alleen wat fundamenten van de huizen staan er nog. Inmiddels is er wel een nieuwe hangbrug voor de East Coast hikers. Mooie …", "bloglink": "https://rondjewereld.nl/2015/07/25/cape-spear/"}, {"titel": "Roache's Line RV Park, Newfoundland and Labrador 70, Makinsons, Newfoundland en Labrador, Canada", "omschrijving": "", "wanneer": "jul 27, 2015", "icon": "campground", "kmstand": 164970, "tripkm": 12476, "land": "Canada", "staat": "Newfoundland", "lat": 47.487, "lng": -53.395, "dt": 20150727, "ord": 96, "blogsnip": "Als we opstaan merken we meteen dat het een paar graden warmer is, ook al is het nog wel bewolkt. Zodra de bus is ingepakt gaan we eerst even boodschappen doen voor de komende dagen. Daarna rijden we naar Signal Hill, een heuvel aan zee waar de afgelopen 400 jaar …", "bloglink": "https://rondjewereld.nl/2015/07/27/signal-hill/"}, {"titel": "Charleston, NL, Canada", "omschrijving": "", "wanneer": "jul 28, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Newfoundland", "lat": 49.097, "lng": -55.566, "dt": 20150728, "ord": 97, "blogsnip": "’s Morgens is een graafmachine al aan de gang op de bouwplaats naast onze site, maar er wordt geen lawaai gemaakt. Rond 10 uur zijn we weg richting Brigus. Dit is een vissersdorpje waar een bekende Canadese poolreiziger woonde. Zijn ouderlijk huis bezoeken we. Eerst uitleg van de plaatselijke werkstudent …", "bloglink": "https://rondjewereld.nl/2015/07/28/brigus-to-trinity-bay/"}, {"titel": "Lockston Path Provincial Park, NL, Canada", "omschrijving": "", "wanneer": "jul 29, 2015", "icon": "campground", "kmstand": 165410, "tripkm": 12916, "land": "Canada", "staat": "Newfoundland", "lat": 48.614, "lng": -53.581, "dt": 20150729, "ord": 98, "blogsnip": "Om 10 uur zijn we weg bij de camping, onderweg naar Bonavista. De weg kronkelt langs de kust, dus er is lekker veel te zien. Bonavista is een mooi plaatsje, voor hier redelijk groot met 3.600 inwoners. We bekijken eerst de Ryan Premises National Historical Site. Het is een mooi …", "bloglink": "https://rondjewereld.nl/2015/07/29/puffins-and-whales/"}, {"titel": "Terra Nova, NL, Canada", "omschrijving": "", "wanneer": "jul 30, 2015", "icon": "campground", "kmstand": 165543, "tripkm": 13049, "land": "Canada", "staat": "Newfoundland", "lat": 48.551, "lng": -54.042, "dt": 20150730, "ord": 99, "blogsnip": "Het regent als we wakker worden; de voorspelling is de hele dag regen. Maar we klagen niet, na zo’n topdag gisteren. We doen rustig aan, rijden eerst naar het douchegebouw en daarna naar een punt met internetontvangst. We zetten koffie en houden een skype-marathon met Nederland.", "bloglink": "https://rondjewereld.nl/2015/07/30/terra-nova/"}, {"titel": "Dildo Run Provincial Park, NL, Canada", "omschrijving": "", "wanneer": "jul 31, 2015", "icon": "campground", "kmstand": 165727, "tripkm": 13233, "land": "Canada", "staat": "Newfoundland", "lat": 49.469, "lng": -55.793, "dt": 20150731, "ord": 100, "blogsnip": "We hadden we de wekker gezet, maar blijven nog een uurtje liggen. Het is bewolkt en miezert buiten. Eenmaal ingepakt rijden we even langs het visitor center van Terra Nova NP. Hier is een touch tank; een grote waterbak met aaibare zeedieren. Altijd leuk. Een klein stukje verderop parkeren we …", "bloglink": "https://rondjewereld.nl/2015/07/31/new-world-island/"}, {"titel": "Lomond River RV Park, Lomond, NL, Canada", "omschrijving": "", "wanneer": "aug 1, 2015", "icon": "campground", "kmstand": 166180, "tripkm": 13686, "land": "Canada", "staat": "Newfoundland", "lat": 49.494, "lng": -57.626, "dt": 20150801, "ord": 101, "blogsnip": "Zelfde recept als gisteren, het regent ’s morgens, dus slapen we uit. Nog even kletsen met Bertrand uit Montreal en dan gaan we rond 11 uur weg. Nu is het bewolkt, maar droog. We rijden via Twillingate naar Crow Head. Hier is een vuurtoren en een uitkijkpunt. Opeens komt er …", "bloglink": "https://rondjewereld.nl/2015/08/01/go-west/"}, {"titel": "Trout River, NL, Canada", "omschrijving": "", "wanneer": "aug 2, 2015", "icon": "campground", "kmstand": 166246, "tripkm": 13752, "land": "Canada", "staat": "Newfoundland", "lat": 49.48, "lng": -58.127, "dt": 20150802, "ord": 102, "blogsnip": "Hoera, als we wakker worden schijnt de zon. Voor het eerst sinds tijden ontbijten we weer buiten. Nadat we betaald hebben voor de camping, rijden we om 10 uur weg. We gaan eerst naar het Discovery Center van Gros Morne National Park. De weg er naar toe is spectaculair; fjorden …", "bloglink": "https://rondjewereld.nl/2015/08/02/gros-morne-lookout-trail/"}, {"titel": "Berry Hill, Rocky Harbour, NL, Canada", "omschrijving": "", "wanneer": "aug 3, 2015", "icon": "campground", "kmstand": 166344, "tripkm": 13850, "land": "Canada", "staat": "Newfoundland", "lat": 49.582, "lng": -57.857, "dt": 20150803, "ord": 103, "blogsnip": "Het eerste dat we doen als we wakker worden is de lekbak onder de dieseltank checken. Helaas is de kauwgom met duct-tape pleister geen permanente oplossing, want er staat een behoorlijke plas diesel in. Dus schieten we een beetje op, onbijten we snel in de zon en vertrekken nog voor …", "bloglink": "https://rondjewereld.nl/2015/08/03/gros-morne-tablelands-berry-hill/"}, {"titel": "Cow Head, NL, Canada", "omschrijving": "", "wanneer": "aug 4, 2015", "icon": "campground", "kmstand": 166412, "tripkm": 13918, "land": "Canada", "staat": "Newfoundland", "lat": 51.133, "lng": -56.883, "dt": 20150804, "ord": 104, "blogsnip": "‘s Morgens checken we als eerste onze reparatie aan de dieseltank; helemaal droog. Het is al heerlijk weer, dus gaan we vroeg op pad. In Rocky Harbour eerst maar even vol tanken, om te kijken of onze reparatie het dan ook houdt. Daarna zoeken we het motel waar je kaartjes …", "bloglink": "https://rondjewereld.nl/2015/08/04/gros-morne-western-brook-pond/"}, {"titel": "Pistolet Bay Provincial Park, Raleigh, NL, Canada", "omschrijving": "", "wanneer": "aug 5, 2015", "icon": "campground", "kmstand": 166761, "tripkm": 14267, "land": "Canada", "staat": "Newfoundland", "lat": 51.606, "lng": -55.844, "dt": 20150805, "ord": 105, "blogsnip": "’s Morgens regent het nog even, maar het klaart al snel op. We doen rustig aan en internetten nog wat. Om 11 uur vertrekken we naar het noorden. De weg is weer prachtig langs de kust. Bij Arches Provincial Park bekijken we de natuurlijke bogen pal voor de kust. Verderop …", "bloglink": "https://rondjewereld.nl/2015/08/05/go-north/"}, {"titel": "St Barbe, NL, Canada", "omschrijving": "", "wanneer": "aug 7, 2015", "icon": "campground", "kmstand": 167014, "tripkm": 14520, "land": "Canada", "staat": "Newfoundland", "lat": 51.21, "lng": -56.928, "dt": 20150807, "ord": 106, "blogsnip": "Vandaag staat in het teken van het fixen van de dieseltank. We hebben de wekker gezet, zodat we vroeg weg kunnen. Om 9 uur zijn we bij de garage. De monteur hoort het aan, maar we moeten even op de baas wachten. Het gezicht van de baas staat al op …", "bloglink": "https://rondjewereld.nl/2015/08/07/wachten-op-de-dieseltank-fix/"}, {"titel": "Triple Falls Trailer Park, Saint Anthony, NL, Canada", "omschrijving": "", "wanneer": "aug 6, 2015", "icon": "campground", "kmstand": 166871, "tripkm": 14377, "land": "Canada", "staat": "Newfoundland", "lat": 51.378, "lng": -55.6, "dt": 20150806, "ord": 107, "blogsnip": "Pas om kwart over 9 zijn we wakker. Lang geslapen, maar wel ’s nachts een paar keer op muggenjacht. Net als gisteren zijn we ook vandaag laat weg. We doen nog een poging om te internetten, maar dat is hier erg traag. Dus rijden we naar L’Anse aux Meadows. Weer …", "bloglink": "https://rondjewereld.nl/2015/08/06/vikings/"}, {"titel": "Pinware River Provincial Park, Pinware, Newfoundland en Labrador, Canada", "omschrijving": "", "wanneer": "aug 8, 2015", "icon": "campground", "kmstand": 167082, "tripkm": 14588, "land": "Canada", "staat": "Newfoundland", "lat": 51.63, "lng": -56.787, "dt": 20150808, "ord": 108, "blogsnip": "Om 6 uur gaat de wekker. Niet zo heel veel geslapen, want we liggen toch te wachten tot de wekker gaat. Gerhard loopt meteen naar de ferry terminal tegenover de camping om de kaartjes te kopen. We hebben wel gereserveerd, maar betalen kan pas vlak voordat de ferry gaat. We …", "bloglink": "https://rondjewereld.nl/2015/08/08/the-big-land/"}, {"titel": "Cartwright, NL, Canada", "omschrijving": "", "wanneer": "aug 10, 2015", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Newfoundland", "lat": 53.708, "lng": -57.017, "dt": 20150810, "ord": 109, "blogsnip": "Momenteel rijden we de Labrador Highway; 1.728 kilometer van L’Anse au Claire naar Baie Comeau, waarvan ruim 700 kilometer gravel road. Er zijn maar weinig plaatsjes en vermoedelijk nauwelijks wifi. Zodra we weer bereik hebben posten we onze avonturen.", "bloglink": "https://rondjewereld.nl/2015/08/10/driving-the-labrador-highway/"}, {"titel": "Aan Route 510 in the Wild", "omschrijving": "", "wanneer": "aug 9, 2015", "icon": "campground", "kmstand": 167305, "tripkm": 14811, "land": "Canada", "staat": "Newfoundland", "lat": 52.781672, "lng": -56.915882, "dt": 20150809, "ord": 110, "blogsnip": "We zijn vroeg op en het is weer heerlijk weer; nog een dagje zomer in Labrador. Bij controle van de dieseltank is er toch weer een lek. Het lijkt te komen van de aftapplug; die is er bij de garage af geweest en sluit niet zo goed aan. Helaas hebben …", "bloglink": "https://rondjewereld.nl/2015/08/09/start-labrador-highway/"}, {"titel": "Corner Brook, NL, Canada", "omschrijving": "", "wanneer": "aug 12, 2015", "icon": "campground", "kmstand": 168238, "tripkm": 15744, "land": "Canada", "staat": "Newfoundland", "lat": 48.95, "lng": -57.944, "dt": 20150812, "ord": 111, "blogsnip": "We zijn om kwart voor 5 wakker; blijkbaar toch bezig met de dieseltank. In het lekbakje zit ook weer een aardige laag diesel. Er gaat ook een ferry om 8 uur, maar daar konden we online niet meer voor reserveren. We gokken het er op en gaan kwart over 5 …", "bloglink": "https://rondjewereld.nl/2015/08/12/back-to-the-rock/"}, {"titel": "Pinware Provincial Park, Pinware, NL, Canada", "omschrijving": "", "wanneer": "aug 11, 2015", "icon": "campground", "kmstand": 167830, "tripkm": 15336, "land": "Canada", "staat": "Newfoundland", "lat": 51.63, "lng": -56.787, "dt": 20150811, "ord": 112, "blogsnip": "Om 7 uur gaat de wekker. We hebben lang geslapen, moe van de dag ervoor. In de keuken van het motel kun je zelf ontbijt klaarmaken. We eten wat en stappen om kwart over 8 op de fiets, op naar Doug. We zien ‘m al zitten voor z’n tankstation. Eenmaal …", "bloglink": "https://rondjewereld.nl/2015/08/11/we-might-as-well-get-back/"}, {"titel": "Blow me down Provincial Park, Lark Harbour, NL, Canada", "omschrijving": "", "wanneer": "aug 13, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Newfoundland", "lat": 49.063, "lng": -58.527, "dt": 20150813, "ord": 113, "blogsnip": "Vanmorgen regent het een beetje. Er staat weer diesel in het bakje. We zijn inmiddels aardig handig in het vervangen van dieselpleisters. Al vroeg gaan we op zoek naar een garage. Gisteren hebben we, vlak voordat ons internet uitviel, een aantal adressen van garages opgezocht.", "bloglink": "https://rondjewereld.nl/2015/08/13/renting/"}, {"titel": "3 nachten Berry Hill, Rocky Harbour, NL, Canada", "omschrijving": "", "wanneer": "aug 15, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Newfoundland", "lat": 49.582, "lng": -57.857, "dt": 20150815, "ord": 114, "blogsnip": "Nu prima geslapen en lekker lang. Anders dan voorspeld is het erg bewolkt ‘s morgens en gaat het zelfs een beetje regenen. Dus blijven we lekker in de tent liggen lezen; we hebben allebei een spannend boek, dus dat is geen straf. Later in de ochtend is het droog, dus …", "bloglink": "https://rondjewereld.nl/2015/08/15/lui/"}, {"titel": "Barachois Pond Provincial Park, NL, Canada", "omschrijving": "", "wanneer": "aug 17, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Newfoundland", "lat": 48.183, "lng": -58.867, "dt": 20150817, "ord": 115, "blogsnip": "Na de regen van gisteren is het ’s morgens prachtig weer. We zitten lekker buiten te lezen en pakken langzaam in. Als de tent droog is, breken we ‘m weer af. Laat in de ochtend zijn we bij Berry Head Pond, waar we een korte hike rond een meertje doen …", "bloglink": "https://rondjewereld.nl/2015/08/17/barachois-pond-provincial-park/"}, {"titel": "Channel - Port aux Basques, NL, Canada", "omschrijving": "", "wanneer": "aug 21, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Canada", "staat": "Newfoundland", "lat": 47.577, "lng": -59.148, "dt": 20150821, "ord": 116, "blogsnip": "De wekker gaat om half 7, zodat we vroeg op pad zijn, op weg naar de ferry Port-aux-Basques. De bus start en rijdt prima. Net als we voorbij de laatste plaats komen en Lesley nog zegt dat de komende 60 km er niks is, hebben we hetzelfde probleem als gisteren …", "bloglink": "https://rondjewereld.nl/2015/08/21/naar-port-aux-basques-gesleept/"}, {"titel": "Barachois Pond Provincial Park, NL, Canada", "omschrijving": "", "wanneer": "aug 20, 2015", "icon": "campground", "kmstand": 168427, "tripkm": 15933, "land": "Canada", "staat": "Newfoundland", "lat": 48.183, "lng": -58.867, "dt": 20150820, "ord": 117, "blogsnip": "Vandaag staat natuurlijk in het teken van de dieseltank. Dus ontbijten en douchen we, waarna we om half 10 bellen. Ja hoor, de dieseltank is gearriveerd. We spreken af dat we om 1 uur weer bellen, of ze bellen ons eerder. Voor de verandering maar even internet en koffie bij …", "bloglink": "https://rondjewereld.nl/2015/08/20/move-that-bus/"}, {"titel": "Arm of Gold Campground, Little Bras D'or, Nova Scotia, Canada", "omschrijving": "", "wanneer": "aug 24, 2015", "icon": "campground", "kmstand": 168612, "tripkm": 16118, "land": "Canada", "staat": "Nova Scotia", "lat": 46.265, "lng": -60.53, "dt": 20150824, "ord": 118, "blogsnip": "Om kwart voor 8 is Shayne er al. Lesley gaat met de fiets weer koffie halen. Shayne en Gerhard doen de laatste aanpassingen en controles en gieten de diesel terug in de tank. Tijd voor een testrit. Met z’n drieën op pad, Shayne achter het stuur. Hij test de bus …", "bloglink": "https://rondjewereld.nl/2015/08/24/we-have-lift-off/"}, {"titel": "Parlee Beach Provincial Park, NB, Canada", "omschrijving": "", "wanneer": "aug 25, 2015", "icon": "campground", "kmstand": 169098, "tripkm": 16604, "land": "Canada", "staat": "Nova Scotia", "lat": 46.233, "lng": -64.522, "dt": 20150825, "ord": 119, "blogsnip": "Heerlijk lang geslapen, langzaam komen we weer in het oude ritme. Het regent ’s morgens, maar dat maakt niet zo veel uit, want we gaan een flink stuk rijden. Nova Scotia hebben we al goed gezien, dus we willen daar snel doorheen. Op de camping vullen we eerst de watertank.", "bloglink": "https://rondjewereld.nl/2015/08/25/on-the-road-again/"}, {"titel": "Sugarloaf Provincial Park, Campbellton, NB, Canada", "omschrijving": "", "wanneer": "aug 26, 2015", "icon": "campground", "kmstand": 169431, "tripkm": 16937, "land": "Canada", "staat": "New Brunswick", "lat": 47.997, "lng": -66.681, "dt": 20150826, "ord": 120, "blogsnip": "We rommelen lekker rond de bus tot 11 uur. Het is warm, maar bewolkt. Vandaag rijden we naar het noorden. Onderweg stoppen we bij Bouctouche om over de boardwalk over een duin te lopen. Wij zouden het eerder een zandbank noemen dan een duin. Even lekker de benen strekken onder …", "bloglink": "https://rondjewereld.nl/2015/08/26/sugarloaf-provincial-park/"}, {"titel": "Cime Aventures, Bonaventure, QC, Canada", "omschrijving": "", "wanneer": "aug 27, 2015", "icon": "campground", "kmstand": 169583, "tripkm": 17089, "land": "Canada", "staat": "New Brunswick", "lat": 48.029, "lng": -65.484, "dt": 20150827, "ord": 121, "blogsnip": "Het heeft de hele nacht goed geregend en ‘s morgens regent het nog steeds. Om een uur of 10 klaart het wel op, maar hiken in de blubber lijkt ons niks. Dus gaan we naar Tim Hortons in Campbellton, even de administratie omtrent de bus op orde brengen. Naast ons …", "bloglink": "https://rondjewereld.nl/2015/08/27/bonjour-quebec/"}, {"titel": "Petit-Gaspé Campground, La Côte-de-Gaspé, Québec, Canada", "omschrijving": "", "wanneer": "aug 28, 2015", "icon": "campground", "kmstand": 169831, "tripkm": 17337, "land": "Canada", "staat": "Quebec", "lat": 48.754, "lng": -64.46, "dt": 20150828, "ord": 122, "blogsnip": "Het is stralend weer als we opstaan. Voordat we weg gaan drinken we nog even koffie op het terras van het restaurant bij de camping, met uitzicht op de rivier. Daarna weer de weg op; een provinciale weg met om de paar kilometer een plaatsje. Daardoor is er veel te …", "bloglink": "https://rondjewereld.nl/2015/08/28/rocher-perce/"}, {"titel": "Parc National de la Gaspésie Gîte du Mont-Albert, Cap-au-Renard, Québec, Canada", "omschrijving": "", "wanneer": "aug 30, 2015", "icon": "campground", "kmstand": 170105, "tripkm": 17611, "land": "Canada", "staat": "Quebec", "lat": 48.896, "lng": -66.11, "dt": 20150830, "ord": 123, "blogsnip": "Zodra we zijn ingepakt rijden we naar het noordelijke deel van Forillon National Park. We doen een korte hike naar een waterval om de benen even te strekken. Vandaag gaan we vooral veel rijden, langs de noordkust van het schiereiland naar het westen. Het is wisselvallig weer, spetters, regen, wolken …", "bloglink": "https://rondjewereld.nl/2015/08/30/parc-de-la-gaspesie/"}, {"titel": "Parc National du Bic, route 132 Ouest, Rimouski, QC, Canada", "omschrijving": "", "wanneer": "aug 31, 2015", "icon": "campground", "kmstand": 170358, "tripkm": 17864, "land": "Canada", "staat": "Quebec", "lat": 48.326, "lng": -68.85, "dt": 20150831, "ord": 124, "blogsnip": "Vandaag willen we gaan hiken in de bergen. Als we opstaan is het nog droog, maar de wolken zijn dreigend. Bij het visitor center gaan we eerst maar even internetten en koffie drinken. Er vallen al wat spetters, dus bestuderen we de weersverwachting. Om half 11 lijkt het droog te …", "bloglink": "https://rondjewereld.nl/2015/08/31/parc-du-bic-2/"}, {"titel": "Trois-Pistoles, Québec, Canada", "omschrijving": "", "wanneer": "sep 1, 2015", "icon": "campground", "kmstand": 170412, "tripkm": 17918, "land": "Canada", "staat": "Quebec", "lat": 48.121, "lng": -69.177, "dt": 20150901, "ord": 125, "blogsnip": "Yeah, het is helder weer. Wel fris, maar dat maakt niet uit. De eerste hike van vandaag is naar het toiletgebouw; om te douchen gaan we met de bus. Al vroeg gaan we op pad, na een bakkie koffie in de bus bij het visitor center. Eerst even kijken of …", "bloglink": "https://rondjewereld.nl/2015/09/01/hiking-in-parc-du-bic/"}, {"titel": "Le Paradis-Marin, QC G0T Canada", "omschrijving": "", "wanneer": "sep 2, 2015", "icon": "campground", "kmstand": 170439, "tripkm": 17945, "land": "Canada", "staat": "Quebec", "lat": 47.796, "lng": -69.795, "dt": 20150902, "ord": 126, "blogsnip": "Om kwart over 6 gaat de wekker. We hadden gisteren alles al ingepakt en klaargelegd, dus zijn we zo weg. Het is maar een paar minuten rijden naar de ferry, waar we ons als eerste opstellen in de rij. De boot wordt klaargemaakt en dezelfde man die we gisteren spraken …", "bloglink": "https://rondjewereld.nl/2015/09/02/paradis-marin/"}, {"titel": "Centre de plein air de Beauport, 95 Rue de la Sérénité, Quebec City, Québec, Canada", "omschrijving": "", "wanneer": "sep 5, 2015", "icon": "campground", "kmstand": 170791, "tripkm": 18297, "land": "Canada", "staat": "Quebec", "lat": 46.868, "lng": -71.25, "dt": 20150905, "ord": 127, "blogsnip": "De douches zijn ver weg, het zijn er weinig em je krijgt maar 3 minuten water voor 50 cent; we besluiten maar op de volgende camping te douchen. Dat betekent dat we lekker vroeg weg zijn. In St Anne de Beaupré stoppen we voor koffie en skypen bij McDonalds. Ook …", "bloglink": "https://rondjewereld.nl/2015/09/05/chute-montmorency/"}, {"titel": "Saguenay River, La Baie, Québec, Canada", "omschrijving": "", "wanneer": "sep 3, 2015", "icon": "campground", "kmstand": 170516, "tripkm": 18022, "land": "Canada", "staat": "Quebec", "lat": 48.332, "lng": -70.875, "dt": 20150903, "ord": 128, "blogsnip": "Voor de wekker zijn we wakker; speciaal vroeg opgestaan want we gaan vandaag kajakken op zee. Het is prachtig helder weer, dus perfect getimed. Er zijn om 7 uur al best wat mensen op, die op de rotsen over de zee tu real/"}, {"titel": "Rideau Heights Campsite, 38 Rideau Heights Dr, Nepean, Ontario, Canada", "omschrijving": "", "wanneer": "sep 9, 2015", "icon": "campground", "kmstand": 171408, "tripkm": 18914, "land": "Canada", "staat": "Ontario", "lat": 45.378, "lng": -75.784, "dt": 20150909, "ord": 132, "blogsnip": "We slapen lekker uit en besluiten een dagje niets bijzonders te doen. De volgende bestemming is Ottawa en we willen niet elke dag in een stad zijn. Dus hangen we nog lang rond op de camping en doen klusjes. Gerhard onderwerpt de fietsen aan een onderhoudsbeurt, Lesley is aan het …", "bloglink": "https://rondjewereld.nl/2015/09/09/to-ottowa/"}, {"titel": "Ivy Lea Campground, Lansdowne, Ontario, Canada", "omschrijving": "", "wanneer": "sep 11, 2015", "icon": "campground", "kmstand": 171610, "tripkm": 19116, "land": "USA", "staat": "New York", "lat": 44.363, "lng": -76.059, "dt": 20150911, "ord": 133, "blogsnip": "Prima geslapen na die alcohol-loze dag van gisteren. We ontbijten buiten en doen rustig aan. Birger en Christiane komen afscheid nemen; we willen contact houden en hopen elkaar weer tegen te komen. Zodra wij zijn ingepakt gaan wij afscheid nemen van Michele en Gilbert. Lloyd staat daarnaast met zijn camper …", "bloglink": "https://rondjewereld.nl/2015/09/11/cold-war/"}, {"titel": "Odessa, Reststop", "omschrijving": "", "wanneer": "sep 12, 2015", "icon": "campground", "kmstand": 171690, "tripkm": 19196, "land": "USA", "staat": "New York", "lat": 44.283361, "lng": -76.657285, "dt": 20150912, "ord": 134, "blogsnip": "Het weerbericht klopt; het regent behoorlijk als we wakker worden. Dus slapen we uit, lezen we nog wat en zijn we pas om half 12 op weg. We rijden naar Kingston, een behoorlijke plaats even verderop. Bij Pan Chancho gaan we lunchen. Het is een drukke bakkerij/delicatessenwinkel met restaurant.", "bloglink": "https://rondjewereld.nl/2015/09/12/rainy-day-in-kingston/"}, {"titel": "Sandbanks Provincial Park, Ontario", "omschrijving": "", "wanneer": "sep 13, 2015", "icon": "campground", "kmstand": 171828, "tripkm": 19334, "land": "USA", "staat": "New York", "lat": 43.917, "lng": -77.25, "dt": 20150913, "ord": 135, "blogsnip": "Zo’n truckers-stop doet niet onder voor een camping; prima geslapen. Vanmorgen regent het nog licht, dus relaxen we in de bus met klassiek muziekje aan, echt zondagochtend. We rijden terug naar Kingston en kijken even bij Fort Henry. Het fort ligt op een mooi punt en het is net even …", "bloglink": "https://rondjewereld.nl/2015/09/13/bellevue-house/"}, {"titel": "Beavermead Campground, Peterborough, Ontario, Canada", "omschrijving": "", "wanneer": "sep 14, 2015", "icon": "campground", "kmstand": 171984, "tripkm": 19490, "land": "USA", "staat": "New York", "lat": 44.298, "lng": -78.341, "dt": 20150914, "ord": 136, "blogsnip": "Het is prachtig weer als we opstaan, maar de wind waait nog hard. Dus ontbijten we binnen. Voordat we vertrekken lopen we eerst langs het strand van Lake Ontario. Er zijn veel kite-surfers en een paar gezinnetjes. We rijden naar een ander deel van het park, waar we een korte …", "bloglink": "https://rondjewereld.nl/2015/09/14/sandbanks-provincial-park/"}, {"titel": "Bronte Creek Provincial Park, Oakville, Ontario, Canada", "omschrijving": "", "wanneer": "sep 15, 2015", "icon": "campground", "kmstand": 172197, "tripkm": 19703, "land": "USA", "staat": "New York", "lat": 43.405, "lng": -79.728, "dt": 20150915, "ord": 137, "blogsnip": "We hadden de wekker gezet, maar blijven een uur langer liggen. Heerlijk dat dat gewoon kan. Het is ’s morgens al warm, lekker buiten ontbijten. In Peterborough gaan we naar de Trent-Severn Waterway Lift Lock. De waterway verbindt 2 grote meren (Lake Huron en Ontario) met elkaar over een afstand …", "bloglink": "https://rondjewereld.nl/2015/09/15/peterborough-lift-lock/"}, {"titel": "Craigleith Provincial Park, Craigleith, Ontario, Canada", "omschrijving": "", "wanneer": "sep 16, 2015", "icon": "campground", "kmstand": 172365, "tripkm": 19871, "land": "Canada", "staat": "Ontario", "lat": 44.693, "lng": -80.397, "dt": 20150916, "ord": 138, "blogsnip": "Heerlijk weer, dus rijden we pas na 11 uur weg bij de camping. Eerst zoeken we een Tim Hortons op om de formulieren voor de verlenging van de autoverzekering te mailen. Ook proberen we nog even te skypen, maar dat lukt niet. Een man vraagt op de parkeerplaats of we …", "bloglink": "https://rondjewereld.nl/2015/09/16/craigleith/"}, {"titel": "Bruce Peninsula National Park, Ontario, Canada", "omschrijving": "", "wanneer": "sep 17, 2015", "icon": "campground", "kmstand": 172525, "tripkm": 20031, "land": "Canada", "staat": "Ontario", "lat": 44.997, "lng": -81.244, "dt": 20150917, "ord": 139, "blogsnip": "Bij deze camping mag je laat uitchecken. Dus slapen we uit en starten langzaam op. Lekker buiten lezen met uitzicht op het meer. Even een wasje draaien en drogen in de zon en wind. Ook bellen we met Gerhard z’n oudtante om af te spreken over 2,5 week. In de …", "bloglink": "https://rondjewereld.nl/2015/09/17/bruce-peninsula/"}, {"titel": "Gordon's Park, Ontario 6, Tehkummah, Ontario, Canada", "omschrijving": "", "wanneer": "sep 19, 2015", "icon": "campground", "kmstand": 172599, "tripkm": 20105, "land": "Canada", "staat": "Ontario", "lat": 45.883, "lng": -82.285, "dt": 20150919, "ord": 140, "blogsnip": "Niet zo best geslapen; de Jägerthee is niet zo goed gevallen (toch lekkerder in de Alpen) en we hadden het koud. Maar de wekker gaat vroeg, zodat we nog even kunnen skypen. Eerst douchen in de eco douche; het water stroomt alleen als je aan het koord trekt. Maar voor …", "bloglink": "https://rondjewereld.nl/2015/09/20/manitoulin-island/"}, {"titel": "Kagawong, Ontario, Canada", "omschrijving": "", "wanneer": "sep 20, 2015", "icon": "campground", "kmstand": 172694, "tripkm": 20200, "land": "Canada", "staat": "Ontario", "lat": 45.878, "lng": -82.021, "dt": 20150920, "ord": 141, "blogsnip": "Niet zo best geslapen; de Jägerthee is niet zo goed gevallen (toch lekkerder in de Alpen) en we hadden het koud. Maar de wekker gaat vroeg, zodat we nog even kunnen skypen. Eerst douchen in de eco douche; het water stroomt alleen als je aan het koord trekt. Maar voor …", "bloglink": "https://rondjewereld.nl/2015/09/20/manitoulin-island/"}, {"titel": "Chutes Provincial Park, Sables-Spanish Rivers, Ontario, Canada", "omschrijving": "", "wanneer": "sep 21, 2015", "icon": "campground", "kmstand": 172823, "tripkm": 20329, "land": "Canada", "staat": "Ontario", "lat": 46.41, "lng": -82.044, "dt": 20150921, "ord": 142, "blogsnip": "’s Morgens hangt er mist op het meer, terwijl de zon er op schijnt. Wat een fantastisch uitzicht om bij wakker te worden. We pakken in en rijden nog even naar het dorpje om bij de brandweer de watertank te vullen (hadden we gisteren gehoord). Aan de zijkant van het …", "bloglink": "https://rondjewereld.nl/2015/09/21/cup-and-sauce-trail/"}, {"titel": "Killarney Provincial Park, Ontario, Canada", "omschrijving": "", "wanneer": "sep 22, 2015", "icon": "campground", "kmstand": 173014, "tripkm": 20520, "land": "Canada", "staat": "Ontario", "lat": 46.012, "lng": -81.406, "dt": 20150922, "ord": 143, "blogsnip": "Pas om 9 uur wakker. We ontbijten binnen en schieten snel kleren aan om te hiken. Op het pad komen we de Nederlandse emigranten tegen van gisteren, dus kletsen we nog even. Verder zien we niemand. Het is hier weer prachtig. We lopen door het bos met verschillende lookouts over …", "bloglink": "https://rondjewereld.nl/2015/09/22/chutes/"}, {"titel": "Carol Campsite and RV Park, Sudbury, Ontario, Canada", "omschrijving": "", "wanneer": "sep 24, 2015", "icon": "campground", "kmstand": 173128, "tripkm": 20634, "land": "Canada", "staat": "Ontario", "lat": 46.505, "lng": -80.991, "dt": 20150924, "ord": 144, "blogsnip": "Het is half bewolkt en iets frisser, maar nog steeds heerlijk najaarsweer. Dus doen we dezelfde routine als gisteren; ontbijten en aankleden. We hiken de Cranberry Bog trail. Tja, weer mooi. Bos, meertjes e boek uit, dus hopelijk treffen we binnenkort weer een camping waar je …", "bloglink": "https://rondjewereld.nl/2015/09/29/algonquin-indoors/"}, {"titel": "Sandwood tent & trailer park", "omschrijving": "", "wanneer": "sep 30, 2015", "icon": "campground", "kmstand": 173706, "tripkm": 21212, "land": "Canada", "staat": "Ontario", "lat": 45.168, "lng": -79.47, "dt": 20150930, "ord": 148, "blogsnip": "We hadden de wekker om 6 uur staan, maar het is te koud om op te staan, vinden we. We zitten toch om half 8 op de fiets, weliswaar na sunrise. Handschoenen aan, muts onder de helm en heel veel kleren. We fietsen een bike trail, over een voormalig treinspoor …", "bloglink": "https://rondjewereld.nl/2015/09/30/biking-algonquin/"}, {"titel": "Six Mile Lake Provincial Park, Ontario, Canada", "omschrijving": "", "wanneer": "Oct 1, 2015", "icon": "campground", "kmstand": 173826, "tripkm": 21332, "land": "USA", "staat": "New York", "lat": 44.815, "lng": -79.596, "dt": 20151001, "ord": 149, "blogsnip": "Vannacht moest ook de tweede slaapzak nog op het bed om het warm te hebben. Maar dan slapen we ook prima, tot half 10! Wakker met een frisse toet, 6 graden in de bus. Het is mooi weer, strak blauw en koud. Snel douchen om warm te worden en buiten …", "bloglink": "https://rondjewereld.nl/2015/10/01/muskoka-lakes/"}, {"titel": "Indian Line Campground, 7625 Finch Avenue, Brampton, Ontario, Canada", "omschrijving": "", "wanneer": "Oct 2, 2015", "icon": "campground", "kmstand": 174038, "tripkm": 21544, "land": "USA", "staat": "New York", "lat": 43.728, "lng": -79.618, "dt": 20151002, "ord": 150, "blogsnip": "We zetten de wekker, zodat we niet weer een gat in de dag slapen. Zeker nu de dagen korter worden, willen we maximaal genieten van het buiten zijn. Het is prachtig weer, maar guur. Na het ontbijt snel aankleden om een uurtje te hiken. Leuk park; je merkt nauwelijks dat …", "bloglink": "https://rondjewereld.nl/2015/10/02/to-toronto/"}, {"titel": "Family homestay", "omschrijving": "", "wanneer": "Oct 4, 2015", "icon": "rec_lodging", "kmstand": 174206, "tripkm": 21712, "land": "USA", "staat": "New York", "lat": 44.108, "lng": -79.564, "dt": 20151004, "ord": 151, "blogsnip": "Vandaag gaan we op bezoek bij tante Teresa, zus van Gerhard z’n oma, en oom Dirk. In de jaren 50 zijn ze naar Canada geëmigreerd. We hebben eerder al gebeld dat we vandaag langskomen. ’s Morgens doen we rustig aan op de camping. Daarna willen we een aardigheidje kopen.", "bloglink": "https://rondjewereld.nl/2015/10/04/all-in-the-family-2/"}, {"titel": "Scott's Family RV-Park & Campground, Lundy's Lane, Niagara Falls, Ontario, Canada", "omschrijving": "", "wanneer": "Oct 5, 2015", "icon": "campground", "kmstand": 174397, "tripkm": 21903, "land": "USA", "staat": "New York", "lat": 43.094, "lng": -79.085, "dt": 20151005, "ord": 152, "blogsnip": "Het duurde even voordat we gisteren in slaap vielen; zoveel indrukken. De wekker gaat vroeg, zodat we om 7 uur aan het ontbijt zitten. Grace moet werken, maar maakt een heerlijk uitgebreid ontbijt voor ons klaar. Gezellig om nog even met z’n vieren aan tafel te zitten. Als Grace weg …", "bloglink": "https://rondjewereld.nl/2015/10/05/fort-george/"}, {"titel": "Flying J, 1400 Britannia Rd E, Mississauga, ON, Canada", "omschrijving": "", "wanneer": "Oct 6, 2015", "icon": "campground", "kmstand": 174711, "tripkm": 22217, "land": "USA", "staat": "New York", "lat": 43.601, "lng": -79.624, "dt": 20151006, "ord": 153, "blogsnip": "Het is miezerig weer. net als in 2004, toen we ook de Niagara Falls bekeken hebben. Eind van de ochtend parkeren we zo dichtbij mogelijk voor een acceptabele prijs. Want een toeristische toestand is het hier. De omgeving rond de watervallen lijkt wel één groot attractiepark. Maar het is niet …", "bloglink": "https://rondjewereld.nl/2015/10/06/niagara-falls/"}, {"titel": "Bronte Creek Provincial Park, Upper Middle Road West, Oakville, Ontario, Canada", "omschrijving": "", "wanneer": "Oct 7, 2015", "icon": "campground", "kmstand": 174755, "tripkm": 22261, "land": "USA", "staat": "New York", "lat": 43.405, "lng": -79.728, "dt": 20151007, "ord": 154, "blogsnip": "Om 7 uur gaat de wekker; goed geslapen op de truckersplaats. Wel af en toe wakker als de buurman start. We rijden een paar kilometer naar de Mercedes garage en zijn er voor 8 uur. Als we de sleutel hebben afgegeven lopen we naar Tim Hortons. Rustig ontbijten en aan …", "bloglink": "https://rondjewereld.nl/2015/10/07/klussenbussen/"}, {"titel": "Walmart Stratford Supercentre, Ontario Street, Stratford, Ontario, Canada", "omschrijving": "", "wanneer": "Oct 8, 2015", "icon": "campground", "kmstand": 174896, "tripkm": 22402, "land": "Canada", "staat": "Ontario", "lat": 43.369, "lng": -80.975, "dt": 20151008, "ord": 155, "blogsnip": "Het is frisser dan gisteren, maar weer een mooie dag. Rond half 11 rijden we weg bij de camping, zo’n 30 km naar Hamilton. Daar gaan we naar HMCS Haida, een boot uit de Tweede Wereldoorlog. Voordat we aan boord gaan kletsen we ieder afzonderlijk met geinteresseerden over de bus …", "bloglink": "https://rondjewereld.nl/2015/10/08/stratford-festival/"}, {"titel": "Pinery Provincial Park, Ontario, Canada", "omschrijving": "", "wanneer": "Oct 9, 2015", "icon": "campground", "kmstand": 174992, "tripkm": 22498, "land": "Canada", "staat": "Ontario", "lat": 43.258, "lng": -81.83, "dt": 20151009, "ord": 156, "blogsnip": "Prima slapen bij Walmart op de parkeerplaats. En ze blijken ook nog eens super snel internet te hebben. Om 7 uur gaat de winkel open, dus kunnen we naar het toilet. Het is koud en grijs weer, dus hangen we de ochtend lekker in de bus om te internetten. Daarna …", "bloglink": "https://rondjewereld.nl/2015/10/09/the-pinery/"}, {"titel": "Lansing Cottonwood Campground, Lansing, MI, USA", "omschrijving": "", "wanneer": "Oct 10, 2015", "icon": "campground", "kmstand": 175295, "tripkm": 22801, "land": "USA", "staat": "Michigan", "lat": 42.701, "lng": -84.542, "dt": 20151010, "ord": 157, "blogsnip": "Het is heerlijk weer, helder en fris. Zodra we gedoucht hebben zetten we de bus bij het strand, even een bakkie doen bij het meer. Daarna volgen we de provinciale weg richting de grens. Vlak voor de grens besteden we het laatste Canadese muntgeld bij Tim Hortons, onze vriend van …", "bloglink": "https://rondjewereld.nl/2015/10/10/usa-again/"}, {"titel": "Holland State Park, Holland, MI, USA", "omschrijving": "", "wanneer": "Oct 11, 2015", "icon": "campground", "kmstand": 175472, "tripkm": 22978, "land": "USA", "staat": "Michigan", "lat": 42.771, "lng": -86.21, "dt": 20151011, "ord": 158, "blogsnip": "Wat een mazzel met het weer, strak blauwe lucht. We pakken in en parkeren bij een opstappunt van de River Trail. Op deze route zijn veel hardlopers, wandelaars en fietsers. Langs de rivier fietsen we naar de campus van Michigan State University. Mooie gebouwen en rustige buurt.", "bloglink": "https://rondjewereld.nl/2015/10/11/holland-mi/"}, {"titel": "Dunewood Campground, Indiana Dunes National Lakeshore, Chesterton, Indiana, USA", "omschrijving": "", "wanneer": "Oct 12, 2015", "icon": "campground", "kmstand": 175676, "tripkm": 23182, "land": "USA", "staat": "Indiana", "lat": 41.609, "lng": -87.129, "dt": 20151012, "ord": 159, "blogsnip": "Na het ontbijt doen we eerst een korte hike in het State Park. Over een duin met daarop een bos naar een uitzichtpunt over Lake Michigan. Dat willen van dichtbij bekijken, dus rijden we daarna met de bus naar de kust. Met een beker koffie in de hand lopen we …", "bloglink": "https://rondjewereld.nl/2015/10/12/indiana-dunes/"}, {"titel": "Travel Center, Harmony", "omschrijving": "", "wanneer": "Oct 13, 2015", "icon": "campground", "kmstand": 175870, "tripkm": 23376, "land": "USA", "staat": "Michigan", "lat": 42.145441, "lng": -88.510583, "dt": 20151013, "ord": 160, "blogsnip": "We zijn vroeg wakker, zeker door dat uur tijdverschil, mini-jetlag. Om half 10 rijden we weg om nog even bij Lake Michigan te kijken. Nu is de skyline van Chicago wel te zien in de verte, heel vaag. We zetten koffie aan het meer; snel weer de bus in want …", "bloglink": "https://rondjewereld.nl/2015/10/13/chicago/"}, {"titel": "Blue Mound State Park, Blue Mount, WI, USA", "omschrijving": "", "wanneer": "Oct 14, 2015", "icon": "campground", "kmstand": 176079, "tripkm": 23585, "land": "USA", "staat": "Michigan", "lat": 43.002, "lng": -89.985, "dt": 20151014, "ord": 161, "blogsnip": "Weer prima geslapen bij de truckstop. Wel af en toe wakker als er naast ons stationair gedraaid wordt. Om half 10 rijden we weg en we nemen de provinciale weg. Dat spaart tol uit en is bovendien veel leuker. Het landschap is vlak en het mais staat dor in het …", "bloglink": "https://rondjewereld.nl/2015/10/14/cheese-in-wisconsin/"}, {"titel": "Travel Center, South Burr Street, Mitchell, South Dakota", "omschrijving": "", "wanneer": "Oct 16, 2015", "icon": "campground", "kmstand": 176863, "tripkm": 24369, "land": "USA", "staat": "South Dakota", "lat": 43.709, "lng": -98.032, "dt": 20151016, "ord": 162, "blogsnip": "Alle dekens op het bed en muts op, maar dan slaap je ook prima. Vanmorgen is het 6 graden in de bus. Lekker fris op slippers door de bevroren herfstbladeren naar de douche. Maar o wat lekker, een douche na twee dagen keteltjes koken. Buiten drinken we nog een bakkie …", "bloglink": "https://rondjewereld.nl/2015/10/16/hi-minnesota-bye-minnesota/"}, {"titel": "Oahe Downstream Recreation Area Campgrounds #1 and #2, Marina Loop, Fort Pierre, SD", "omschrijving": "", "wanneer": "Oct 17, 2015", "icon": "campground", "kmstand": 177157, "tripkm": 24663, "land": "USA", "staat": "South Dakota", "lat": 44.357, "lng": -100.327, "dt": 20151017, "ord": 163, "blogsnip": "’s Morgens rijden we een klein stukje naar het centrum van Mitchell, naar het Corn Palace. Het is een groot gebouw, versierd met maiskolven en graan. Kunstige kitsch. Je kunt ook binnen kijken, waar de geschiedenis van het Corn Palace wordt beschreven (sinds eind 19e eeuw) en de be 23, "ord": 170, "blogsnip": "We gingen gisteren laat naar bed, dus slapen we lekker uit. Wel worden we af en toe wakker van de wind; de bus gaat aardig heen en weer. Tot half 12 hangen we lekker in de bus, beetje internetten. Daarna rijden we een paar mijl naar Scotts Bluff. Dit is …", "bloglink": "https://rondjewereld.nl/2015/10/23/scotts-bluff/"}, {"titel": "Angostura Recreational Area", "omschrijving": "", "wanneer": "Oct 21, 2015", "icon": "campground", "kmstand": 177829, "tripkm": 25335, "land": "USA", "staat": "South Dakota", "lat": 43.375, "lng": -103.427, "dt": 20151021, "ord": 171, "blogsnip": "Vanochtend rijden we Custer State Park uit via de Wildlife Loop Road. En die doet z’n naam eer aan, want we zijn nog maar net op weg en er staat een kudde Pronghorns op en langs de weg. Het zijn hert-achtige beesten die ze hier voor het gemak antilope noemen …", "bloglink": "https://rondjewereld.nl/2015/10/21/bizonder/"}, {"titel": "Boyd Lake State Park, Loveland, CO, USA", "omschrijving": "", "wanneer": "Oct 24, 2015", "icon": "campground", "kmstand": 178456, "tripkm": 25962, "land": "USA", "staat": "Colorado", "lat": 40.402, "lng": -105.016, "dt": 20151024, "ord": 172, "blogsnip": "Zo, dat was een koude nacht. Twee joggingbroeken aan, t-shirts met lange + korte mouwen, fleecevest, sokken, muts op en handschoenen aan. En nog was het koud. Vannacht stond het ijs buiten op de deuren. Vanmorgen was het 2 graden in de bus. Onze bus is natuurlijk niet super goed …", "bloglink": "https://rondjewereld.nl/2015/10/24/lovely-visit-in-loveland/"}, {"titel": "Longmont Fairground, Longmont, CO, USA", "omschrijving": "", "wanneer": "Oct 25, 2015", "icon": "campground", "kmstand": 178678, "tripkm": 26184, "land": "USA", "staat": "Colorado", "lat": 40.165, "lng": -105.097, "dt": 20151025, "ord": 173, "blogsnip": "We hebben de wekker gezet voor onze ontbijtafspraak. Prima geslapen; het was gelukkig niet koud. Na thee en douchen rijden we weer naar het huis van Antoine en Chantal. De
