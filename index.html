cano/"}, {"titel": "Bosques Birdwatchers RV, San Antonio, NM, USA", "omschrijving": "", "wanneer": "nov 4, 2015", "icon": "campground", "kmstand": 180586, "tripkm": 28092, "land": "USA", "staat": "New Mexico", "lat": 33.915, "lng": -106.864, "dt": 20151104, "ord": 177, "blogsnip": "Vannacht heeft het al aardig geregend en voor vandaag is wisselvallig weer voorspeld. Al rijdend naar het westen en pakken meteen een bui mee. We gaan naar VLA; Very Large Array. Dit is een opstelling van 27 enorme schotels, die via radiogolven 24 uur per dag naar de ruimte “luisteren”.", "bloglink": "https://rondjewereld.nl/2015/11/04/vla/"}, {"titel": "Bandelier National Monument, Los Alamos, NM, USA", "omschrijving": "", "wanneer": "Oct 30, 2015", "icon": "campground", "kmstand": 179705, "tripkm": 27211, "land": "USA", "staat": "Texas", "lat": 35.778, "lng": -106.271, "dt": 20151030, "ord": 178, "blogsnip": "Voor vandaag is wisselvallig weer voorspeld, met veel buien. We rekenen er op en plannen onze activiteiten om de buien heen. ’s Morgens doen we rustig aan op de camping en daarna halen we boodschappen. We rijden Taos uit via de Rio Grande Gorge Bridge. Als je er op rijdt …", "bloglink": "https://rondjewereld.nl/2015/10/30/los-alamos/"}, {"titel": "Los Suenas de Santa Fe, 3574 Cerrillos Rd,Santa Fe, NM 87507", "omschrijving": "", "wanneer": "Oct 31, 2015", "icon": "campground", "kmstand": 179780, "tripkm": 27286, "land": "USA", "staat": "Texas", "lat": 35.672, "lng": -106.017, "dt": 20151031, "ord": 179, "blogsnip": "Yeah, strak blauwe lucht. We pakken in en rijden naar het visitor Center van Bandelier National Monument. Eerst weer even de film, waarna we hiken door het park naar de ruines van een pueblo volk. Hier heeft een enorm dorp gestaan van 1.100 tot 1.500. Veel huizen zijn uitgehakt uit …", "bloglink": "https://rondjewereld.nl/2015/10/31/halloween-in-santa-fe/"}, {"titel": "Balloon View RV Park, Albuquerque, NM, USA", "omschrijving": "", "wanneer": "nov 1, 2015", "icon": "campground", "kmstand": 179973, "tripkm": 27479, "land": "USA", "staat": "Texas", "lat": 35.087, "lng": -106.649, "dt": 20151101, "ord": 180, "blogsnip": "Weer topweer, al om 7 uur. We zijn vroeg wakker, want vannacht is de wintertijd hier ingegaan. Schuifdeur open en lekker een beetje bij de bus rommelen. Gerhard ligt onder de bus de nodige schroeven aan te draaien. Na al die kilometers trilt er wel eens wat los. En met …", "bloglink": "https://rondjewereld.nl/2015/11/01/abq/"}, {"titel": "El Morro RV Park, El Morro, NM, Usa", "omschrijving": "", "wanneer": "nov 2, 2015", "icon": "campground", "kmstand": 180236, "tripkm": 27742, "land": "USA", "staat": "New Mexico", "lat": 35.039, "lng": -108.348, "dt": 20151102, "ord": 181, "blogsnip": "Om kwart over negen rijden we weg met prachtig weer. Op zoek naar filmlocaties van de serie Breaking Bad. Eerst naar de car wash. Het adres dat we hadden gevonden op internet blijkt niet te kloppen. We zitten midden in een woonwijk. Maar bij toeval zien we 2 straten verder …", "bloglink": "https://rondjewereld.nl/2015/11/02/breaking-bad/"}, {"titel": "Datil Well Campground, Datil, NM, Usa", "omschrijving": "", "wanneer": "nov 3, 2015", "icon": "campground", "kmstand": 180443, "tripkm": 27949, "land": "USA", "staat": "New Mexico", "lat": 34.147, "lng": -107.786, "dt": 20151103, "ord": 182, "blogsnip": "‘s Morgens blijkt dat we een buurman hebben gekregen; op de campsite naast ons staat een auto. Ernaast ligt iemand in een slaapzak op een matje. In de buitenlucht, dat is nog eens kamperen. Wij warmen nog even op in de zon met koffie en rijden dan 1 mijl naar …", "bloglink": "https://rondjewereld.nl/2015/11/03/inscription-rock/"}, {"titel": "Elephant Butte Lake State Park, Elephant Butte, NM, USA", "omschrijving": "", "wanneer": "nov 5, 2015", "icon": "campground", "kmstand": 180737, "tripkm": 28243, "land": "USA", "staat": "New Mexico", "lat": 33.162, "lng": -107.202, "dt": 20151105, "ord": 183, "blogsnip": "’s Morgens vroeg is het nog bewolkt en miezert het. Om 9 uur zijn we bij Bosque del Apache National Wildflife Refuge en is de lucht strak blauw. We rijden via de loop road in het park met onderweg diverse uitkijkpunten. Dit park is vooral bekend vanwege de vogels die …", "bloglink": "https://rondjewereld.nl/2015/11/05/elephant-butte/"}, {"titel": "Aguirre Spring Campground, Organ, NM, USA", "omschrijving": "", "wanneer": "nov 6, 2015", "icon": "campground", "kmstand": 180923, "tripkm": 28429, "land": "USA", "staat": "Texas", "lat": 32.372, "lng": -106.564, "dt": 20151106, "ord": 184, "blogsnip": "We ontbijten buiten, met uitzicht op het meer. Vandaag doen we het rustig aan. De hele ochtend klussen we aan de bus; schoonmaken, tochtstrips aanbrengen (tegen stof op dirt roads), olie bijvullen. Af en toe houden we pauze met koffie en turen we over het meer. Wat is het stil …", "bloglink": "https://rondjewereld.nl/2015/11/06/aguirre-spring/"}, {"titel": "Edgington RV Park, Alamogordo, NM, USA", "omschrijving": "", "wanneer": "nov 7, 2015", "icon": "campground", "kmstand": 181032, "tripkm": 28538, "land": "USA", "staat": "Texas", "lat": 32.883, "lng": -105.961, "dt": 20151107, "ord": 185, "blogsnip": "De wekker gaat om half 7. Het is al licht, maar de zon is nog niet boven de bergen. Dus kruipen we nog even in bed. Om kwart voor 8 staan we buiten en starten we met de Pine Tree Hike. Een hike van 6 km, die 1.000 voet klimt …", "bloglink": "https://rondjewereld.nl/2015/11/07/mountains-and-missiles/"}, {"titel": "Brantley Lake State Park, NM, USA", "omschrijving": "", "wanneer": "nov 8, 2015", "icon": "campground", "kmstand": 181344, "tripkm": 28850, "land": "USA", "staat": "Texas", "lat": 32.526, "lng": -104.379, "dt": 20151108, "ord": 186, "blogsnip": "Vandaag rijden we een stukje terug voor White Sands National Monument. Voor 9 uur rijden we het park al binnen. Hoe verder we het park in rijden, hoe witter het wordt van het zand. Het zand is heel fijn, ze noemen het gypsum (gips) zand. Gek genoeg kunnen er wel …", "bloglink": "https://rondjewereld.nl/2015/11/08/white-sands/"}, {"titel": "Guadelupe National Park, Texas, USA", "omschrijving": "", "wanneer": "nov 9, 2015", "icon": "campground", "kmstand": 181489, "tripkm": 28995, "land": "USA", "staat": "Texas", "lat": 31.892, "lng": -104.86, "dt": 20151109, "ord": 187, "blogsnip": "Heerlijk weer, we ontbijten zelfs buiten. En we rommelen wat rond de bus, lekker lui. In Carlsbad tanken we en doen we boodschappen. Bij tankstations hebben we vaak aanspraak over de bus. Nu komt een dame van het naastgelegen makelaarskantoor naar buiten. Ze wil even binnen kijken en vindt het …", "bloglink": "https://rondjewereld.nl/2015/11/09/carlsbad-caverns/"}, {"titel": "Mission RV Park, El Paso, TX, USA", "omschrijving": "", "wanneer": "nov 10, 2015", "icon": "campground", "kmstand": 181895, "tripkm": 29401, "land": "USA", "staat": "Texas", "lat": 31.771, "lng": -106.434, "dt": 20151110, "ord": 188, "blogsnip": "Voor het eerst sinds tijden onder minder dekens geslapen, want het is hier warm ondanks de hoogte. Eerst pikken we een kaart op bij het visitor center, waarna we naar het startpunt van een korte hike rijden. Aan de voet van de bergen, uitzicht op een brede vallei, herfstkleuren, besjes …", "bloglink": "https://rondjewereld.nl/2015/11/10/guadalupe-mountains/"}, {"titel": "City of Rocks State Park, NM, USA", "omschrijving": "", "wanneer": "nov 12, 2015", "icon": "campground", "kmstand": 182139, "tripkm": 29645, "land": "USA", "staat": "New Mexico", "lat": 32.858, "lng": -107.969, "dt": 20151112, "ord": 189, "blogsnip": "Wat slapen we toch goed in de bus. Zeker als het niet heel erg koud is buiten, zomaar 10 uur ronken. Of het komt door de copieuze maaltijd van gisteren. Ontbijten met de schuifdeur open in de zon. Eenmaal onderweg staan we gewoon nog even in de file. Vlak bij …", "bloglink": "https://rondjewereld.nl/2015/11/12/city-of-rocks/"}, {"titel": "Mountain View RV Park, Bowie, AZ, USA", "omschrijving": "", "wanneer": "nov 14, 2015", "icon": "campground", "kmstand": 182499, "tripkm": 30005, "land": "USA", "staat": "Arizona", "lat": 32.005, "lng": -109.49, "dt": 20151114, "ord": 190, "blogsnip": "Vanochtend is het 0 graden in de bus. Maar prima geslapen, wel even een muts op gedaan. Niet eens een kruik in bed. De zon schijnt al op de bus, dus winterjassen aan en deuren en gordijnen open om op te warmen. Met thee en eieren met spek zitten we …", "bloglink": "https://rondjewereld.nl/2015/11/14/gila-cliff-dwellings/"}, {"titel": "Gila Cliff Dwellings National Monument, NM, USA", "omschrijving": "", "wanneer": "nov 13, 2015", "icon": "campground", "kmstand": 182256, "tripkm": 29762, "land": "USA", "staat": "New Mexico", "lat": 33.226, "lng": -108.272, "dt": 20151113, "ord": 191, "blogsnip": "De zon schijnt als we wakker worden, maar de bus staat in de schaduw van de rotsen. We ontbijten binnen en Bob uit Albuquerque komt nog even zijn visitekaartje brengen. Daarna zetten we de bus bij het douchegebouw. Als we klaar zijn, gaan we hiken. Eerst naar observation point, met …", "bloglink": "https://rondjewereld.nl/2015/11/13/gila-wilderness/"}, {"titel": "Whispering Palms RV Park, 3445 N Romero Rd, Tucson, AZ, USA", "omschrijving": "", "wanneer": "nov 15, 2015", "icon": "campground", "kmstand": 182680, "tripkm": 30186, "land": "USA", "staat": "Arizona", "lat": 32.28, "lng": -110.995, "dt": 20151115, "ord": 192, "blogsnip": "Het is bewolkt, zoals voorspeld. Dus doen we rustig aan, flink internetten en skypen. Pas om 11 uur rijden we weg richting Tucson. Onderweg regent het af en toe. We lunchen langs de snelweg in de bus bij een rest area en rijden dan weer door. In Tucson is het …", "bloglink": "https://rondjewereld.nl/2015/11/15/to-tucson/"}, {"titel": "Catalina State Park, Catalina, AZ, USA", "omschrijving": "", "wanneer": "nov 16, 2015", "icon": "campground", "kmstand": 182761, "tripkm": 30267, "land": "USA", "staat": "Arizona", "lat": 32.424, "lng": -110.921, "dt": 20151116, "ord": 193, "blogsnip": "Zoals voorspeld is het regenachtig en grijs weer. Dus weer even skypen en internetten na het ontbijt. Voor vandaag staan er binnenactiviteiten op het programma. Eerst naar een outdoor-winkel, want Gerhard heeft een nieuwe broek nodig (scheur in de oude). Mooie zaak, we slagen meteen.", "bloglink": "https://rondjewereld.nl/2015/11/16/biosphere-2/"}, {"titel": "Crazy Horse RV Park, South Craycroft Road, Tucson, Arizona", "omschrijving": "", "wanneer": "nov 17, 2015", "icon": "campground", "kmstand": 182849, "tripkm": 30355, "land": "USA", "staat": "Arizona", "lat": 32.156, "lng": -110.774, "dt": 20151117, "ord": 194, "blogsnip": "De zon schijnt weer, heerlijk. Maar het is nog wel fris. We ontbijten op de treeplank achter de bus. Er komt een Zwitsers stel voorbij van onze leeftijd. Ze wonen in Alaska en zijn nu 6 weken op vakantie. Op weg naar Mexico voor de tandarts net over de grens …", "bloglink": "https://rondjewereld.nl/2015/11/17/saguaro/"}, {"titel": "Mountain View RV Park, Amado, AZ, USA", "omschrijving": "", "wanneer": "nov 18, 2015", "icon": "campground", "kmstand": 182926, "tripkm": 30432, "land": "USA", "staat": "Arizona", "lat": 31.742, "lng": -111.059, "dt": 20151118, "ord": 195, "blogsnip": "Vroeg op, om 7 uur gaat de wekker. Nadat we gedoucht hebben, gaan we in de rec-room ontbijten. Gratis koffie met donuts. Er zitten best al wat mensen, TV op een nieuwszender. Dit zijn geen gewone donuts, maar maat mega. Daar kunnen we wel even op lopen. We rijden een …", "bloglink": "https://rondjewereld.nl/2015/11/18/aircraft-boneyard/"}, {"titel": "Patagonia Lake State Park, AZ, USA", "omschrijving": "", "wanneer": "nov 19, 2015", "icon": "campground", "kmstand": 183050, "tripkm": 30556, "land": "USA", "staat": "Arizona", "lat": 31.468, "lng": -110.767, "dt": 20151119, "ord": 196, "blogsnip": "Wat een grote temperatuursverschillen. ’s Nachts slapen we met een muts op, terwijl we ’s morgens in de zon in een t-shirt aan de koffie zitten. Heerlijk weer, dus we blijven een beetje op de camping hangen. Daarna rijden we iets terug naar het noorden, naar het Titan Missile Museum.", "bloglink": "https://rondjewereld.nl/2015/11/19/titan-missiles/"}, {"titel": "Chiricahua National Monument, Arizona, USA", "omschrijving": "", "wanneer": "nov 20, 2015", "icon": "campground", "kmstand": 183298, "tripkm": 30804, "land": "USA", "staat": "Arizona", "lat": 32.013, "lng": -109.338, "dt": 20151120, "ord": 197, "blogsnip": "We ontbijten buiten en pakken de kaart erbij. Na 10 uur rijden we weg naar Tombstone. Zo’n 1,5 uur door de woestijn en de bergen, hier en daar een boerderij of een gehucht. Tombstone is een Wild West plaats waar in 1881 een beroemd vuurgevecht heeft plaatsgevonden tussen voor ons …", "bloglink": "https://rondjewereld.nl/2015/11/20/tombstone/"}, {"titel": "Roper Lake State Park, AZ, USA", "omschrijving": "", "wanneer": "nov 21, 2015", "icon": "campground", "kmstand": 183435, "tripkm": 30941, "land": "USA", "staat": "Arizona", "lat": 32.811, "lng": -109.718, "dt": 20151121, "ord": 198, "blogsnip": "Als we wakker worden staat de bus in de schaduw van de bergen. Dus rijden we het park in, naar het begin van een trail, op de berg. In de zon, maar met wind, ontbijten we met de schuifdeur open in de bus. Om 9.15 beginnen we al aan de …", "bloglink": "https://rondjewereld.nl/2015/11/21/chiricahua-en-fort-bowie/"}, {"titel": "Lost Dutchman State Park, Arizona, USA", "omschrijving": "", "wanneer": "nov 22, 2015", "icon": "campground", "kmstand": 183673, "tripkm": 31179, "land": "USA", "staat": "Arizona", "lat": 33.456, "lng": -111.481, "dt": 20151122, "ord": 199, "blogsnip": "Vandaag gaan we geen dingen bekijken, alleen rijden. Dus hebben we niet al te veel haast. Vanaf de camping rijden we eerst naar McDonald’s voor koffie en skypen. Daarna doen we boodschappen bij Safeway. Er wordt omgeroepen dat er een liefdadigheidsactie loopt, vandaag is de laatste dag.", "bloglink": "https://rondjewereld.nl/2015/11/22/valley-of-the-sun/"}, {"titel": "Indian Skies RV Resort, Coolidge, AZ, USA", "omschrijving": "", "wanneer": "nov 24, 2015", "icon": "campground", "kmstand": 183839, "tripkm": 31345, "land": "USA", "staat": "Arizona", "lat": 32.972, "lng": -111.547, "dt": 20151124, "ord": 200, "blogsnip": "Het is weer lekker warm als we opstaan. Pas om half 9 wakker, wat zijn we lui. Rond 11 uur zijn we ingepakt, water bijgevuld, good to go . Op naar Lids, een pettenwinkel. Gerhard z’n pet is versleten, de draden hangen eraan. En voor een nieuwe neutrale pet zijn …", "bloglink": "https://rondjewereld.nl/2015/11/24/mercedes-benz-chandler/"}, {"titel": "Painted Rocks Petroglyph Site, AZ, USA", "omschrijving": "", "wanneer": "nov 25, 2015", "icon": "campground", "kmstand": 184024, "tripkm": 31530, "land": "USA", "staat": "Arizona", "lat": 33.029, "lng": -112.853, "dt": 20151125, "ord": 201, "blogsnip": "Als we wakker worden checken we meteen de status van de bestelling van het onderdeel om de richtingaanwijzers te maken. Er is nog geen bevestiging binnen. We ontbijten en skypen. Dan gaat opeens de mobiel; het bedrijf waarbij we de onderdelen besteld hebben wil onze gegevens verifiëren.", "bloglink": "https://rondjewereld.nl/2015/11/25/casa-grande/"}, {"titel": "Hidden Cove RV, Yuma, AZ, USA", "omschrijving": "", "wanneer": "nov 26, 2015", "icon": "campground", "kmstand": 184215, "tripkm": 31721, "land": "USA", "staat": "Arizona", "lat": 32.694, "lng": -114.586, "dt": 20151126, "ord": 202, "blogsnip": "We zijn vroeg weg, geen douche schiet altijd lekker op. Om even na 9 uur rijden we al weg. Het is nog fris, de verwarming doen we zelfs nog even aan. In 2 uur rijden we naar Yuma. Onderweg is het nog best druk op de snelweg, terwijl er maar …", "bloglink": "https://rondjewereld.nl/2015/11/26/thanksgiving/"}, {"titel": "Sky Valley Campground, Desert Hot Springs, CA, USA", "omschrijving": "", "wanneer": "nov 29, 2015", "icon": "campground", "kmstand": 184727, "tripkm": 32233, "land": "USA", "staat": "California", "lat": 33.955, "lng": -116.525, "dt": 20151129, "ord": 203, "blogsnip": "We zijn al vroeg wakker, maar draaien ons nog even om. Als we opstaan, doen we snel de gordijnen en schuifdeur open, zodat de zon naar binnen schijnt. Buiten is het warmer dan binnen. Onze buren, een vader en zoon, komen even kletsen over de bus. We ontbijten buiten en …", "bloglink": "https://rondjewereld.nl/2015/11/29/joshua-tree-np/"}, {"titel": "Salton Sea State Park, CA, USA", "omschrijving": "", "wanneer": "nov 27, 2015", "icon": "campground", "kmstand": 184442, "tripkm": 31948, "land": "USA", "staat": "California", "lat": 33.49, "lng": -115.907, "dt": 20151127, "ord": 204, "blogsnip": "Terwijl we inpakken komen verschillende mensen nog even een praatje maken. We zijn welkom om nog eens langs te komen. Schattig. Al vroeg zijn we bij Yuma Territorial Prison State Park. En met ons nog meer mensen, iedereen wil er zeker even uit na Thanksgiving. We pakken de rondleiding mee …", "bloglink": "https://rondjewereld.nl/2015/11/27/salton-sea/"}, {"titel": "Lake Cahuilla Recreation Area, La Quinta, CA, USA", "omschrijving": "", "wanneer": "nov 30, 2015", "icon": "campground", "kmstand": 184820, "tripkm": 32326, "land": "USA", "staat": "California", "lat": 33.663, "lng": -116.289, "dt": 20151130, "ord": 205, "blogsnip": "Zodra de zon op is ontbijten we. Om 8 uur liggen we al in het zwembad. Heerlijk warm water, beetje baantjes trekken en in de hotpool zitten. En er is verder niemand. Pas later komen er anderen; als wij gedouched hebben en nog even willen skypen bij het zwembad, wordt …", "bloglink": "https://rondjewereld.nl/2015/11/30/la-quinta/"}, {"titel": "Joshua Tree National Park", "omschrijving": "", "wanneer": "nov 28, 2015", "icon": "campground", "kmstand": 184534, "tripkm": 32040, "land": "USA", "staat": "California", "lat": 33.74, "lng": -115.82, "dt": 20151128, "ord": 206, "blogsnip": "We zijn al vroeg wakker, maar draaien ons nog even om. Als we opstaan, doen we snel de gordijnen en schuifdeur open, zodat de zon naar binnen schijnt. Buiten is het warmer dan binnen. Onze buren, een vader en zoon, komen even kletsen over de bus. We ontbijten buiten en …", "bloglink": "https://rondjewereld.nl/2015/11/29/joshua-tree-np/"}, {"titel": "Borrego Palm Canyon Campground, Borrego Springs, CA, USA", "omschrijving": "", "wanneer": "dec 1, 2015", "icon": "campground", "kmstand": 184947, "tripkm": 32453, "land": "USA", "staat": "California", "lat": 33.259, "lng": -116.395, "dt": 20151201, "ord": 207, "blogsnip": "’s Morgens doen we rustig aan, lekker buiten ontbijten en een beetje rommelen bij de bus. Wat is dit een mooi rustig plekje. Om 10 uur rijden we weg naar het volgende plaatsje. Bij een wasserette draaien we weer een wasje. Lekkere snelle machines hier. De televisie staat op een …", "bloglink": "https://rondjewereld.nl/2015/12/01/anza-borrego/"}, {"titel": "Carlsbad State Beach, CA, USA", "omschrijving": "", "wanneer": "dec 4, 2015", "icon": "campground", "kmstand": 185301, "tripkm": 32807, "land": "USA", "staat": "California", "lat": 33.158, "lng": -117.35, "dt": 20151204, "ord": 208, "blogsnip": "We zijn vroeg ingepakt en rijden een stukje terug naar Mountain Palm Springs om te hiken. Rugzakken op en gaan. Gek genoeg kunnen we het pad niet vinden. Dus doen we onbedoeld een andere hike. Wel ook weer mooi, met een palmbomen-oase. Terug bij de bus houden we het hiken …", "bloglink": "https://rondjewereld.nl/2015/12/04/desert-to-pacific/"}, {"titel": "Indian Cove Campground, Indian Cove Road, 29 Palms, Californië", "omschrijving": "", "wanneer": "dec 6, 2015", "icon": "campground", "kmstand": 185566, "tripkm": 33072, "land": "USA", "staat": "California", "lat": 34.079, "lng": -116.175, "dt": 20151206, "ord": 209, "blogsnip": "Het is licht bewolkt, dus we ontbijten in de bus. Rond 10 uur rijden we weg, na aan diverse geinteresseerden iets te hebben verteld over de bus. First stop is Starbucks voor koffie en internet. Helaas nog steeds geen update over de verzending van de bus-onderdelen. In San Marcos gaan …", "bloglink": "https://rondjewereld.nl/2015/12/06/indian-cove/"}, {"titel": "Bow Willow Campground, Julian, Californië", "omschrijving": "", "wanneer": "dec 3, 2015", "icon": "campground", "kmstand": 185042, "tripkm": 32548, "land": "USA", "staat": "California", "lat": 32.794, "lng": -116.113, "dt": 20151203, "ord": 210, "blogsnip": "Wat een prachtig weer als we wakker worden. Het is goed te begrijpen dat de snow birds (gepensioneerde Canadezen en Amerikanen uit koudere gebieden) graag de winter hier doorbrengen. We relaxen weer in de zon, bakkie koffie erbij. Lekker. Rond 11 uur rijden we weg van deze prachtige camping.", "bloglink": "https://rondjewereld.nl/2015/12/03/bow-willow/"}, {"titel": "Hole-in-the-Wall Campground, San Bernardino County, Californië", "omschrijving": "", "wanneer": "dec 7, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "USA", "staat": "California", "lat": 34.992, "lng": -115.39, "dt": 20151207, "ord": 211, "blogsnip": "Vroeg op, even wakker worden in de zon met een gebakken eitje. Nog wel een jas aan zo vroeg. We rijden naar het begin van de 49-palms trail voor een hike. Ook hier weer naar een palmbomen-oase. Eerst flink stijgen door de rotsachtige bergen en dan afdalen naar de groene …", "bloglink": "https://rondjewereld.nl/2015/12/07/mojave-desert/"}, {"titel": "Circus Circus, Las Vegas Boulevard, Las Vegas, NV", "omschrijving": "", "wanneer": "dec 8, 2015", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "USA", "staat": "Nevada", "lat": 36.131, "lng": -115.165, "dt": 20151208, "ord": 212, "blogsnip": "Wat een verschil; ‘s avonds een winterjas aan, om 8 uur ‘s morgen in een t-shirt buiten. Al vroeg doen we de Ring Loop Hike. Tussen rotsen met grote gaten, daarom heet het hier Hole in the Wall. Lekker apekooien in de vroegte met al dat klimmen. Hier en daar …", "bloglink": "https://rondjewereld.nl/2015/12/08/desert/"}, {"titel": "Texas Spring Campground, Death Valley, CA, USA", "omschrijving": "", "wanneer": "dec 10, 2015", "icon": "campground", "kmstand": 186207, "tripkm": 33713, "land": "USA", "staat": "Nevada", "lat": 36.419, "lng": -116.869, "dt": 20151210, "ord": 213, "blogsnip": "Eerst nog even buizen (nu het kan) en internetten als we opstaan. Onze onderdelen zijn nog bij de douane, zien we in de status. Om 9 uur zitten we te ontbijten in de bus. Daarna rijden we naar een wasserette. Terwijl de was draait drinken we koffie in de bus …", "bloglink": "https://rondjewereld.nl/2015/12/10/death-valley/"}, {"titel": "Stovepipe Wells, Campground, Death Valley, CA, USA", "omschrijving": "", "wanneer": "dec 11, 2015", "icon": "campground", "kmstand": 186328, "tripkm": 33834, "land": "USA", "staat": "Nevada", "lat": 36.606, "lng": -117.136, "dt": 20151211, "ord": 214, "blogsnip": "Weer prima geslapen in ons eigen bed; ligt lekkerder dan in een hotel. De schuifdeur kan weer open voor het ontbijt. We doen rustig aan. En het is druk bij de bus; een Nederlands echtpaar komt even kletsen. Een Amerikaan vraagt of we wapens bij ons hebben voor in Mexico …", "bloglink": "https://rondjewereld.nl/2015/12/11/death-valley-is-alive/"}, {"titel": "Adelanto RV Park, Air Expressway, Adelanto, CA", "omschrijving": "", "wanneer": "dec 12, 2015", "icon": "campground", "kmstand": 186682, "tripkm": 34188, "land": "USA", "staat": "California", "lat": 34.576, "lng": -117.405, "dt": 20151212, "ord": 215, "blogsnip": "‘s Morgens is het helder. Het zand en stof van de storm van gisteren in neergedaald. Nu kunnen we de duinen zien, die in deze vallei liggen. Ze steken mooi af tegen de bergen. Om half negen zijn we al bij het parkeerterrein van de duinen. Even koffie en dan …", "bloglink": "https://rondjewereld.nl/2015/12/12/mequite-flat-sand-dunes/"}, {"titel": "Lake Cahuilla Recreation Area, La Quinta, CA, USA", "omschrijving": "Een paar nachten op deze prachtige camping om alle zaken voordat we Mexico ingaan kunnen regelen.", "wanneer": "dec 13, 2015", "icon": "campground", "kmstand": 186881, "tripkm": 34387, "land": "USA", "staat": "California", "lat": 33.663, "lng": -116.289, "dt": 20151213, "ord": 216, "blogsnip": "‘s Morgens doen we snel de deur open om op te warmen. We hebben geen haast, want we rijden vandaag alleen maar naar La Quinta. Lekker internetten en skypen met jarige Lena. Om half 12 rijden we weg. Onderweg lunchen we bij een rest area. Al snel rijden we op …", "bloglink": "https://rondjewereld.nl/2015/12/13/back-to-la-quinta/"}, {"titel": "Carlsbad State Beach, CA, USA", "omschrijving": "", "wanneer": "dec 20, 2015", "icon": "campground", "kmstand": 187421, "tripkm": 34927, "land": "USA", "staat": "California", "lat": 33.158, "lng": -117.35, "dt": 20151220, "ord": 217, "blogsnip": "’s Morgens genieten we nog even van het meertje waaraan we een week gestaan hebben. Vandaag gaan we weer op pad. Eerst met de hulptroepen skypen om de Fedex papieren door te nemen. Bij het internetpunt is het best druk. We kletsen met een leuk ouder echtpaar uit Canada. Zij …", "bloglink": "https://rondjewereld.nl/2015/12/20/back-to-the-ocean/"}, {"titel": "Carlsbad State Beach, CA, USA", "omschrijving": "", "wanneer": "dec 25, 2015", "icon": "campground", "kmstand": 188236, "tripkm": 35742, "land": "USA", "staat": "California", "lat": 33.158, "lng": -117.35, "dt": 20151225, "ord": 218, "blogsnip": "Wat een storm weer vannacht. Maar we hebben toch wel aardig geslapen. Na het ontbijt komt Mike nog even koffie drinken. Daarna pakken we in. Verderop parkeren we voor internetontvangst om met familie te skypen. Aan de andere kant van de camping, waar we de gratis douches en nauwelijks mensen …", "bloglink": "https://rondjewereld.nl/2015/12/25/kerst-in-socal/"}, {"titel": "Rice and Beans, San Ignacio, Baja California Sur, Mexico", "omschrijving": "", "wanneer": "jan 3, 2016", "icon": "campground", "kmstand": 189544, "tripkm": 37050, "land": "Mexico", "staat": "Baja California Sur", "lat": 27.293, "lng": -112.895, "dt": 20160103, "ord": 219, "blogsnip": "Om 7 uur is het al druk op de camping. Veel buren pakken in. Wij hebben geen haast en hebben even later vrijwel de hele camping (annex parkeerplaats) voor onszelf. Het is heerlijk weer. We pakken rustig in en kletsen nog wat met Charlie en Jess. Dan doen we boodschappen …", "bloglink": "https://rondjewereld.nl/2016/01/03/san-ignacio/"}, {"titel": "San Elijo State Beach, South Coast Highway 101, Cardiff, CA", "omschrijving": "", "wanneer": "dec 21, 2015", "icon": "campground", "kmstand": 187537, "tripkm": 35043, "land": "USA", "staat": "California", "lat": 33.012, "lng": -117.278, "dt": 20151221, "ord": 220, "blogsnip": "We zien ’s morgens dat het onderdeel voor de bus is opgehaald en nu in Utrecht is. Fijn dat het onderweg is. Vandaag gaan we naar de San Diego Zoo. Net na de ochtendspits over de snelweg is het nog zo’n half uur rijden. Om 10 uur zijn we er …", "bloglink": "https://rondjewereld.nl/2015/12/21/san-diego-zoo/"}, {"titel": "Guerrero Negro, Baja California Sur, Mexico", "omschrijving": "", "wanneer": "jan 1, 2016", "icon": "campground", "kmstand": 189388, "tripkm": 36894, "land": "Mexico", "staat": "Baja California", "lat": 28.003, "lng": -114.06, "dt": 20160101, "ord": 221, "blogsnip": "Geweldig: 1 januari en wij staan op met een strakblauwe lucht, de zon en een prachtig kalme baai. Meteen een kopje thee buiten, heerlijk. De toiletten zijn een sanitair avontuur, maar er is wel een heerlijk hete douche. We hangen lekker rond de bus en vertrekken rond half 11. Vol …", "bloglink": "https://rondjewereld.nl/2016/01/01/guerrero-negro/"}, {"titel": "Lake Cahuilla Recreation Area, La Quinta, CA, USA", "omschrijving": "", "wanneer": "dec 22, 2015", "icon": "campground", "kmstand": 187835, "tripkm": 35341, "land": "USA", "staat": "California", "lat": 33.663, "lng": -116.289, "dt": 20151222, "ord": 222, "blogsnip": "Het regent in San Diego. Maakt niet uit, want vandaag gaan we spullen kopen voor Mexico. Maar eerst checken we de status van de koerier. Het lijkt of het pakket in Memphis is. We gaan vroeg weg, zodat we vanmiddag op tijd in Palm Springs zijn. Eerst rijden we richting …", "bloglink": "https://rondjewereld.nl/2015/12/22/shopping/"}, {"titel": "Ensenada, Baja California, Mexico", "omschrijving": "", "wanneer": "dec 28, 2015", "icon": "campground", "kmstand": 188596, "tripkm": 36102, "land": "Mexico", "staat": "Baja California", "lat": 31.698415, "lng": -116.63574, "dt": 20151228, "ord": 223, "blogsnip": "Brrr, 1 graad in de bus als we opstaan. Maar we hebben het niet koud gehad vannacht. Wel af en toe wakker, het is toch best spannend om de grens over te gaan. De checklist ligt al klaar, want het moet in een bepaalde volgorde. Eerst tanken we nog even …", "bloglink": "https://rondjewereld.nl/2015/12/28/hola-mexico/"}, {"titel": "San Quintín, Mexico", "omschrijving": "", "wanneer": "dec 29, 2015", "icon": "campground", "kmstand": 188809, "tripkm": 36315, "land": "Mexico", "staat": "Baja California", "lat": 30.507822, "lng": -115.93205, "dt": 20151229, "ord": 224, "blogsnip": "Vannacht heeft het geregend. Nu staan er flinke plassen in het zand op de camping. Dat maakt douchen in de toch al spartaanse faciliteiten helemaal interessant. Lesley krijgt de warme kraan niet open en doucht maar koud. Bij Gerhard is de douche zo heet, dat ie er maar net onder …", "bloglink": "https://rondjewereld.nl/2015/12/29/la-bufadora/"}, {"titel": "Hacienda de la Habana, Mulege, Baja California Sur, Mexico", "omschrijving": "", "wanneer": "jan 4, 2016", "icon": "campground", "kmstand": 189686, "tripkm": 37192, "land": "Mexico", "staat": "Baja California Sur", "lat": 26.879, "lng": -111.986, "dt": 20160104, "ord": 225, "blogsnip": "Ook nu zijn weer veel campers vroeg weg. We ontbijten in de bus, het is bewolkt en nog wat fris. Op het terras van het restaurant pakken we even internet op. Daarna gaan we weer op weg. Bij het tankstation vullen we eerst een jerrycan, zodat we reserve-brandstof hebben.", "bloglink": "https://rondjewereld.nl/2016/01/04/hacienda-in-mulege/"}, {"titel": "San Diego Metro KOA, North 2nd Avenue, Chula Vista, Californië", "omschrijving": "", "wanneer": "dec 26, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "USA", "staat": "California", "lat": 32.617, "lng": -117.063, "dt": 20151226, "ord": 226, "blogsnip": "Zodra we zijn ingepakt rijden we eerst naar Starbucks, voor koffie en kerst-skype met de familie. Daarna rijden we langs bij de reisboekenwinkel waar we eerder waren. De ontbrekende boeken voor centraal amerika zijn besteld, maar worden pas over een week verwacht.", "bloglink": "https://rondjewereld.nl/2015/12/26/cabrillo/"}, {"titel": "Bahia de Los Angeles, Baja California, Mexico", "omschrijving": "", "wanneer": "dec 31, 2015", "icon": "campground", "kmstand": 189179, "tripkm": 36685, "land": "Mexico", "staat": "Baja California", "lat": 28.942, "lng": -113.561, "dt": 20151231, "ord": 227, "blogsnip": "Al vroeg rijden we weg bij Cataviña. Heerlijk weer, wat sluierbewolking en een zonnetje. We volgen de hoofdweg naar het oosten. Na een uurtje parkeren we even om koffie te zetten. Prachtig is het hier. Allerlei verschillende cactussen. De cirio (in het Engels Boojum Tree) is uniek voor deze regio.", "bloglink": "https://rondjewereld.nl/2015/12/31/bahia-de-los-angeles/"}, {"titel": "Potrero County Park, Potrero, Californië", "omschrijving": "", "wanneer": "dec 27, 2015", "icon": "campground", "kmstand": 188418, "tripkm": 35924, "land": "USA", "staat": "California", "lat": 32.597, "lng": -116.598, "dt": 20151227, "ord": 228, "blogsnip": "Best koud vanmorgen. Snel douchen en een beetje opwarmen in de zon. Daarna is ons kantoor geopend. We zetten de printer op om documenten voor de grensovergang te scannen en printen. Verder plakken we handige telefoonnummers in het dashboard-kastje en maken we een toonbare kopie van onze paspoorten om eventueel …", "bloglink": "https://rondjewereld.nl/2015/12/27/preparations/"}, {"titel": "Cataviña, Baja California, Mexico", "omschrijving": "", "wanneer": "dec 30, 2015", "icon": "campground", "kmstand": 189001, "tripkm": 36507, "land": "Mexico", "staat": "Baja California", "lat": 29.749, "lng": -114.685, "dt": 20151230, "ord": 229, "blogsnip": "Heerlijk geslapen, lekker vroeg ontbijten in de bus. We hebben niet veel haast, want we willen maar een paar uur rijden vandaag. Als we met de schuifdeur open aan de koffie zitten, komt er iemand praten. Het is Stan, een Canadees, die hier werkt en al 11 jaar woont. De …", "bloglink": "https://rondjewereld.nl/2015/12/30/catavina/"}, {"titel": "Playa Santispak, Mulegé", "omschrijving": "", "wanneer": "jan 5, 2016", "icon": "campground", "kmstand": 189733, "tripkm": 37239, "land": "Mexico", "staat": "Baja California Sur", "lat": 26.764653, "lng": -111.889809, "dt": 20160105, "ord": 230, "blogsnip": "Heerlijk rustig wakker worden op de Hacienda. De lucht is strak blauw. Snel de stoelen naar buiten om te ontbijten in de zon. Buurman Von is ook al wakker en komt kletsen. Prachtig oranje orioles vliegen voorbij; vogels met exact dezelfde kleur als de sinaasappels. Von leent ons zijn ladder …", "bloglink": "https://rondjewereld.nl/2016/01/05/playa-santispac/"}, {"titel": "Playa Buenaventura", "omschrijving": "", "wanneer": "jan 6, 2016", "icon": "campground", "kmstand": 189754, "tripkm": 37260, "land": "Mexico", "staat": "Baja California Sur", "lat": 26.643448, "lng": -111.845355, "dt": 20160106, "ord": 231, "blogsnip": "Wow, wat een prachtige omgeving om in wakker te worden. Het water staat hoger dan gisteren en is spiegelglad. We schillen een paar zelf geplukte sinaasappels en ontbijten in de zon. Daarna lekker lezen, wat kletsen met mensen die voorbij komen en kijken naar wat er om ons heen gebeurt.", "bloglink": "https://rondjewereld.nl/2016/01/06/buenaventura/"}, {"titel": "Playa El Requeson", "omschrijving": "", "wanneer": "jan 7, 2016", "icon": "campground", "kmstand": 189756, "tripkm": 37262, "land": "Mexico", "staat": "Baja California Sur", "lat": 26.637252, "lng": -111.831673, "dt": 20160107, "ord": 232, "blogsnip": "Lekker bij sunrise buiten ontbijten. Wat is het hier mooi. Lesley gaat nog even internetten. Begint de baas er weer over dat je niks mag downloaden. Dus geeft Lesley gratis advies; maak een guest-network dan heb je niet zo’n stress dat het internet eruit knalt. Hij snapt er niks van.", "bloglink": "https://rondjewereld.nl/2016/01/07/el-requeson/"}, {"titel": "Loreta, Mexico", "omschrijving": "", "wanneer": "jan 8, 2016", "icon": "campground", "kmstand": 189853, "tripkm": 37359, "land": "Mexico", "staat": "Baja California Sur", "lat": 26.017522, "lng": -111.345747, "dt": 20160108, "ord": 233, "blogsnip": "We zien de zon weer opkomen over de bergen op het water. Bijzonder om zo wakker te worden. Meteen weer lekker naar buiten. Net als we het ontbijt op hebben, komt de tamales verkoper. Dus breiden we het ontbijt nog maar uit met hartige hap. We zwemmen bij wijze van …", "bloglink": "https://rondjewereld.nl/2016/01/08/loreto/"}, {"titel": "Puerto Escondido, Loreto", "omschrijving": "", "wanneer": "jan 10, 2016", "icon": "campground", "kmstand": 189952, "tripkm": 37458, "land": "Mexico", "staat": "Baja California Sur", "lat": 25.806275, "lng": -111.319383, "dt": 20160110, "ord": 234, "blogsnip": "Voor ons doen laat wakker, om 8 uur. Meteen de schuifdeur open. We pakken rustig in na het ontbijt. Gerhard klets nog wat met Steve over zijn verzameling auto’s en campers. Daarna eerst water kopen bij de supermarkt. En we gooien de tank vol. We slaan af van de hoofdweg …", "bloglink": "https://rondjewereld.nl/2016/01/10/mision-san-francisco-javier/"}, {"titel": "Aguamarina RV Park, La Paz", "omschrijving": "", "wanneer": "jan 11, 2016", "icon": "campground", "kmstand": 190286, "tripkm": 37792, "land": "Mexico", "staat": "Baja California Sur", "lat": 24.150298, "lng": -110.334547, "dt": 20160111, "ord": 235, "blogsnip": "‘s Morgens ontbijten we in de bus, de zon is nog achter de bergen. Om 10 uur rijden we weg, naar La Paz. Eerst door de Sierra Giganta. Prachtig berglandschap, waar de weg snel klimt. Af en toe nog een doorkijkje naar de zee in de verte. Daarna door een …", "bloglink": "https://rondjewereld.nl/2016/01/11/on-the-road-to-la-paz/"}, {"titel": "Todos Santos, BCS, Mexico", "omschrijving": "", "wanneer": "jan 14, 2016", "icon": "campground", "kmstand": 190376, "tripkm": 37882, "land": "Mexico", "staat": "Baja California Sur", "lat": 23.449, "lng": -110.224, "dt": 20160114, "ord": 236, "blogsnip": "Na drie nachten op deze fijne camping gaan we weer verder. We pakken in en gaan eerst boodschappen doen bij Walmart. Ook proberen we bij Autozone een reservelampje te kopen, maar dat lukt niet. Wij hebben 24 Volt nodig, dus moeten we later maar zoeken naar een truck-onderdelenwinkel.", "bloglink": "https://rondjewereld.nl/2016/01/14/todos-santos-music-festival/"}, {"titel": "Restaurant Bar Villa Serena, Cabo Bello, Cabo San Lucas", "omschrijving": "", "wanneer": "jan 16, 2016", "icon": "campground", "kmstand": 190464, "tripkm": 37970, "land": "Mexico", "staat": "Baja California Sur", "lat": 22.907168, "lng": -109.864242, "dt": 20160116, "ord": 237, "blogsnip": "‘s Morgens kletsen we nog wat op de camping. Met verschillende reizigers wisselen we kaartjes uit, zij gaan ook richting Zuid-Amerika. Nog even tanken en dan rijden we naar Cabo San Lucas. Naar deze plaats vliegen veel Noord-Amerikanen. Ook meren cruiseschepen hier aan; we zien uit de verte al 2 …", "bloglink": "https://rondjewereld.nl/2016/01/16/cabo-san-lucas/"}, {"titel": "Rancho Ecologico Sol De Mayo, Santiago, Baja California Sur", "omschrijving": "", "wanneer": "jan 17, 2016", "icon": "campground", "kmstand": 190566, "tripkm": 38072, "land": "Mexico", "staat": "Baja California Sur", "lat": 23.49929, "lng": -109.79031, "dt": 20160117, "ord": 238, "blogsnip": "Vroeg op, veel te doen vandaag. Na het ontbijt skypen we even. Daarna rijden we weg via de Cabos Corridor, een snelweg van 30 km tussen Cabo San Lucas en San José del Cabo. Langs de kust staan grote luxe resorts. In San José del Cabo gaan we naar Walmart …", "bloglink": "https://rondjewereld.nl/2016/01/17/sol-de-mayo/"}, {"titel": "La Trinidad, La Ribera, Baja California Sur, Mexico", "omschrijving": "", "wanneer": "jan 18, 2016", "icon": "campground", "kmstand": 190615, "tripkm": 38121, "land": "Mexico", "staat": "Baja California Sur", "lat": 23.313, "lng": -109.738, "dt": 20160118, "ord": 239, "blogsnip": "Wat een geweldige plek om wakker te worden. Ontbijt in de zon. Weer horen we de bellen van geitjes. Er is hier geen douche. Niet getreurd; we hebben een meertje met waterval voor onszelf. ‘s Morgens zijn er nog geen andere toeristen. Dus hiken we weer naar beneden. Wow, wat …", "bloglink": "https://rondjewereld.nl/2016/01/18/soaking-in-the-mountains/"}, {"titel": "Los Frailes, BCS, Mexico", "omschrijving": "", "wanneer": "jan 19, 2016", "icon": "campground", "kmstand": 190660, "tripkm": 38166, "land": "Mexico", "staat": "Baja California Sur", "lat": 23.380545, "lng": -109.427754, "dt": 20160119, "ord": 240, "blogsnip": "’s Morgens rommelen we een beetje bij de bus. We hebben hier goed internet, dus besteden we de ochtend aan administratie en research voor het vasteland van Mexico. Een Canadese vrouw komt nog wat praten; ze had ons al gespot in Loreto. We tanken en rijden dan naar het zuiden …", "bloglink": "https://rondjewereld.nl/2016/01/19/boondocking-at-los-frailes/"}, {"titel": "Martin Verdugo's Beach Club", "omschrijving": "", "wanneer": "jan 20, 2016", "icon": "campground", "kmstand": 190720, "tripkm": 38226, "land": "Mexico", "staat": "Baja California Sur", "lat": 23.675, "lng": -109.685, "dt": 20160120, "ord": 241, "blogsnip": "Om 7 uur wakker, de zon komt net op. Lekker rustig op het strand. We drinken een kopje thee, Mandy en John komen erbij zitten. Jeremy en Rachelle zijn al actief, zij hebben al gekayakt. Zij rijden ook een Mercedes, een sprinter. Net als John en Mandy hebben ze het …", "bloglink": "https://rondjewereld.nl/2016/01/20/los-barriles/"}, {"titel": "Rancho Verde", "omschrijving": "", "wanneer": "jan 21, 2016", "icon": "campground", "kmstand": 190754, "tripkm": 38260, "land": "Mexico", "staat": "Baja California Sur", "lat": 23.762475, "lng": -109.979004, "dt": 20160121, "ord": 242, "blogsnip": "Na het ontbijt lopen we een stukje over het strand. Vergeleken met gisteren is de zee veel kalmer, de kitesurfers zijn er nog niet. Via een hotelcomplex kunnen we doorsteken naar de straat. Het lijkt wel of er geen enkele kamer bezet is. Bij een supermarktje halen we wat boodschappen …", "bloglink": "https://rondjewereld.nl/2016/01/21/rancho-verde/"}, {"titel": "Playa Tekolote", "omschrijving": "", "wanneer": "jan 22, 2016", "icon": "campground", "kmstand": null, "tripkm": null, "land": "Mexico", "staat": "Baja California Sur", "lat": 24.334956, "lng": -110.312984, "dt": 20160122, "ord": 243, "blogsnip": "‘s Morgens genieten we van de rust op de rancho. Wat een fantastisch weer, elke dag zon en dat in de winter. Eind van de ochtend rijden we weg, richting La Paz. Het is een uur rijden. In La Paz gaan we eerst naar Walmart. In de bus lunchen we …", "bloglink": "https://rondjewereld.nl/2016/01/22/playa-tecolote/"}, {"titel": "Buganbilia Hotel", "omschrijving": "", "wanneer": "jan 25, 2016", "icon": "campground", "kmstand": 190992, "tripkm": 38498, "land": "Mexico", "staat": "Chihuahua", "lat": 26.417, "lng": -108.2, "dt": 20160125, "ord": 244, "blogsnip": "Heerlijk uitgeslapen. Eerst pakken we de bus in en dan gaan we ontbijten bij ons hotel. Het is een familiebedrijf, dus waarschijnlijk is een dochter van de baas onze serveerster. Ze is ontzettend vriendelijk en articuleert heel duidelijk, hoewel we niet alles begrijpen. We eten omelet. Wel weer met tortillas …", "bloglink": "https://rondjewereld.nl/2016/01/25/el-fuerte/"}, {"titel": "Hotel Los Olivos, Los Mochis", "omschrijving": "", "wannee
