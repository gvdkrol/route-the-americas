<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route The Americas 2015–2016</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #eef1f6; color: #1f2937; display: flex; justify-content: center;
  }
  .wrap { width: 1200px; max-width: 100%; background: #f7f9fc; min-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,.08); }

  header {
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    padding: 22px 30px; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
  header p { font-size: 0.9rem; color: #e0e7ff; margin-top: 3px; }
  .badge { background: rgba(255,255,255,.2); color: #fff; padding: 6px 14px;
    border-radius: 20px; font-size: 0.85rem; font-weight: 700; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 18px 24px; }
  .stat { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .stat .val { font-size: 1.8rem; font-weight: 700; color: #4f46e5; }
  .stat .lbl { font-size: 0.72rem; color: #64748b; margin-top: 3px; text-transform: uppercase; letter-spacing: .05em; }

  .controls { padding: 4px 24px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls label { font-size: 0.82rem; color: #475569; font-weight: 600; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #cbd5e1;
    background: #fff; color: #334155; cursor: pointer; font-size: 0.8rem; transition: all .15s; }
  .filter-btn:hover { border-color: #6366f1; color: #4338ca; }
  .filter-btn.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  select { padding: 6px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff;
    color: #334155; font-size: 0.8rem; cursor: pointer; }

  .main-layout { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 460px 250px;
    gap: 14px; padding: 14px 24px; }
  .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .panel-title { padding: 11px 16px; font-size: 0.74rem; font-weight: 700; color: #64748b;
    text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid #eef2f7; }

  #map { height: calc(100% - 40px); width: 100%; }
  .sidebar { display: flex; flex-direction: column; gap: 14px; grid-row: 1 / 3; }
  .list-wrap { padding: 8px; overflow-y: auto; max-height: 260px; }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 6px;
    border-bottom: 1px solid #f1f5f9; cursor: pointer; border-radius: 6px; transition: background .1s; }
  .list-row:hover { background: #f1f5f9; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }
  .row-name { font-size: 0.82rem; flex: 1; color: #334155; }
  .row-cnt { font-size: 0.74rem; color: #475569; background: #eef2f7; padding: 2px 8px; border-radius: 10px; }
  .chart-wrap { padding: 12px; height: calc(100% - 40px); }

  /* marker icons */
  .map-icon { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 14px; }

  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .popup-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; color: #1e293b; }
  .popup-meta { font-size: 0.75rem; color: #64748b; }
  .popup-km { font-size: 0.75rem; color: #4f46e5; margin-top: 4px; font-weight: 600; }
  .popup-desc { font-size: 0.78rem; color: #475569; margin-top: 4px; font-style: italic; }
  .popup-blog { font-size: 0.78rem; color: #334155; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8f0; line-height: 1.4; }
  .popup-more { display: inline-block; margin-top: 5px; font-size: 0.75rem; font-weight: 600; color: #4f46e5; text-decoration: none; }
  .popup-more:hover { text-decoration: underline; }

  .table-section { padding: 0 24px 28px; }
  .table-section h2 { font-size: 0.95rem; color: #334155; margin-bottom: 10px; }
  .table-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .table-scroll { max-height: 460px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  thead th { position: sticky; top: 0; background: #f8fafc; color: #475569; text-align: left;
    padding: 10px 12px; font-weight: 600; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
  tbody td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
  tbody tr:hover { background: #f8fafc; }
  .t-icon { font-size: 1rem; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; grid-template-rows: 380px 220px auto; }
    .sidebar { grid-row: auto; flex-direction: column; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>🌎 Route The Americas</h1>
    <p>April 2015 – Juli 2016 · Gerhard &amp; Lesley</p>
  </div>
  <span class="badge" id="b-km"></span>
</header>

<div class="stats-row">
  <div class="stat"><div class="val" id="s-stops"></div><div class="lbl">Stops</div></div>
  <div class="stat"><div class="val" id="s-states"></div><div class="lbl">Staten / Provincies</div></div>
  <div class="stat"><div class="val" id="s-km"></div><div class="lbl">Trip km</div></div>
  <div class="stat"><div class="val" id="s-countries"></div><div class="lbl">Landen</div></div>
</div>

<div class="controls">
  <label>Land:</label>
  <button class="filter-btn active" data-land="all">Alle</button>
    <button class="filter-btn" data-land="USA">USA</button>
    <button class="filter-btn" data-land="Canada">Canada</button>
    <button class="filter-btn" data-land="Mexico">Mexico</button>
    <button class="filter-btn" data-land="Belize">Belize</button>
    <button class="filter-btn" data-land="Guatemala">Guatemala</button>
    <button class="filter-btn" data-land="Honduras">Honduras</button>
    <button class="filter-btn" data-land="Nicaragua">Nicaragua</button>
    <button class="filter-btn" data-land="Costa Rica">Costa Rica</button>
    <button class="filter-btn" data-land="Panama">Panama</button>
  <label style="margin-left:10px;">Staat/Provincie:</label>
  <select id="state-select"><option value="all">Alle provincies</option></select>
</div>

<div class="main-layout">
  <div class="panel" style="grid-column:1; grid-row:1 / 3;">
    <div class="panel-title">Kaart</div>
    <div id="map"></div>
  </div>
  <div class="sidebar">
    <div class="panel" style="flex:1; display:flex; flex-direction:column;">
      <div class="panel-title">Provincies</div>
      <div class="list-wrap" id="state-list"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Type overnachting</div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>
  </div>
</div>

<div class="table-section">
  <h2>Alle datapunten (<span id="t-count"></span>)</h2>
  <div class="table-box"><div class="table-scroll">
    <table>
      <thead><tr>
        <th></th><th>Titel</th><th>Wanneer</th><th>Type</th>
        <th>Land</th><th>Staat/Provincie</th><th class="num">Trip km</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div></div>
</div>
</div>

<script>
const DATA = [{"titel": "Baltimore", "omschrijving": "Mid-Atlantic Terminal", "wanneer": "apr 9, 2015", "icon": "sea_ports", "kmstand": 152494, "tripkm": 0, "land": "USA", "staat": "Maryland", "lat": 39.239663, "lng": -76.532494, "dt": 20150409, "ord": 0, "blogsnip": "Het is zover: we zijn op reis. Na afscheid op Schiphol van ouders en zus, wachten we op onze vlucht. We zijn vroeg, omdat je vaak geinterviewd wordt voor een vlucht naar Amerika, maar blijkbaar hoeft dat nu niet (we vliegen met IcelandAir). Dus is er voldoende tijd voor een …", "bloglink": "https://rondjewereld.nl/2015/04/09/welcome-to-washington/"}, {"titel": "Comfort Inn Dulles International Airport", "omschrijving": "", "wanneer": "apr 8, 2015", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "USA", "staat": "Maryland", "lat": 38.966873, "lng": -77.369056, "dt": 20150408, "ord": 1, "blogsnip": "Het is zover: we zijn op reis. Na afscheid op Schiphol van ouders en zus, wachten we op onze vlucht. We zijn vroeg, omdat je vaak geinterviewd wordt voor een vlucht naar Amerika, maar blijkbaar hoeft dat nu niet (we vliegen met IcelandAir). Dus is er voldoende tijd voor een …", "bloglink": "https://rondjewereld.nl/2015/04/09/welcome-to-washington/"}, {"titel": "Quality Inn, Takoma Park", "omschrijving": "2 nachten", "wanneer": "apr 9, 2015", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "USA", "staat": "District of Columbia", "lat": 38.984315, "lng": -76.987784, "dt": 20150409, "ord": 2, "blogsnip": "Het is zover: we zijn op reis. Na afscheid op Schiphol van ouders en zus, wachten we op onze vlucht. We zijn vroeg, omdat je vaak geinterviewd wordt voor een vlucht naar Amerika, maar blijkbaar hoeft dat nu niet (we vliegen met IcelandAir). Dus is er voldoende tijd voor een …", "bloglink": "https://rondjewereld.nl/2015/04/09/welcome-to-washington/"}, {"titel": "Comfort Inn, Baltimore", "omschrijving": "3 nachten", "wanneer": "apr 11, 2015", "icon": "rec_lodging", "kmstand": null, "tripkm": null, "land": "USA", "staat": "Maryland", "lat": 39.4017, "lng": -76.6012, "dt": 20150411, "ord": 3, "blogsnip": "Vanmorgen hebben we de wekker gezet, zodat we vroeg downtown kunnen zijn. We parkeren de auto bij een metrostation en pakken al om 8 uur de metro naar de stad. Er zijn al veel mensen op de been voor de Cherry Blossom Parade. Dit is er een festival ter ere …", "bloglink": "https://rondjewereld.nl/2015/04/11/cherry-blossom-parade/"}, {"titel": "Koa Millersville", "omschrijving": "1e campsite", "wanneer": "apr 14, 2015", "icon": "campground", "kmstand": null, "tripkm": null, "land": "USA", "staat": "Maryland", "lat": 39.0194, "lng": -76.639, "dt": 20150414, "ord": 4, "blogsnip": "Vandaag staat in het teken van de bus. Een prima dag, want de weersvoorspelling is de hele dag regen. Na het ontbijt rijden we naar het kantoor van de afhandelaar. Op het parkeerterrein zien we al een Oostenrijkse bus en aan de balie staan Duitsers. De papierhandel gaat super snel …", "bloglink": "https://rondjewereld.nl/2015/04/14/de-bus-is-binnen/"}, {"titel": "Greensboro Holiday Park", "omschrijving": "Hele rustige camping, heerlijk buiten gezeten aan de picknicktafel bij de bus.", "wanneer": "apr 15, 2015", "icon": "campground", "kmstand": 152640, "tripkm": 146, "land": "USA", "staat": "Maryland", "lat": 38.974, "lng": -75.978, "dt": 20150415, "ord": 5, "blogsnip": "‘s Morgens komt er al een zonnetje door, dus kunnen we buiten ontbijten. Lesley gaat een rondje hardlopen op de camping. Hoewel we vroeg op staan, zijn we toch laat in de ochtend weg. We zitten al helemaal in de relax modus en met klusjes rond de bus kun je …", "bloglink": "https://rondjewereld.nl/2015/04/16/cape-henlopen-state-park/"}, {"titel": "Cape Henlopen State Park Campground", "omschrijving": "", "wanneer": "apr 16, 2015", "icon": "campground", "kmstand": 152757, "tripkm": 263, "land": "USA", "staat": "Delaware", "lat": 38.7936, "lng": -75.099, "dt": 20150416, "ord": 6, "blogsnip": "‘s Morgens komt er al een zonnetje door, dus kunnen we buiten ontbijten. Lesley gaat een rondje hardlopen op de camping. Hoewel we vroeg op staan, zijn we toch laat in de ochtend weg. We zitten al helemaal in de relax modus en met klusjes rond de bus kun je …", "bloglink": "https://rondjewereld.nl/2015/04/16/cape-henlopen-state-park/"}, {"titel": "Taylors Island Family Park", "omschrijving": "", "wanneer": "apr 17, 2015", "icon": "campground", "kmstand": 152964, "tripkm": 470, "land": "USA", "staat": "Maryland", "lat": 38.467, "lng": -76.332, "dt": 20150417, "ord": 7, "blogsnip": "Na het ontbijt pakken we nog even de fiets om het State Park verder te bekijken. Dit is een oud fort geweest ten tijde van de Tweede Wereldoorlog. Er staan Fire Control Towers, uitkijktorens die hielpen de kanonnen te richten op de schepen, en de kanonnen en bunkers zelf staan …", "bloglink": "https://rondjewereld.nl/2015/04/17/sleeping-with-the-fishermen/"}, {"titel": "Pocomoke river state forest md", "omschrijving": "", "wanneer": "apr 18, 2015", "icon": "campground", "kmstand": 153105, "tripkm": 611, "land": "USA", "staat": "Maryland", "lat": 38.337, "lng": -75.556, "dt": 20150418, "ord": 8, "blogsnip": "Prima geslapen, viel wel mee met Party Central naast ons. De vissers zijn om 7 uur grotendeels al weg. Na het ontbijt zijn wij ook bijtijds op pad, naar het Blackwater National Wildlife Refuge. Er staat een enorm visitor center in de middle of nowhere, met altijd veel tekst en …", "bloglink": "https://rondjewereld.nl/2015/04/18/blackwater-national-wildlife-refuge/"}, {"titel": "First Landing State Park, VA", "omschrijving": "Rustige camping maar stromende regen.Veel plassen.", "wanneer": "apr 19, 2015", "icon": "campground", "kmstand": 153282, "tripkm": 788, "land": "USA", "staat": "Virginia", "lat": 36.904, "lng": -76.018, "dt": 20150419, "ord": 9, "blogsnip": "Het heeft vannacht enorm geregend, de hele camping staat blank. Maar inmiddels is het droog, dus maken we nog even een strandwandeling voordat we vertrekken. We rijden naar Naval Station Norfolk, de grootste marinebasis ter wereld. Je kunt hier een toertje doen, maar we hebben die van 11 uur net …", "bloglink": "https://rondjewereld.nl/2015/04/20/in-the-navy/"}, {"titel": "Anvill Campground, Williamsburg, VA", "omschrijving": "3 nachten op een commerciele camping. Veel aanspraak van andere campeerders.", "wanneer": "apr 20, 2015", "icon": "campground", "kmstand": 153404, "tripkm": 910, "land": "USA", "staat": "Virginia", "lat": 37.296, "lng": -76.73, "dt": 20150420, "ord": 10, "blogsnip": "Het heeft vannacht enorm geregend, de hele camping staat blank. Maar inmiddels is het droog, dus maken we nog even een strandwandeling voordat we vertrekken. We rijden naar Naval Station Norfolk, de grootste marinebasis ter wereld. Je kunt hier een toertje doen, maar we hebben die van 11 uur net …", "bloglink": "https://rondjewereld.nl/2015/04/20/in-the-navy/"}, {"titel": "Pocahontas State Park", "omschrijving": "Rustige plek in het bos", "wanneer": "apr 23, 2015", "icon": "campground", "kmstand": 153615, "tripkm": 1121, "land": "USA", "staat": "Virginia", "lat": 37.385, "lng": -77.574, "dt": 20150423, "ord": 11, "blogsnip": "Het is zonnig weer, maar met een frisse wind. Wel warm genoeg om lekker buiten te ontbijten. We rijden na het inpakken naar Yorktown Battlefield en zijn net op tijd om de film en daarna de ranger talk mee te pakken. Op dit slagveld heeft de laatste grote veldslag plaatsgevonden …", "bloglink": "https://rondjewereld.nl/2015/04/23/battlefield-yorktown/"}, {"titel": "Small Country Campground", "omschrijving": "Heel goedkoop een nachtje in de regen. Koud.", "wanneer": "apr 25, 2015", "icon": "campground", "kmstand": 153735, "tripkm": 1241, "land": "USA", "staat": "Maryland", "lat": 38.017, "lng": -77.974, "dt": 20150425, "ord": 12, "blogsnip": "Zoals voorspeld regent het al vroeg. Maar wij zijn er op voorbereid en hebben alles al ingepakt. Met een half uur rijden we naar Richmond, waar we weer aardig moeten zoeken voor een parkeerplek. Overal garages en daar passen we niet in. We bezoeken het Museum of the Confederacy and …", "bloglink": "https://rondjewereld.nl/2015/04/25/rainy-richmond/"}, {"titel": "Misty Mountain Camp Resort, Crozet, VA", "omschrijving": "Rustige campground waar afgelopen een Jeepweekend is geweest. Veel modder.", "wanneer": "apr 26, 2015", "icon": "campground", "kmstand": 153820, "tripkm": 1326, "land": "USA", "staat": "Maryland", "lat": 38.03, "lng": -78.706, "dt": 20150426, "ord": 13, "blogsnip": "Na alle regen van gisteren is het vanochtend opeens droog. We zijn laat wakker, blijkbaar maakt kou ook moe. Na het ontbijt vertrekken we voor boodschappen; een kar vol, want we gaan de natuur in. In de Walmart is het ook ijskoud van alle koelingen, snel opwarmen buiten.", "bloglink": "https://rondjewereld.nl/2015/04/26/mooi-monticello/"}, {"titel": "Luray KOA, Luray, VA", "omschrijving": "Het was te koud in Shenandoah National Park (1200 m) dus maar wat afgezakt.", "wanneer": "apr 26, 2015", "icon": "campground", "kmstand": 153989, "tripkm": 1495, "land": "USA", "staat": "Maryland", "lat": 38.66, "lng": -78.46, "dt": 20150426, "ord": 14, "blogsnip": "Na alle regen van gisteren is het vanochtend opeens droog. We zijn laat wakker, blijkbaar maakt kou ook moe. Na het ontbijt vertrekken we voor boodschappen; een kar vol, want we gaan de natuur in. In de Walmart is het ook ijskoud van alle koelingen, snel opwarmen buiten.", "bloglink": "https://rondjewereld.nl/2015/04/26/mooi-monticello/"}, {"titel": "North Fork RV Resort, Front Royal, VA", "omschrijving": "Plekje aan de rivier.", "wanneer": "apr 28, 2015", "icon": "campground", "kmstand": 154076, "tripkm": 1582, "land": "USA", "staat": "Maryland", "lat": 38.939, "lng": -78.19, "dt": 20150428, "ord": 15, "blogsnip": "We zijn lekker op tijd weg bij de camping en gaan naar Luray Caverns, een grottenstelsel. De grootte van de parkeerplaats doet vermoeden dat dit een enorme toeristische attractie is, maar binnen is het nog heel rustig. We doen een toertje; interessant met mooie formaties en een glasheldere weerspiegling van …", "bloglink": "https://rondjewereld.nl/2015/04/28/hiking-shenandoah-national-park/"}, {"titel": "Greenbrier State Park, Boonsboro, MD", "omschrijving": "", "wanneer": "apr 29, 2015", "icon": "campground", "kmstand": 154211, "tripkm": 1717, "land": "USA", "staat": "Maryland", "lat": 39.509, "lng": -77.659, "dt": 20150429, "ord": 16, "blogsnip": "Het is heerlijk weer als we opstaan. Aangezien we geen grote plannen hebben voor vandaag, hangen we lekker rond op de camping. We zijn zo aan het relaxen dat we opeens nog moeten haasten om voor 11 uur van de camping af te zijn. Normaal gesproken mag je langer blijven …", "bloglink": "https://rondjewereld.nl/2015/04/29/greenbrier-state-park/"}, {"titel": "Artillery Ridge, Gettysburg, PA", "omschrijving": "", "wanneer": "apr 30, 2015", "icon": "campground", "kmstand": 154301, "tripkm": 1807, "land": "USA", "staat": "Pennsylvania", "lat": 39.83, "lng": -77.23, "dt": 20150430, "ord": 17, "blogsnip": "Er is voor vandaag regen voorspeld, maar als we laat wakker worden is het heerlijk weer. Dus ontbijten we buiten en schieten we snel in de kleren om te hiken rond het meer. Heerlijk rustig hier. We zien nog een specht. Terug bij de bus aan de koffie, kaart op …", "bloglink": "https://rondjewereld.nl/2015/04/30/gettysburg/"}, {"titel": "Loose Kaboose, Kinzers, PA", "omschrijving": "", "wanneer": "May 1, 2015", "icon": "campground", "kmstand": 154511, "tripkm": 2017, "land": "USA", "staat": "Pennsylvania", "lat": 39.99, "lng": -76.028, "dt": 20150501, "ord": 18, "blogsnip": "Vandaag zou het weer regenen, maar we hebben mazzel, het is droog. Wel is het behoorlijk fris, vesten aan. We zijn al vroeg op weg om de Battlefield Auto Tour te doen, een auto route langs belangrijke punten in de slag van Gettysburg. Er staan hier zo’n 1.300 monumenten van …", "bloglink": "https://rondjewereld.nl/2015/05/01/go-anywhere/"} ground", "kmstand": 155734, "tripkm": 3240, "land": "USA", "staat": "New York", "lat": 42.107, "lng": -74.003, "dt": 20150510, "ord": 28, "blogsnip": "We zijn vroeg wakker, want het is heet in de bus. Straks op zoek naar een laken voor vanavond, want een dekbed is te warm. Op de lege camping is het alweer heerlijk buiten. We rijden vandaag door de Catskill Mountains. Bij Pratt Rock gaan we rock carvings bekijken. Volgens …", "bloglink": "https://rondjewereld.nl/2015/05/10/we-were-in-woodstock-man/"}, {"titel": "Yogi Bear Jellystone, Greenfield Park, NY", "omschrijving": "", "wanneer": "May 11, 2015", "icon": "campground", "kmstand": 155863, "tripkm": 3369, "land": "USA", "staat": "New York", "lat": 41.737, "lng": -74.557, "dt": 20150511, "ord": 29, "blogsnip": "Meteen al heerlijk weer. We ontbijten en pakken de boel in. Eerst nog even een foto op de camping naast een fire truck (een oude, voor de sier). Dan rijden we een uurtje naar Hyde Park, waar het huis van president Franklin D. Roosevelt staat. We zijn precies op tijd …", "bloglink": "https://rondjewereld.nl/2015/05/11/visiting-fdr/"}, {"titel": "River Beach Campsite, Milford, PA", "omschrijving": "", "wanneer": "May 12, 2015", "icon": "campground", "kmstand": 155971, "tripkm": 3477, "land": "USA", "staat": "New Jersey", "lat": 41.325, "lng": -74.797, "dt": 20150512, "ord": 30, "blogsnip": "Het is bewolkt en daardoor iets minder heet. Prima weer voor hardlopen en relaxen. Laat in de ochtend vertrekken we naar Bethel Woods, de plek van het Woodstock festival in 1969; the real Woodstock. Dit is nog steeds een festival terrein; het Nederlandse concept Mysteryland is aan het opbouwen voor …", "bloglink": "https://rondjewereld.nl/2015/05/12/the-real-woodstock/"}, {"titel": "Liberty Harbour RV, Jersey City, NJ", "omschrijving": "", "wanneer": "May 13, 2015", "icon": "campground", "kmstand": 156145, "tripkm": 3651, "land": "USA", "staat": "New Jersey", "lat": 40.725, "lng": -74.049, "dt": 20150513, "ord": 31, "blogsnip": "Vandaag is het aanzienlijk frisser; lange broek en vest aan. Best even lekker na al die hitte. We doen in Milford eerst boodschappen. Nadat we bij de slijterij zijn geweest en willen oversteken, spreekt iemand op straat ons aan over de bus. Als ie hoort dat we uit Nederland komt …", "bloglink": "https://rondjewereld.nl/2015/05/13/nature-to-city/"}, {"titel": "Hopewell Junction, NY, USA", "omschrijving": "", "wanneer": "May 17, 2015", "icon": "campground", "kmstand": 156308, "tripkm": 3814, "land": "USA", "staat": "New York", "lat": 41.581, "lng": -73.803, "dt": 20150517, "ord": 32, "blogsnip": "Gisteravond heeft het flink geregend, dus de camping is nogal modderig. We pakken de boel in en rijden weg uit lovely New York. Omdat we de laatste dagen geen internet hadden (bij de camping lukte inloggen niet en onze eigen kaart was op), stoppen we eerst langs de snelweg bij …", "bloglink": "https://rondjewereld.nl/2015/05/17/back-on-the-road-again-2/"}, {"titel": "Hammonasset Beach State Park, Clinton, CT", "omschrijving": "", "wanneer": "May 18, 2015", "icon": "campground", "kmstand": 156508, "tripkm": 4014, "land": "USA", "staat": "Connecticut", "lat": 41.261, "lng": -72.527, "dt": 20150518, "ord": 33, "blogsnip": "Het is vannochtend bewolkt, waardoor het een stuk koeler is. We zitten weer in de relax-stand, dus met ontbijten, klusjes en hardlopen is de ochtend snel voorbij. Voor het eerst moest je 2 kwartjes betalen om te douchen, maar dan heb je ook een goede douche (vaak moet je je …", "bloglink": "https://rondjewereld.nl/2015/05/18/to-the-coast-of-connecticut/"}, {"titel": "Seaport RV Resort, Old Mystic, CT", "omschrijving": "", "wanneer": "May 19, 2015", "icon": "campground", "kmstand": 156666, "tripkm": 4172, "land": "USA", "staat": "Connecticut", "lat": 41.368, "lng": -71.966, "dt": 20150519, "ord": 34, "blogsnip": "Zoals al voorspeld was, regent het. Niet hard, vooral miezer. Gelukkig moeten we vandaag boodschappen doen, dus daar zijn we de ochtend mee zoet. Walmart is altijd leuk. We lunchen op de parkeerplaats in de bus. In New Haven willen we een museum bekijken, maar we kunnen niet echt een …", "bloglink": "https://rondjewereld.nl/2015/05/19/mistig-mystic/"}, {"titel": "Holiday Acres Camping Resort, North Scituate, RI", "omschrijving": "", "wanneer": "May 20, 2015", "icon": "campground", "kmstand": 156768, "tripkm": 4274, "land": "USA", "staat": "Rhode Island", "lat": 41.803, "lng": -71.596, "dt": 20150520, "ord": 35, "blogsnip": "Vannacht heeft het enorm hard geregend met onweer. Fijn om dan in een bus te liggen en niet in een tent. Vanmorgen is het helder, met een zonnetje en een fris windje. We ontbijten nog wel even binnen en gaan al vroeg weg. We gaan naar Mystic Seaport, een soort …", "bloglink": "https://rondjewereld.nl/2015/05/20/ahoy-sailor/"}, {"titel": "Melville Pond Campground, Portsmouth, RI", "omschrijving": "", "wanneer": "May 21, 2015", "icon": "campground", "kmstand": 156872, "tripkm": 4378, "land": "USA", "staat": "Rhode Island", "lat": 41.607, "lng": -71.235, "dt": 20150521, "ord": 36, "blogsnip": "De zon schijnt vandaag en de wind is fris. Elke dag weer een verrassing wat het weer doet. Hoe we het doen weten we niet, maar ontbijten, douchen en een beetje rommelen rond de camper kost al snel 2,5 uur. Blijkbaar zijn we heel sloom geworden. We rijden in een …", "bloglink": "https://rondjewereld.nl/2015/05/21/pretty-providence/"}, {"titel": "Shady Knoll Campground, Brewster, MA", "omschrijving": "", "wanneer": "May 22, 2015", "icon": "campground", "kmstand": 157032, "tripkm": 4538, "land": "USA", "staat": "Massachusetts", "lat": 41.762, "lng": -70.065, "dt": 20150522, "ord": 37, "blogsnip": "Het is heerlijk crisp weer, fris en helder. We rijden naar Newport, een plaats waar ruim een eeuw geleden de oude New Yorkse upperclass de zomer doorbracht. Er staan enorme huizen, die je kunt bezichtigen. In 2004 zijn we hier ook geweest en bekeken we The Breakers, de grootste mansion …", "bloglink": "https://r
